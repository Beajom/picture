services:
  - type: web
    name: amazon-ppc-intelligence
    runtime: node
    repo: https://github.com/Beajom/picture
    branch: main
    rootDir: amazon-ppc-intelligence
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NEXT_PUBLIC_DATA_MODE
        value: demo
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: LINGXING_GATEWAY_URL
        sync: false
      - key: SIF_API_URL
        sync: false
