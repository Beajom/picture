plugins { id 'com.android.application' }
android {
  namespace 'com.beajom.weddingplanner'
  compileSdk 35
  defaultConfig {
    applicationId 'com.beajom.weddingplanner'
    minSdk 26
    targetSdk 34
    versionCode 1
    versionName '1.0.0'
  }
  buildFeatures { buildConfig true }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  signingConfigs {
    production {
      if (System.getenv('WEDDING_KEYSTORE_FILE')) {
        storeFile file(System.getenv('WEDDING_KEYSTORE_FILE'))
        storePassword System.getenv('WEDDING_STORE_PASSWORD')
        keyAlias System.getenv('WEDDING_KEY_ALIAS')
        keyPassword System.getenv('WEDDING_KEY_PASSWORD')
      }
    }
  }
  buildTypes {
    release {
      minifyEnabled false
      if (System.getenv('WEDDING_KEYSTORE_FILE')) signingConfig signingConfigs.production
    }
    debug { debuggable true }
  }
}
