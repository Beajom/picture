","body":["销售额=自然订单销售额+广告归因销售额","总利润=销售收入−商品与履约成本−广告花费−其他经营成本","销量增长与净利润增长要分开评估。","产出：单件贡献毛利与日利润。"],"images":[]},{"id":"s005","slide":5,"chapter":"01","title":"广告前毛利与广告后净利","kind":"course","body":["广告前毛利应扣除采购、头程、平台佣金、配送和可归属费用","广告单利润=广告前单件贡献毛利−CPA","自然订单也有促销与经营成本。","产出：明确每个 ASIN 允许的 CPA。"],"images":[]},{"id":"s006","slide":6,"chapter":"01","title":"投资型广告与盈利型广告","kind":"course","body":["CPA低于单件贡献毛利，广告单可直接贡献利润","CPA高于贡献毛利时属于投资或亏损型投入","若无法证明自然增量，不应无期限维持亏损。","产出：把活动按经营目的标记。"],"images":[]},{"id":"s007","slide":7,"chapter":"01","title":"ACOS、ROAS、TACOS 的区别","kind":"course","body":["ACOS=广告花费/广告归因销售额","ROAS=广告归因销售额/广告花费","TACOS=广告花费/整体销售额","同一期间、币种与归因窗口才能比较。","产出：统一报表口径。"],"images":[]},{"id":"s008","slide":8,"chapter":"01","title":"自然销售占比为何影响 TACOS","kind":"course","body":["若广告单价与自然单价相近，则TACOS≈ACOS×广告销售占比","降低TACOS既可减少广告成本，也可提高自然销售占比","单独缩量可能伤害总单量。","产出：每周跟踪三者的联动。"],"images":[]},{"id":"s009","slide":9,"chapter":"01","title":"目标利润倒推广告预算","kind":"course","body":["日广告预算不能只看系统建议","用保守CVR与目标CPC推算CPA，再由单件利润、库存和现金流确定可承受投放","测试预算和常态预算区分。","产出：推广预算边界。"],"images":[]},{"id":"s010","slide":10,"chapter":"01","title":"同样 TACOS 下的利润差异","kind":"course","body":["相同TACOS不代表利润相同","单价、毛利率、退货率、优惠、自然销售占比会改变净利润","按SKU看单件毛利，按父体看总利润。","产出：利润表而不是只看广告后台。"],"images":[]},{"id":"s011","slide":11,"chapter":"01","title":"价格上调与促销的连锁反应","kind":"course","body":["提价可能改善单件毛利但降低CTR/CVR","降价可提高短期转化却压缩利润","比较价格策略需要同时看净利润、排名和自然销售额。","产出：价格测试前后对照。"],"images":[]},{"id":"s012","slide":12,"chapter":"01","title":"30%毛利率不等于30%可花广告费","kind":"course","body":["广告费以外还有返货、仓储、促销和税费","“毛利率”必须写清计算口径","盈利型活动的目标ACOS通常应低于净贡献毛利率。","产出：独立核算盈亏平衡ACOS。"],"images":[]},{"id":"s013","slide":13,"chapter":"01","title":"重点知识延伸：利润=订单*单件利润=流量*转化*单件利润-推广费用","kind":"extension","body":["利润=订单*单件利润=流量*转化*单件利润-推广费用","流量=站内流量+站外流量（facebook, 促销网站）","站内流量=类目流量（销量结果体现）+ 搜索流量 （搜索词+有效位置） +广","单品利润=（广告单+自然单）*单价-头程运输成本-尾端配","广告单利润 = （单个毛利-广告CPA）* 广告单量 [CPA= ad Spend/ ad order]"],"images":[]},{"id":"s014","slide":14,"chapter":"01","title":"重点知识延伸：总利润=自然单利润+盈利型广告利润+投资性广告利…","kind":"extension","body":["总利润=自然单利润+盈利型广告利润+投资性广告利润 （亏钱）","一．当广告能产生利润的时候，即盈利型广告我们要做大广告单，并且拉大CPA与毛利之间的差距","二．当广告不能产生利润，即投资型广告，我们要利用广告做大自然单，并控制广告亏损的比例，让","cone (有效搜索词 【 每个词下都有一个自然排名坑位 】+ 有效位置 ) 【免费 】","【有效流量词数量 /流量词搜索量大小 /有效位置高低 】"],"images":[]},{"id":"s015","slide":15,"chapter":"01","title":"重点知识延伸：【广告流量词数量 /流量词搜索量大小有效位置高低…","kind":"extension","body":["【广告流量词数量 /流量词搜索量大小有效位置高低 /广告类型 /广告有效时长 】","Rufus-- 推荐搜索词 /直接推送产品本身 /问答增加转化率 -- 倒推受众 ( 埋词 )","单品利润 = (广告单 + 自然单 ) * 单价 - 头程运输成本 - 尾端配送成本","本身不产生盈利 -- 投资型广告 -- 未来自然单带来的利润","本身能产生一利 -- 盈利型广告 -- 本身带来的利润 + 带动自然单的利润"],"images":[]},{"id":"s016","slide":16,"chapter":"01","title":"重点知识延伸：总单量 = 自然单 + 盈利型广告单 + 投资型广告单","kind":"extension","body":["总单量 = 自然单 + 盈利型广告单 + 投资型广告单","总利润 = 自然单利润 (+) + 盈利型广告利润 (+) + 投资性广告利润 (-)","一 ， 当广告能产生利润的时候 ， 即盈利型广告我们要做大广告单 ， 并且拉大 ACOS 与毛利率之间的差","二 . 当广告不能产生利润 ， 即投资型广告 ,我们要利用广告做大自然单 ， 并控制广告亏损的比例 ， 让"],"images":[]},{"id":"s017","slide":17,"chapter":"01","title":"本章实操练习与自测","kind":"practice","body":["写出本模块最重要的3个可验证假设。","列出执行前需要的报表、时间范围与产品范围。","给出一个可以在7天内验证、可回滚的调整动作。","记录预期改善的指标与可能损失的指标。","完成一页自己的案例后再进入下一章。"],"images":[]},{"id":"s019","slide":19,"chapter":"02","title":"站内六类流量入口","kind":"course","body":["搜索自然位、付费广告位、商品详情页关联、类目/榜单、促销位置、品牌店铺/智能推荐","不同入口在曝光、点击和购买路径上不同。","产出：自己的入口地图。"],"images":[]},{"id":"s020","slide":20,"chapter":"02","title":"搜索结果页与商品详情页","kind":"course","body":["搜索结果包括自然位和SP/SB/SBV等广告位","商品详情页还有商品定向和关联推荐","同一点击来源不代表同一关键词权重机制。","产出：按入口标注活动。"],"images":[]},{"id":"s021","slide":21,"chapter":"02","title":"自然位、广告位和促销位","kind":"course","body":["自然结果和付费广告常同时出现，但搜索页面动态变化","促销、榜单和推荐入口的分配逻辑不同","不把“页面有坑位”理解成“必然获得自然流量”。","产出：真实搜索页观察记录。"],"images":[]},{"id":"s022","slide":22,"chapter":"02","title":"四层购买漏斗","kind":"course","body":["查询曝光→点击→加购→购买","CTR反映点击吸引力，CVR反映购买效率","SQP还可观察ASIN份额，切勿把不同阶段份额当成转化率。","产出：四层漏斗诊断表。"],"images":[]},{"id":"s023","slide":23,"chapter":"02","title":"有效流量入口的三要素","kind":"course","body":["相关查询数量、查询市场规模、获得的展示位置","少量大词和大量小词会形成不同的广告预算结构。","产出：头部词集中度。"],"images":[]},{"id":"s024","slide":24,"chapter":"02","title":"关联推荐不是自然搜索","kind":"course","body":["FBT、Customers also bought、newer model、keep shopping等是不同的推荐触点","可做商品定向与Listing关联性调研，但不能混为关键词自然排名。","产出：关联ASIN列表。"],"images":[]},{"id":"s025","slide":25,"chapter":"02","title":"展示位、CTR、CVR必须联动","kind":"course","body":["TOS的CTR高与PP的CTR低可能主要来自位置差异","不要拿整体CTR直接与某一个自然搜索位比","同词、同位、同时期更有可比性。","产出：位置分组KPI。"],"images":[]},{"id":"s026","slide":26,"chapter":"02","title":"曝光、点击、加购、购买是四个不同环节","kind":"case","body":["搜索曝光","查询总量","点击","CTR","加购","ATC rate","购买","CVR","漏斗数字仅为示意；具体结果请使用同一时间、同一站点的后台数据。"],"images":[]},{"id":"s027","slide":27,"chapter":"02","title":"SQP搜索词漏斗：全站与ASIN份额","kind":"case","body":["逐段区分曝光、点击、加购和购买；不同阶段分母不能混用。","历史案例的绝对数值不代表当前广告建议；请按真实账户重新验证。"],"images":["case-027-1.webp"]},{"id":"s028","slide":28,"chapter":"02","title":"重点知识延伸：TRB：Top Rated From Our B…","kind":"extension","body":["TRB：Top Rated From Our Brands，高评价品牌，包括Top Rated From Our Brands，Amazon Exclusives等亚马逊自有品牌项目的栏位","CPF：Climate Pledge Friendly，气候友好承诺，此栏位同时包含了自然和广告位，计算流量时会区分自然和广告流量","OOR：Organic Other Recommendations，其他自然推荐位，包括New Arrivals，Featured From The Store等其他自然流量推荐位"],"images":[]},{"id":"s029","slide":29,"chapter":"02","title":"重点知识延伸：SOR：Sponsored Other Reco…","kind":"extension","body":["SOR：Sponsored Other Recommendations，其他广告推荐位，包括Customers Frequently Viewed，Today's Deal等其他广告流量推荐位","广告类型 占坑位 提升关键词权重 买单量 (CPA) 品牌宣传","广告结构=短期投资型广告+长期投资型广告+防御型广告+盈利广告","二．占坑 （占坑性价比，VCPM 千次曝光的花费）","搜索结果页对应的流量词 / 商品详情页对应的 ASIN"],"images":[]},{"id":"s030","slide":30,"chapter":"02","title":"本章实操练习与自测","kind":"practice","body":["写出本模块最重要的3个可验证假设。","列出执行前需要的报表、时间范围与产品范围。","给出一个可以在7天内验证、可回滚的调整动作。","记录预期改善的指标与可能损失的指标。","完成一页自己的案例后再进入下一章。"],"images":[]},{"id":"s032","slide":32,"chapter":"03","title":"广告会不会直接决定自然排名","kind":"course","body":["课件用“累计表现、短期预期表现和实际销量”解释排名变化","这是经营分析模型，而非公开固定的亚马逊排名公式","需用自然位、订单和竞争变化联合验证。","产出：排名变化假设。"],"images":[]},{"id":"s033","slide":33,"chapter":"03","title":"相关性与成交效率是底层变量","kind":"course","body":["查询和商品是否匹配决定是否有机会展示","点击率、转化率、销量及客户体验影响实际效果","只有竞价高不一定能维持自然位。","产出：相关性筛查。"],"images":[]},{"id":"s034","slide":34,"chapter":"03","title":"预期坑产与实际坑产","kind":"course","body":["预期表现可用潜在曝光×预期CTR×预期CVR描述","真实成交还取决于实际流量、转化、售价与履约","预期较强不保证长期自然位稳定。","产出：期望值与实际值两列。"],"images":[]},{"id":"s035","slide":35,"chapter":"03","title":"正向、无效和反向干预","kind":"course","body":["广告数据相对竞争基准表现好，可能帮助产品建立有效成交信号","表现差可能没有帮助甚至增加成本","不要将短期图形相关性等同因果。","产出：观察7–14天对照。"],"images":[]},{"id":"s036","slide":36,"chapter":"03","title":"CPR的正确位置","kind":"course","body":["CPR是第三方工具对一定排名区间所需销量的估计，不是亚马逊官方要求","不同词有不同搜索量、竞品强度和难度","8天值只能当预算量级参考。","产出：CPR×CPA压力测试。"],"images":[]},{"id":"s037","slide":37,"chapter":"03","title":"自然排名上限与真实表现","kind":"course","body":["上升到某区间后可能遇到CTR/CVR/价格/评价门槛","不能通过无限提高广告预算保证继续上升","要改善产品吸引力和实际利润。","产出：上限诊断清单。"],"images":[]},{"id":"s038","slide":38,"chapter":"03","title":"排名稳定不代表广告必须持续","kind":"course","body":["有些排名靠持续自然订单维稳，有些依赖阶段性广告","停止广告做对照时要考虑季节和竞品变动","以自然单和净利润为最终判据。","产出：可回滚减量试验。"],"images":[]},{"id":"s039","slide":39,"chapter":"03","title":"7天、14天并非官方固定窗口","kind":"course","body":["课件采用7–14天作为短期干预和观察节奏","商品、季节、体量与平台数据回传会改变所需样本","优先确保点击、订单样本量足够。","产出：观察周期预设。"],"images":[]},{"id":"s040","slide":40,"chapter":"03","title":"站外折扣与实际GMV","kind":"course","body":["站外流量可提供真实购买，但需要计入折扣、退款、履约成本","禁止虚假订单、操纵评论和其他违规干预","重点评估真实新增购买与利润。","产出：促销ROI算表。"],"images":[]},{"id":"s041","slide":41,"chapter":"03","title":"历史关键词：搜索量与CPR的关系","kind":"case","body":["数据表：\n关键词 | 历史搜索量 | 历史CPR\ncompression socks for women | 411,439 | 521\ncompression socks men | 132,520 | 183\ncompression socks | 78,422 | 128\nnurse accessories for work | 31,687 | 63\nmedias de compresión para mujer | 20,359 | 48\ncompression socks for women wide ... | 19,331 | 48","CPR是第三方历史估算，不等于官方销量要求；按相关性和利润测算可承受的推词范围。"],"images":[]},{"id":"s042","slide":42,"chapter":"03","title":"搜索位变化：广告投入与自然位","kind":"case","body":["把排名曲线与订单和广告位同期分析，避免只看名次上升。","历史案例的绝对数值不代表当前广告建议；请按真实账户重新验证。"],"images":["case-042-1.webp"]},{"id":"s043","slide":43,"chapter":"03"," title":"市场建议竞价只是参考","kind":"course","body":["低/中/高建议出价是系统建议，不是竞品真实成交价","具体账户历史、相关性和广告策略会影响实际CPC。","产出：市场竞价样本。"],"images":[]},{"id":"s139","slide":139,"chapter":"08","title":"竞价市调5–10词","kind":"course","body":["挑选卖家争夺较多、相关性高的主词，使用类似匹配方式调研","对比工具与后台竞价区间，检查极端值和账号偏差。","产出：低/中/高区间。"],"images":[]},{"id":"s140","slide":140,"chapter":"08","title":"新品没有历史CPC怎么办","kind":"course","body":["先用工具和后台建议竞价估范围，再用小预算测试得到自己的CPC","不使用竞品数据直接承诺新品的真实成本。","产出：基准出价区间。"],"images":[]},{"id":"s141","slide":141,"chapter":"08","title":"老品竞价应该用真实数据","kind":"course","body":["对照历史CPC、实际广告位分布、CVR、出单成本和自然排名","在高权重情况下可小步降价试探，但需要监控曝光和利润。","产出：降价试验日志。"],"images":[]},{"id":"s142","slide":142,"chapter":"08","title":"CPA和CPC/CVR的关系","kind":"course","body":["CPA=CPC/CVR在相同归因与统计口径下成立","CPC降10%或CVR提高10%都可能改善CPA，但改善路径对销量影响不同。","产出：成本敏感性表。"],"images":[]},{"id":"s143","slide":143,"chapter":"08","title":"CTR和CVR先与位置比较","kind":"course","body":["整体CTR受PP比例影响显著","找同类同位置对照，CVR还需排除误投与Listing问题","不把某个通用阈值当平台标准。","产出：表现是否正向的判断。"],"images":[]},{"id":"s144","slide":144,"chapter":"08","title":"测款与竞价测试的先后","kind":"course","body":["先证实可获得相关曝光，再测CTR/CVR和CPA","观察3–7天竞价与更长的转化表现","不同销量规模的样本周期不同。","产出：测款执行日历。"],"images":[]},{"id":"s145","slide":145,"chapter":"08","title":"测试预算为何不能过大","kind":"course","body":["历史课程用预估CPA×3–5倍等粗估日预算","目标是获得足够样本而非无限烧钱","结合现金流和亏损上限设硬止损。","产出：试验止损线。"],"images":[]},{"id":"s146","slide":146,"chapter":"08","title":"广告投资计划：预算与CPA","kind":"case","body":["数据表：\n指标 | 案例数值 | 计算说明\n单次广告成交成本CPA | $10 | 花费/广告订单\n设定日预算 | $200 | 允许的日广告花费\n目标广告订单数 | 20单 | 预算 ÷ CPA\n是否盈利 | 待算 | 需要单件贡献毛利","活动预算只是允许消耗的花费上限，不能保证一定产生20单；需要关注真实转化和广告归因。"],"images":[]},{"id":"s147","slide":147,"chapter":"08","title":"10个词的历史竞价调研区间","kind":"case","body":["数据表：\n样本 | 低位($) | 中位($) | 高位($)\n01 | 1.28 | 1.59 | 2.22\n02 | 1.25 | 1.61 | 2.06\n03 | 1.24 | 1.48 | 1.62\n04 | 0.98 | 1.35 | 1.68\n05 | 1.05 | 1.25 | 1.33\n06 | 0.90 | 1.13 | 1.37\n07 | 0.96 | 1.24 | 1.52\n08 | 1.13 | 1.40 | 1.45\n09 | 1.00 | 1.22 | 1.41\n10 | 0.70 | 1.00 | 1.41","建议竞价是历史区间，不是实际CPC或当下市场价格。"],"images":[]},{"id":"s148","slide":148,"chapter":"08","title":"低中高竞价调研样本","kind":"case","body":["通过同一组高相关主词估算市场建议竞价区间。","历史案例的绝对数值不代表当前广告建议；请按真实账户重新验证。"],"images":["case-148-1.webp"]},{"id":"s149","slide":149,"chapter":"08","title":"后台与工具竞价区间比较","kind":"case","body":["判断账号历史与市场建议价之间的差异。","历史案例的绝对数值不代表当前广告建议；请按真实账户重新验证。"],"images":["case-149-1.webp"]},{"id":"s150","slide":150,"chapter":"08","title":"新品表现：搜索词点击与转化","kind":"case","body":["CTR和CVR要在可比查询与广告位条件下判断。","历史案例的绝对数值不代表当前广告建议；请按真实账户重新验证。"],"images":["case-150-1.webp"]},{"id":"s151","slide":151,"chapter":"08","title":"品类基准数据的应用","kind":"case","body":["先确认节点、分类、样本周期是否可比。","历史案例的绝对数值不代表当前广告建议；请按真实账户重新验证。"],"images":["case-151-1.webp"]},{"id":"s152","slide":152,"chapter":"08","title":"重点知识延伸：新链接预估单次出单成本CPA，老链接的CPA是否可下降","kind":"extension","body":["新链接预估单次出单成本CPA，老链接的CPA是否可下降","既然亚马逊广告是暗投竞争广告位，有什么地方能知道别人的出价呢？","1. 胜出竞价 - 可以买到广告位 （低，中，高）","建议竞价（低）：可以判断最低获取广告位的价格，一般为","建议竞价（高）：判断TOS位置起始价格 （高竞价）"],"images":[]},{"id":"s153","slide":153,"chapter":"08","title":"重点知识延伸：投放卖家基数大的投放词 -- 点击排序或订单排序…","kind":"extension","body":["1. 投放卖家基数大的投放词 -- 点击排序或订单排序下的准词 / 自己的准词表中搜索量大的词","3. 多个数据参考排除偶然性 -- 选择5~10个词","1. 流量词表中选择5~10个准的大流量词精准匹配","广告系统的价格歧视 使用有爬取建议竞价功能的工具软件进行对比","未推广产品（无历史数据）CPC预估方法1—— 工具软件"],"images":[]},{"id":"s154","slide":154,"chapter":"08","title":"重点知识延伸：工具软件查流量词，选5~10个最大流量词，精准投…","kind":"extension","body":["1. 工具软件查流量词，选5~10个最大流量词，精准投放（最多人投放）","未推广产品（无历史数据）CPC预估方法 2 ——账号后台","第二步：SKU开广告--投放调研出的前10搜索量大词，实际投放后后台直接导出","正在推广产品（有历史数据）CPC判断方法——账号内预投放","一．空白账号竞价 （成熟产品起码在的竞价）-- 准词表前10准词"],"images":[]},{"id":"s155","slide":155,"chapter":"08","title":"重点知识延伸：二．账号内建议竞价 （最起码要压到的竞价） --…","kind":"extension","body":["二．账号内建议竞价 （最起码要压到的竞价） -- 投放前10准词精准-导出","三．实际投放竞价 -- 当前投放的竞价范围 （商品/广泛词组/精准）","对比一：账号建议竞价 vs 工具软件竞价（空白账号竞价）-- 判断是否存在账号层","对比二：账号建议竞价 vs 实际投放竞价 -- 判断产品层面是否是高权重产品，是","否存在压低竞价空间，高权重老品账号层面的建议竞价不会降低"],"images":[]},{"id":"s156","slide":156,"chapter":"08","title":"重点知识延伸：老账号/老链接 CPC完全由自己试探 ：高权重可…","kind":"extension","body":["老账号/老链接 CPC完全由自己试探 ：高权重可以降低竞价的几种情况","1. 商品页面曝光比例低的时候可以降竞价 ，TOS位置曝光逐渐增大（广告位比例）","2. 实际cpc低于出价很多 20% bid 0.7 固定竞价, cpc 0.4 （bid，实际扣费是根据下家的得分）","3. 建议竞价高于实际投放的价格较多，实际投放竞价是建议竞价的封顶","低单价产品15%~30% ，中等单价10%，高单价产品7%， 超高单价2~5%。"],"images":[]},{"id":"s157","slide":157,"chapter":"08","title":"重点知识延伸：购买竞品广告报表 ：数据可参考 （头部品牌，中部…","kind":"extension","body":["购买竞品广告报表 ：数据可参考 （头部品牌，中部品牌：广告又多成效还不错)","2. 已推广过的品类在品牌指标中查看品类转化率数据","一．流量离散程度 -- 流量越集中越难推，越分散越好推 （老链接相反）","三．同质化程度 -- 同质化越高越难推（目标自然排名高，有效自然位少，TOS竞价高，得拼价格）","四．产品迭代速度 -- 迭代越慢，老品权重越高，新品替代越困难，新品越堆越多靠广告买流量"],"images":[]},{"id":"s158","slide":158,"chapter":"08","title":"重点知识延伸：五．CPA是否高于利润 -- CPA比利润高越多…","kind":"extension","body":["五．CPA是否高于利润 -- CPA比利润高越多，推广风险越大 （高风险理财）","六．链接优势（价格/评分）-- 产品本身+链接呈现-决定天花板 （ctr,cvr)","测试产品的基准竞价——批量范围测试，跑出的搜索词曝光比例和广告位曝光比例","竞价：调研出的竞价从低到高 （账号调研竞价1.0~1.6，工具软件 0.7~1.3）","开启自动广告，只开紧密匹配，并进行前置否定，固定竞价。目的：测试准词竞价"],"images":[]},{"id":"s159","slide":159,"chapter":"08","title":"重点知识延伸：投放1~3个强关联大流量（广泛匹配打包大流量）一…","kind":"extension","body":["投放1~3个强关联大流量（广泛匹配打包大流量）一级词广泛匹配，前置加否","4. 商品页面曝光比例在占比过大 （排除出单影响时）","1. 预算每天不够花，当地时间下午就花完 （在同个活动中，大词小词按比例吃曝光）","3. 大词曝光比例过高 搜索量比例2：1 曝光比例6：1","范围投放准确词后（自动，广泛，精准）根据结果调整竞价"],"images":[]},{"id":"s160","slide":160,"chapter":"08","title":"重点知识延伸：l 偏高竞价 -- 搜索量比例正常，广告位比例异…","kind":"extension","body":["l 偏高竞价 -- 搜索量比例正常，广告位比例异常 （ TOS曝光","l 正常竞价 -- 搜索量比例正常，广告位比例正常（商品页面竞价测试判断总结","l 偏低竞价 -- 搜索量比例正常，广告位比例异常 （PP偏多","l 过低竞价 -- 搜索量比例异常，广告位比例异常/正常","l 只降低，查看后台实际竞价，以后台实际竞价为准加高竞价 （固定竞价）"],"images":[]},{"id":"s161","slide":161,"chapter":"08","title":"重点知识延伸：l 如果开到后台建议竞价的中位数还是曝光少或无曝…","kind":"extension","body":["l 如果开到后台建议竞价的中位数还是曝光少或无曝光的话，检查节点是否被更改，或者不显示节","l 如果曝光先高后低，说明表现非常差活动被降权 （多见于自动广告一直跑泛词和上位词）","测试周期太长（一周，一个月），广告表现又差，新品整体数据差权重低","○ 低权重：竞价抬高才能买到曝光，抬高竞价后表现还是差，竞价会被继续抬高 1.2 -- 2.2","测款测价：测竞价3~7天 / 测表现 1周~1个月 （测款预算）"],"images":[]},{"id":"s162","slide":162,"chapter":"08","title":"重点知识延伸：后续放量的竞价范围 （大词长尾词/不同词根）","kind":"extension","body":["1. 后续放量的竞价范围 （大词长尾词/不同词根）","2. 后续放量的方向（大词/小词/泛词/准词/先推什么词根，ASIN/类目）","新品大概率会跑到商品页面位置，此位置点击率天然偏低。判断产品以搜索结果其余位置为准-反映自然为数据","品类中位数代表该节点中间水平。新品可略低于中位数。如果远低于中位数，需要排查流量和转化两","1. 流量是否精准有效？（自动广告无效词过多/大词点击过多）"],"images":[]},{"id":"s163","slide":163,"chapter":"08","title":"重点知识延伸：流量来源的位置，三个广告位转化率不同，cpa=c…","kind":"extension","body":["2. 流量来源的位置，三个广告位转化率不同，cpa=cpc/cvr不同","3. listing本身导致的问题（评分数量，评星，价格，listing质量，款式选品）","cpc - 市场客观竞争情况 / 自身表现广告预期坑产 / 广告活动权重","目的 : 为后续的精细化投放 ， 广告位加价腾出空间 5 |"],"images":[]},{"id":"s164","slide":164,"chapter":"08","title":"本章实操练习与自测","kind":"practice","body":["写出本模块最重要的3个可验证假设。","列出执行前需要的报表、时间范围与产品范围。","给出一个可以在7天内验证、可回滚的调整动作。","记录预期改善的指标与可能损失的指标。","完成一页自己的案例后再进入下一章。"],"images":[]},{"id":"s166","slide":166,"chapter":"09","title":"放量不等于只加预算","kind":"course","body":["扩大覆盖关键词、拆分活动、拓商品ASIN、增加广告类型、提高竞价与位置曝光均可能增加花费","必须看新增订单与贡献利润。","产出：可控的扩量方式表。"],"images":[]},{"id":"s167","slide":167,"chapter":"09","title":"何时拆分活动","kind":"course","body":["高价值词被同活动预算挤占、需要独立控制投放时长或竞价时考虑拆分","拆分之后要监控搜索词重复、广告间重叠和总利润。","产出：拆分前后对照。"],"images":[]},{"id":"s168","slide":168,"chapter":"09","title":"何时合并活动","kind":"course","body":["大量零星活动重复、表现差且分散预算时可合并","相同阶段/目标/出价的活动优先整合","避免把探索与盈利活动无差别合在一起。","产出：合并候选清单。"],"images":[]},{"id":"s169","slide":169,"chapter":"09","title":"同级投放词扩量","kind":"course","body":["增加与现有词相同意图层级、不同词根的投放词以扩大覆盖","必须剔除重复表达和品牌噪声，控制有效流量的增量成本。","产出：新增同级词组。"],"images":[]},{"id":"s170","slide":170,"chapter":"09","title":"从出单长尾反向拓词","kind":"course","body":["高转化长尾可保留精准，同时测试其一级、二级词或词组","上游词更宽泛，可能需要更低出价和更多否词。","产出：一个出单词的扩展树。"],"images":[]},{"id":"s171","slide":171,"chapter":"09","title":"从覆盖广到精准的广告漏斗","kind":"course","body":["宽范围活动负责找高相关搜索词，中层词组负责放量验证，精准负责重要确定性查询","各层不必机械采用固定出价倍数。","产出：三层广告结构。"],"images":[]},{"id":"s172","slide":172,"chapter":"09","title":"预算与出价的区别","kind":"course","body":["预算决定活动总体可花规模，出价与位置策略影响单次流量争夺","预算用完与竞价不足的解决方式不一样。","产出：诊断预算瓶颈。"],"images":[]},{"id":"s173","slide":173,"chapter":"09","title":"怎么缩量而不损失自然单","kind":"course","body":["优先处理无效词、低转化的重复覆盖和不适合的广告位","按7/14天观察自然销量、总订单与TACOS","必要时回滚。","产出：分阶段缩量表。" 的辅推）"],"images":[]},{"id":"s216","slide":216,"chapter":"10","title":"重点知识延伸：清库存/占有流量口/增加转化率/多变体拆了做vine","kind":"extension","body":["清库存/占有流量口/增加转化率/多变体拆了做vine","主推变体获取流量入口，其他变体提升转化/客单价获取订单","原计划：主推变体获取流量入口，其他变体用于提升单价 33.99 / 36.99","原计划：主推变体获取流量入口，其他变体用于提升单价，但主推混乱，花双倍花费得到一个坑位","TACOS=广告花费/【（广告单+自然单）*单价】"],"images":[]},{"id":"s217","slide":217,"chapter":"10","title":"重点知识延伸：控制变量过程测款：选择一款变体测试竞价后（确保跑…","kind":"extension","body":["控制变量过程测款：选择一款变体测试竞价后（确保跑词范围充足），再开始测款","跑够数据以后再换款，每次单独开一个款式的一个变体，避免互相干扰","得出结论：ABC款式分别在不同位置的表现情况和整体表现情况","1. 每个子体 ASIN 在搜索词下都拥有自己的自然坑位","2. 每个 listing 在一个搜索词下只占一个自然坑位 。 (25 年 10 月 1 号后一个词下可以展示 1~3 个子体 )"],"images":[]},{"id":"s218","slide":218,"chapter":"10","title":"重点知识延伸：所以每个父体 ASIN 在每个词下只显示一个权重…","kind":"extension","body":["所以每个父体 ASIN 在每个词下只显示一个权重最高的 1~3 子体 (最高自然排名的子体 )","Ve men TREN 多个自然坑位可以同页出现 ， 但每个子体 ASIN 都可以有单独的广","1. 主推是变体 A， 广告词打的变体 A， 买家出单到变体 B -- 出单 ASIN 与目标主推不一致","2. 主推是变体 A， 广告打的是变体 B， 买家出单到变体 B -- 出单 ASIN 和投放 ASIN 与目标主推不一至","1. 通过变体 A 的广告进入 ， 购买变体 A( 选款 / 定价 ) -- 单主推单广告"],"images":[]},{"id":"s219","slide":219,"chapter":"10","title":"重点知识延伸：通过变体 EE， 进入购买 EF， 买订单盈利 …","kind":"extension","body":["3. 通过变体 EE， 进入购买 EF， 买订单盈利 -- 单主推多广告","销售额 = (广告流量 + 自然流量 ) * 转化 * 客单价","令增加整体利润 - ( 变体辅推提升整体客单价 )","不同推广阶段对广告花费占比有不同要求 : 定价毛利 30%","维稳期 (维持目标单量 ， 同时优化利润 ) : 起码平本推广 / 微有便利 5% 纯利 / 15% 纯利"],"images":[]},{"id":"s220","slide":220,"chapter":"10","title":"重点知识延伸：通过变体 C,D, 进入购买变体 A， 买订单 …","kind":"extension","body":["2. 通过变体 C,D, 进入购买变体 A， 买订单 /引流向变体 A","无主推多变体广告结构一一 8 — 活动类型 1: 手动广泛 /词组 {","3. 实际投放的 ASIN (如投放多 ASIN 占位 ， 需保证辅推变体不抢位 ) -投放黑色","5. 推动主推 ASIN 自然位为整条链接带来流量","01 引流款 (主推 ASIN) 去推广相应关键词拿自然流量入口 (出单在目标 ASIN 上 ,控制出单在 2 个以内的 ASIN)"],"images":[]},{"id":"s221","slide":221,"chapter":"10","title":"重点知识延伸：已有变体寻找新的对应流量入口 -把已有变体最大化利 F","kind":"extension","body":["02 已有变体寻找新的对应流量入口 -把已有变体最大化利 F","04 增加转化率 / 客单价的变体 -- 利用已有流量更高的单量 /利润"],"images":[]},{"id":"s222","slide":222,"chapter":"10","title":"本章实操练习与自测","kind":"practice","body":["写出本模块最重要的3个可验证假设。","列出执行前需要的报表、时间范围与产品范围。","给出一个可以在7天内验证、可回滚的调整动作。","记录预期改善的指标与可能损失的指标。","完成一页自己的案例后再进入下一章。"],"images":[]},{"id":"s224","slide":224,"chapter":"11","title":"TOS、ROS、PP的位置定义","kind":"course","body":["TOS为搜索结果顶部，ROS为其他搜索位置，PP为商品详情页","不同位置曝光量与购买意图相差很大。","产出：位置基准。"],"images":[]},{"id":"s225","slide":225,"chapter":"11","title":"同一出价会争夺多个位置","kind":"course","body":["SP活动出价不是单独买一个位置","位置调整与动态竞价策略叠加影响最终竞价资格","不能通过单次乘数完全精确控制流量。","产出：位置出价试验。"],"images":[]},{"id":"s226","slide":226,"chapter":"11","title":"固定竞价、只降低、提高和降低","kind":"course","body":["动态只降低可压低低转化机会的竞价","提高和降低会在预测表现时调整，固定竞价不做同类动态调节","具体上限以后台当期规则为准。","产出：策略参数登记。"],"images":[]},{"id":"s227","slide":227,"chapter":"11","title":"位置加价乘数要正确计算","kind":"course","body":["示例：基础出价$1，TOS加价50%，名义可达$1.50（未计动态策略等）","要区分实际CPC、竞价上限与报表平均CPC。","产出：倍数计算表。"],"images":[]},{"id":"s228","slide":228,"chapter":"11","title":"广告位价值的判定","kind":"course","body":["按位置比较CTR、CPC、CVR、CPA、ACOS和订单规模","高CTR位置可能ACOS更高","单独降价要观察预算释放是否改善整体利润。","产出：位置价值排名。"],"images":[]},{"id":"s229","slide":229,"chapter":"11","title":"竞价梯度的应用","kind":"course","body":["从低、中、高不同出价区间观察是否产生足够曝光、TOS占比与PP流量","不同品类差异很大，5–15倍等是课程示例不是统一基线。","产出：自己的竞价阶梯。"],"images":[]},{"id":"s230","slide":230,"chapter":"11","title":"只跑TOS、偏ROS或偏PP","kind":"course","body":["课程用不同出价和位置加价组合倾斜流量，但不能保证完全排除其他位置","应用前先验证位置贡献利润。","产出：最优位置组。"],"images":[]},{"id":"s231","slide":231,"chapter":"11","title":"广告位的无效调价","kind":"course","body":["如果出价远低于目标位置所需水平，小幅位置加价可能没有效果","先分析曝光是否足够、位置是否转移，再决定加价。","产出：无效调整判定。"],"images":[]},{"id":"s232","slide":232,"chapter":"11","title":"SP三广告位：真实历史数据完整对照","kind":"case","body":["数据表：\n位置 | 曝光 | 点击 | CTR | 花费 | CPC | 订单 | 销售额 | ACOS\n总计 | 551,139 | 2,369 | 0.43% | $4,342.43 | $1.83 | 354 | $8,411.11 | 51.63%\nTOS | 18,189 | 1,444 | 7.94% | $3,062.95 | $2.12 | 242 | $5,713.67 | 53.61%\nPP | 511,704 | 663 | 0.13% | $905.74 | $1.37 | 54 | $1,296.67 | 69.85%\nROS | 21,246 | 262 | 1.23% | $373.74 | $1.43 | 58 | $1,400.77 | 26.68%","这个历史案例中TOS的CTR最高，但ROS的ACOS最低；必须比较订单、CPA和净利润。"],"images":[]},{"id":"s233","slide":233,"chapter":"11","title":"动态竞价：仅降低","kind":"case","body":["明确竞价策略与广告位加价分别影响什么。","历史案例的绝对数值不代表当前广告建议；请按真实账户重新验证。"],"images":["case-233-1.webp"]},{"id":"s234","slide":234,"chapter":"11","title":"广告位价值比较","kind":"case","body":["按TOS、ROS、PP分别对比CPA和利润。","历史案例的绝对数值不代表当前广告建议；请按真实账户重新验证。"],"images":["case-234-1.webp"]},{"id":"s235","slide":235,"chapter":"11","title":"保留TOS花费的反面案例","kind":"case","body":["广告位抢占可能带来更高获客成本。","历史案例的绝对数值不代表当前广告建议；请按真实账户重新验证。"],"images":["case-235-1.webp"]},{"id":"s236","slide":236,"chapter":"11","title":"重点知识延伸：Result-首页头部广告位 高bid 3~4 …","kind":"extension","body":["Result-首页头部广告位 高bid 3~4 （坑位最少） Top of Search (TOS)","More result 搜索结果页面除去头部的 一页8~12个 （中等数量） Rest of Search (ROS) 其余位置 中bid","独立板块 一页5个 （符合相应条件） Rest of Search (ROS) （highly rated/Trending Styles)","商品详情页 低bid 每条listing下几十个 Product Page (PP)","已知：在亚马逊购买广告实际购买的是广告坑位所对应的曝光 - 坑产"],"images":[]},{"id":"s237","slide":237,"chapter":"11","title":"重点知识延伸：我们无法直接调控各广告位曝光，只能通过间接的方式调控","kind":"extension","body":["我们无法直接调控各广告位曝光，只能通过间接的方式调控","关键词投放广告捆绑购买曝光：商品页面>其余位置>搜索结果头部 固定竞价x","实际bid——出价底bid * 竞价策略 * 广告位加价","通过改变各广告位的实际bid对广告位进行调控，从而对投产比/花费比例/占坑进行调控","（指点击率差，转化率差，广告坑产差，不代表投产比差，会通过降低你的竞价的方式拉低坑位。坑产=广告花费"],"images":[]},{"id":"s238","slide":238,"chapter":"11","title":"重点知识延伸：降低竞价作用于（底bid不变）各搜索词的各广告位…","kind":"extension","body":["2. 降低竞价作用于（底bid不变）各搜索词的各广告位，不作用于投放词X。","适用于已经平稳想要降低花费或者CPA的广告，或者降低垃圾曝光的广告。","如果您选择“动态竞价 - 提高和降低”策略，亚马逊将针对更有可能转化为销量的点击实时提高您的竞价，同时针对不太可能转化","对于搜索结果首页顶部的广告位，我们不会将您的竞价提高超过 100%；对于其他所有广告位，则不会将竞价提高超过 50%。如果","使用此策/略，请在选择竞价时考虑到这一点。这种策略会根据转化可能性按比例调整您的竞价，因此与其他两种策略相比，它可能"],"images":[]},{"id":"s239","slide":239,"chapter":"11","title":"重点知识延伸：会为您的广告支出带来更多转化。如果我们发现了您的…","kind":"extension","body":["会为您的广告支出带来更多转化。如果我们发现了您的广告更有可能转化为销量的机会（例如，您的广告针对高度相关的搜索查询","内容展示、您的广告展示在效果较好的广告位上等），则可能会针对此次竞拍提高您的竞价。如果我们发现了其他不太可能转化为","销量的情况，则可能会针对此次竞拍降低您的竞价。例如，对于在搜索结果首页顶部展示的机会，亚马逊目前最高可以将 1.00 美","元的竞价调高到 2.00 美元；对于在其他所有广告位上展示的机会，则最高可以调整到 1.50 美元。","1. 系统认为广告表现较差时会主动降低竞价。（指点击率，转化率，不代表投产比）"],"images":[]},{"id":"s240","slide":240,"chapter":"11","title":"重点知识延伸：表现正常的广告位置会被加50%~100%。一般使…","kind":"extension","body":["2. 表现正常的广告位置会被加50%~100%。一般使用这种竞价策略，最终跑出的cpc会是底bid的150%~200%","应用建议：确定整体竞价后再开启，适用于表现稳定的广告活动","当你选择“fixed bids”这一策略时，亚马逊不会改动你的广告关键词竞价。即当你的默认出价是1.5美","元时，亚马逊不会根据你广告的转化情况调整你的出价。ADRANK=BID*相关性得分","这种竞价策略使广告卖家对自己的广告表现有最大的控制权，你可以自由设定自己的广告竞价，亚马逊"],"images":[]},{"id":"s241","slide":241,"chapter":"11","title":"重点知识延伸：不会干预你的出价。这种策略最适合没有任何历史的新…","kind":"extension","body":["不会干预你的出价。这种策略最适合没有任何历史的新广告活动，因为这将确保你的广告在投放过程中","不会受到亚马逊的干预，并能够持续为你传送信息和收集具有参考价值的数据。你可以等该广告为你累","积了足够的数据后，再决定是否改变使用别的竞价策略。","如果要开广告位加价试探TOS，建议用固定竞价策略。 只降低 0.5+500%","搜索结果顶部（首页）是指在搜索结果首页顶行的商品推广广告位。"],"images":[]},{"id":"s242","slide":242,"chapter":"11","title":"重点知识延伸：搜索结果的其余位置是指在搜索结果的中间或底部的商…","kind":"extension","body":["搜索结果的其余位置是指在搜索结果的中间或底部的商品推广广告位，以及在搜索结果的第二页及以后的所有商品推","商品页面是指商品详情页面上的商品推广广告位，以及所有非搜索结果广告位（例如“加入购物车”页面）。","1. PP曝光大的情况下，PP+%，bid不会本质上改变你的表现 （bid控制广告位）","假设广告出现在搜索结果页面正常位置，商品页面 pp 曝光比例为（TOS+ROS）*5~15","在只降低或者固定竞价，且tos不加价的情况下可进行判断"],"images":[]},{"id":"s243","slide":243,"chapter":"11","title":"重点知识延伸：低竞价a--无法跑到TOS位置，ROS曝光过小，…","kind":"extension","body":["低竞价a--无法跑到TOS位置，ROS曝光过小，PP曝光比例过大（30倍）—— 定义为PP页面竞价","低竞价a--无法跑到TOS位置，PP曝光比例过大——定义为PP页面竞价","中等竞价b：几乎无法跑到TOS位置，PP曝光比例正常（5~15倍）——定义为ROS正常竞价","竞价c 偏高竞价：TOS与ROS分摊曝光，PP曝光比例正常 （TOS+ROS)和PP的比例——定义为ROS偏高竞","价，TOS不稳定竞价. ROS位置比较好，能到TOS位置，卡不住。"],"images":[]},{"id":"s244","slide":244,"chapter":"11","title":"重点知识延伸：足够卡TOS位竞价d：TOS曝光大，占大部分花费…","kind":"extension","body":["足够卡TOS位竞价d：TOS曝光大，占大部分花费，PP曝光比例正常或偏低，ROS的曝光跟TOS曝光接","2. 测款时能否从高到低给竞价 - 高竞价容易带来PP曝光大的误判","3. a，b，c，d竞价判断是否适用于数据较差的老品","1. 低权重老链接-只降低（竞价已远高于建议竞价或市调竞价)","低权重链接广告位会存在竞价越高，PP位置曝光比例反而被放大的情况"],"images":[]},{"id":"s245","slide":245,"chapter":"11","title":"重点知识延伸：中等竞价：b —— ROS能获得曝光，且比例正常的竞价","kind":"extension","body":["中等竞价：b —— ROS能获得曝光，且比例正常的竞价","TOS位置吃到90%以上的花费，x<a, tos加价百分比=(d-x)/x","2. 对比TOS位曝光和搜索查询数量TOS卡位占比分析","2. 占坑：投放ABC，只跑PP占所有ABC流量词进商品详情页的坑位","1. 低成本关键词加权 bid<=a, 只 async function fetchCaseImage(id){
 if(CLOUD.imageUrls.has(id))return CLOUD.imageUrls.get(id);
 if(CLOUD.imageLoads.has(id))return CLOUD.imageLoads.get(id);
 const load=(async()=>{

  if(!session?.access_token)throw Error("请先登录");
  const res=await fetch(ACADEMY_CASES+"?id="+encodeURIComponent(id),{
   headers:{Authorization:"Bearer "+session.access_token,apikey:SB_KEY}});
  if(!res.ok)throw Error("案例权限或网络异常："+res.status);
  const u=URL.createObjectURL(await res.blob());
  CLOUD.imageUrls.set(id,u);return u;
 })();

 try{return await load}finally{CLOUD.imageLoads.delete(id)}
}
function hydrateCaseImages(){
 CLOUD.observer?.disconnect();
 if(!CLOUD.user||!CLOUD.ready||!CLOUD.sb)return;
 const all=Array.from(document.querySelectorAll("img[data-case-src]"));
 if(!all.length)return;

  const id=el.dataset.caseSrc;if(!id)return;
  try{el.src=await fetchCaseImage(id)}catch(e){el.alt="无法加载案例，请确认已登录并具有访问权限"}
 };
 if(!("IntersectionObserver" in window)){all.forEach(show);return}
 CLOUD.observer=new IntersectionObserver(entries=>{
  for(const x of entries)if(x.isIntersecting){CLOUD.observer.unobserve(x.target);void show(x.target)}
 },{rootMargin:"300px"});
 all.forEach(x=>CLOUD.observer.observe(x))
}

function calculator(){return `<div class="page-title"><div class="eyebrow">OPERATIONS TOOLS</div><h1>广告利润与投放计算器</h1><p class="muted">输入真实产品的价格与费用，动态计算贡献毛利、盈亏平衡 ACOS、CPA 和模拟 TACOS。示例输入仅供演示，并不是你的账户实时数据。</p></div><div class="calc-grid"><section class="card pad"><div class="row between"><h2 style="margin:0">① 单件利润与广告底线</h2><span class="badge blue">实时计算</span></div><p class="muted small" style="margin-top:9px">售价、费用统一换算为美元；佣金按售价比例估算。</p><div class="field-grid">${inp('price','售价','16.99','USD')}${inp('cost','采购与包装','22.72','CNY')}${inp('fx','人民币兑美元汇率','6.67','CNY/USD')}${inp('fulfill','FBA及配送','4.50','USD')}${inp('comm','平台佣金费率','15','%')}${inp('other','其他单件经营成本','0.80','USD')}${inp('return','退货/损耗预留率','2','%')}${inp('target','目标广告后贡献利润率','10','%')}</div><div class="divider"></div><div class="result-grid" id="profitResult"></div></section>
<section class="card pad"><div class="row between"><h2 style="margin:0">② 预算、订单与 TACOS 模拟</h2><span class="badge gray">模型演算</span></div><p class="muted small" style="margin-top:9px">用于帮助理解 CPC、CVR、自然订单对整体利润的影响，并非实际销售预测。</p><div class="field-grid">${inp('spend','每天广告花费',30,'USD')}${inp('cpc','平均 CPC',0.9,'USD')}${inp('cvr','广告 CVR',8,'%')}${inp('organic','每日自然订单',15,'单')}${inp('disc','促销额外折损率',0,'%')}${inp('extra','每日固定费用',0,'USD')}</div><div class="divider"></div><div class="result-grid" id="scenarioResult"></div><div class="section-help" style="margin-top:14px">计算中假设点击与订单均可按平均 CVR 归因、商品单价一致、无多件订单与归因延迟。实际经营应使用广告后台与销售报表核对。</div></section></div>
<div class="section-head"><h2>常用公式速查</h2></div><div class="term-list">${TERMS.slice(0,7).map(t=>`<div class="card term"><strong>${esc(t[0])}</strong><p>${esc(t[1])}</p></div>`).join('')}</div>`}
function fmt(n,suffix=''){return Number.isFinite(n)?n.toFixed(2)+suffix:'—'}
function recompute(){if(state.page!=='calculator')return;let price=val('price'),cost=val('cost'),fx=val('fx'),fulfill=val('fulfill'),comm=val('comm'),other=val('other'),ret=val('return'),tar=val('target');
const unit=price*(1-comm/100-ret/100)-cost/(fx||1)-fulfill-other;const be=price>0?unit/price*100:0;const allowed=unit-price*tar/100;const a=unit/price*100;function tile(t,v,bad=false){return `<div class="result ${bad?'warn':''}"><label>${t}</label><strong>${v}</strong></div>`}
const profit=$('#profitResult');if(profit)profit.innerHTML=tile('广告前单件贡献毛利','$'+fmt(unit),unit<0)+tile('广告前贡献利润率',fmt(a,'%'),a<0)+tile('盈亏平衡 ACOS',fmt(be,'%'),be<0)+tile('目标可承受 CPA','$'+fmt(allowed),allowed<0);
const spend=val('spend'),cpc=val('cpc'),cvr=val('cvr')/100,organic=val('organic'),disc=val('disc')/100,extra=val('extra');let clicks=cpc>0?spend/cpc:0;let adOrders=clicks*cvr;let sales=price*(adOrders+organic)*(1-disc);let acos=price*adOrders?spend/(price*adOrders)*100:0;let tacos=sales>0?spend/sales*100:0;let net=unit*(organic+adOrders)-spend-extra-price*disc*(organic+adOrders);
const sim=$('#scenarioResult');if(sim)sim.innerHTML=tile('估算广告订单',fmt(adOrders)+' 单')+tile('估算 ACOS',fmt(acos,'%'))+tile('估算 TACOS',fmt(tacos,'%'))+tile('模型日贡献利润','$'+fmt(net),net<0);
}
function library(){const s=state.search.trim().toLowerCase();const matches=D.lessons.filter(l=>!s||[l.title,...l.body,chap(l.chapter)?.title].join(' ').toLowerCase().includes(s));const nodes=s?D.mapNodes.filter(n=>n.path.toLowerCase().includes(s)).slice(0,30):[];return `<div class="page-title"><div class="eyebrow">KNOWLEDGE SEARCH</div><h1>知识点检索</h1><p class="muted">跨课程正文、随堂案例和导图节点搜索。输入 CTR、COSMO、否词、多变体、利润等关键词试试。</p></div><div class="card pad"><input class="search-input" style="width:100%" id="librarySearch" placeholder="搜索全部课程内容……" value="${esc(state.search)}"><div class="filter-row"><span class="badge blue">匹配课程 ${matches.length}</span><span class="badge gray">匹配导图节点 ${nodes.length}${nodes.length===30?'+':''}</span></div><div class="item-list">${matches.slice(0,80).map(l=>`<article class="card search-item" data-lesson="${l.id}"><div class="row"><span class="badge blue">${esc(chap(l.chapter)?.title||'')}</span><span class="badge gray">${kindName[l.kind]}</span></div><h3>${esc(l.title)}</h3><p>${esc(short(l.body.join(' '),195))}</p></article>`).join('')||'<p class="muted">没有找到对应课程。</p>'}</div>${matches.length>80?'<p class="muted small">结果较多，请输入更具体的关键词。</p>':''}${nodes.length?`<h3 style="margin-top:24px">导图匹配结果</h3><div class="item-list">${nodes.map(n=>`<div class="card search-item" data-route="mindmap"><div class="muted small">${esc(n.path)}</div></div>`).join('')}</div>`:''}</div><div class="section-head"><h2>运营指标词典</h2></div><div class="term-list">${TERMS.filter(t=>!s||t.join(' ').toLowerCase().includes(s)).map(t=>`<div class="card term"><strong>${esc(t[0])}</strong><p>${esc(t[1])}</p></div>`).join('')}</div>`}
function source(){const s=state.indexSearch.trim().toLowerCase();const a=D.sourceIndex.filter(x=>!s||Object.values(x).join(' ').toLowerCase().includes(s));const unverified=D.sourceIndex.filter(x=>!/已转写为可编辑正文|已关联数据或截图/.test(x.status)).length;return `<div class="page-title"><div class="eyebrow">CONTENT COVERAGE</div><h1>课程内容核对索引</h1><p class="muted">这里保存了 2024 年 334 页与 2026 年 171 页的原始页面映射记录。用来定位知识点，不把“主题对应”误认为“所有原图数字都已转写”。</p></div><div class="kpi-grid"><div class="card kpi"><div class="k-label">核对总页数</div><div class="k-value">505</div></div><div class="card kpi"><div class="k-label">2024 课程</div><div class="k-value">334</div></div><div class="card kpi"><div class="k-label">2026 课程</div><div class="k-value">171</div></div><div class="card kpi"><div class="k-label">需再审原图细节</div><div class="k-value">${unverified}</div></div></div><div class="warning">核对索引用于查找对应主题。它不等同于“所有历史数据都已逐字逐数字审核”。遇到关键出价、TACOS、CPR 或多变体数据时，请查看相关随堂案例并复核原始记录。</div><div class="card pad" style="margin-top:16px"><div class="filter-row"><input class="search-input" id="sourceSearch" style="flex:1" placeholder="筛选编码、模块、文字或核对状态" value="${esc(state.indexSearch)}"><span class="badge gray">${a.length} 条</span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>原页编码</th><th>对应章节</th><th>课程页号</th><th>核对说明</th><th>可辨认内容</th></tr></thead><tbody>${a.slice(0,120).map(x=>`<tr><td><strong>${esc(x.code)}</strong></td><td>${esc(chap(x.ch)?.title||x.ch)}</td><td>${x.slide?`<button class="btn small flat" data-rawslide="${esc(x.slide)}">${esc(x.slide)}</button>`:'—'}</td><td>${esc(short(x.status,65))}</td><td class="wide">${esc(short(x.summary,180))}</td></tr>`).join('')}</tbody></table></div>${a.length>120?'<p class="muted small" style="margin-top:13px">仅显示前 120 条，请缩小搜索范围。</p>':''}</div>`}
function notes(){let a=Object.entries(user.notes).filter(([,v])=>v.trim()).map(([id,v])=>({l:uid(id),v})).filter(x=>x.l);return `<div class="page-title"><div class="eyebrow">MY LEARNING NOTES</div><h1>我的笔记与复习清单</h1><p class="muted">在每个课程页写的笔记汇总于此。数据默认保存在本机浏览器，建议定期导出备份。</p></div><div class="row wrap" style="margin-bottom:16px">${button('↓ 导出笔记与进度','export','primary')}${button('↑ 导入学习备份','import')}${button('下载最近同步冲突备份','recovery')}${button('查看收藏的知识点','favs')}</div><div class="item-list">${a.length?a.map(x=>`<article class="card pad"><div class="row between"><div><span class="badge blue">${esc(chap(x.l.chapter)?.title)}</span><h3 style="margin:10px 0">${esc(x.l.title)}</h3></div><button class="btn small" data-lesson="${x.l.id}">打开 ›</button></div><p style="white-space:pre-line;font-size:12px;color:#53637d;margin:0">${esc(x.v)}</p></article>`).join(''):'<div class="card pad"><p class="muted">还没有笔记。在学习知识页的末尾输入内容即可自动保存。</p></div>'}</div>`}
function drawContent(){switch(state.page){case'dashboard':return dashboard();case'course':return courses();case'studyplan':return window.AdsStudyPlan.render({user,data:D,save:persist,refresh:render});case'adslab':return window.AdsLab.render({user,data:D,save:persist,refresh:render,gotoChapter:(id)=>{state.ch=id;state.lesson=by(id)[0]?.id||'';goto('course')},gotoStudy:()=>goto('studyplan')});case'cases':return cases();case'mindmap':return mindmap();case'quiz':return quiz();case'calculator':return calculator();case'library':return library();case'source':return source();case'notes':return notes();default:return dashboard()}}
function render(){let oldScroll=window.scrollY;$('#root').innerHTML=appShell();$('#content').innerHTML=drawContent();if(state.page==='calculator')recompute();hydrateCaseImages();refreshCloudLabel();}
function download(name,content,type='application/json'){const b=new Blob([content],{type});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}
function exportData(){download('AmazonAds_Academy_学习备份.json',JSON.stringify({version:2,date:new Date().toISOString(),user},null,2));success('学习数据已导出到文件')}
function handleAction(act){if(act==='account'){showCloudDialog();return}if(act==='closeaccount'){document.getElementById('academyLogin')?.remove();return}if(act==='syncnow'){void saveCloud();return}if(act==='signup'){void doCloudLogin('signup');return}if(act==='signout'){void cloudSignout();return}if(act==='mobile'){state.mobile=!state.mobile;$('#sidebar')?.classList.toggle('open');return}if(act==='resume'){jumpLesson(user.recent||D.lessons[0].id);return}if(act==='export'){exportData();return}if(act==='recovery'){const b=localStorage.getItem("ads-academy-v2-sync-recovery");if(!b){success('目前没有同步冲突备份');return}download('AmazonAds_云端同步恢复备份.json',b);success('已导出最近的本机与云端快照');return}if(act==='import'){$('#importFile')?.click();return}if(act==='course'){goto('course');return}if(act==='quiz'){goto('quiz');return}if(act==='dashboard'){goto('dashboard');return}if(act==='newquiz'){newQuiz();render();return}if(act==='submitquiz'){if(Object.keys(state.quizAnswers).length<state.quizQs.length){success('请先完成本组全部题目');return}state.quizDone=true;const score=state.quizQs.reduce((s,q,i)=>s+(state.quizAnswers[i]===q[3]?1:0),0);user.scores.push({at:new Date().toISOString(),ch:state.quizCh,score,total:state.quizQs.length});window.AdsStudyPlan.captureQuiz(user,state.quizQs,state.quizAnswers);persist();render();success('测验已完成');return}if(act==='favs'){let x=D.lessons.find(l=>user.stars.includes(l.id));if(x)jumpLesson(x.id);else success('尚未收藏知识点');return}if(act.startsWith('complete:')){let id=act.slice(9);if(user.complete.includes(id))user.complete=user.complete.filter(x=>x!==id);else user.complete.push(id);persist();render();return}if(act.startsWith('star:')){let id=act.slice(5);if(user.stars.includes(id))user.stars=user.stars.filter(x=>x!==id);else user.stars.push(id);persist();render();success(user.stars.includes(id)?'已加入收藏':'已取消收藏');return}if(act.startsWith('next:')){jumpLesson(act.slice(5));return}}
document.addEventListener('click',e=>{let z=e.target.closest('[data-route],[data-action],[data-chapter],[data-open-ch],[data-lesson],[data-day],[data-tree],[data-zoom],[data-rawslide]');if(!z)return;if(z.dataset.route){goto(z.dataset.route);return}if(z.dataset.action){handleAction(z.dataset.action);return}if(z.dataset.chapter){state.ch=z.dataset.chapter;state.lesson=by(state.ch)[0].id;goto('course');return}if(z.dataset.openCh){state.ch=z.dataset.openCh;state.lesson=by(state.ch)[0]?.id;render();return}if(z.dataset.lesson){jumpLesson(z.dataset.lesson);return}if(z.dataset.day!==undefined){state.mapDay=Number(z.dataset.day);state.expanded={};render();return}if(z.dataset.tree){let el=document.getElementById(z.dataset.tree);let record=window.nodeRegistry[z.dataset.tree];if(!el||!record)return;let open=!el.hidden;el.hidden=open;z.textContent=open?'▸':'▾';if(!open&&!el.innerHTML){el.innerHTML=record.node.c.map(c=>treeRender(c,record.depth+1)).join('')}return}if(z.dataset.zoom){let src=CLOUD.imageUrls.get(z.dataset.zoom)||window.imgSrc(z.dataset.zoom);let overlay=document.createElement('div');overlay.className='overlay';overlay.innerHTML=`<div class="lightbox"><button class="close-x" aria-label="关闭">×</button><img src="${src}" alt="放大查看"></div>`;document.body.appendChild(overlay);overlay.addEventListener('click',e=>{if(e.target===overlay||e.target.closest('.close-x'))overlay.remove()});return}if(z.dataset.rawslide){let id='s'+String(z.dataset.rawslide).padStart(3,'0');if(uid(id))jumpLesson(id);return}});
document.addEventListener('input',e=>{if(e.target.id==='lessonNote'){let id=state.lesson;user.notes[id]=e.target.value;persist();return}if(e.target.classList.contains('calc-input')){recompute();return}if(e.target.id==='globalSearch'){state.search=e.target.value;clearTimeout(window.gsTimer);window.gsTimer=setTimeout(()=>{state.page='library';render();const a=$('#librarySearch');if(a){a.focus();a.setSelectionRange(a.value.length,a.value.length)}},320);return}if(e.target.id==='librarySearch'){state.search=e.target.value;clearTimeout(window.gsTimer);window.gsTimer=setTimeout(()=>{render();const a=$('#librarySearch');a?.focus();a?.setSelectionRange(a.value.length,a.value.length)},340);return}if(e.target.id==='sourceSearch'){state.indexSearch=e.target.value;clearTimeout(window.sourceTimer);window.sourceTimer=setTimeout(()=>{render();const a=$('#sourceSearch');a?.focus();a?.setSelectionRange(a.value.length,a.value.length)},350);return}});
document.addEventListener('change',e=>{if(e.target.id==='caseFilter'){state.caseCh=e.target.value;render();return}if(e.target.id==='quizFilter'){state.quizCh=e.target.value;newQuiz();render();return}if(e.target.dataset.qa!==undefined){state.quizAnswers[Number(e.target.dataset.qa)]=Number(e.target.value);return}if(e.target.id==='importFile'){const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{let x=JSON.parse(rd.result);if(!x.user||!Array.isArray(x.user.complete))throw Error('bad data');user=x.user;persist();render();success('学习备份导入成功')}catch(err){success('文件格式不正确，未导入')} };rd.readAsText(f);return}});
window.addEventListener('keydown',e=>{if(e.key==='Escape')$('.overlay')?.remove()});
// images are resolved relative to the static site in the folder version; standalone build replaces this function.
window.imgSrc=x=>(window.__INLINE_IMAGES&&window.__INLINE_IMAGES[x])||'assets/'+x;
const initial=(location.hash.match(/page=([^&]+)/)||[])[1];if(initial){let p=decodeURIComponent(initial);if(['dashboard','course','studyplan','adslab','cases','mindmap','quiz','calculator','library','source','notes'].includes(p))state.page=p}
if(state.page==='quiz')newQuiz();render();initCloud();
})();
</script></body></html>
