<style>
*{box-sizing:border-box}body{margin:0;font:14px Arial,"Microsoft YaHei",sans-serif;background:#f4f7fb;color:#172033}button,input,select,textarea{font:inherit}.hidden{display:none!important}.app{min-height:100vh}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#0f172a,#1e3a8a)}.loginbox{width:min(420px,92vw);background:#fff;border-radius:18px;padding:28px;box-shadow:0 25px 80px #0005}.loginbox h1{margin:0 0 6px}.muted{color:#667085}.field{width:100%;padding:10px 11px;border:1px solid #d7deea;border-radius:8px;background:#fff}.loginbox .field{margin:8px 0}.btn{border:0;border-radius:8px;padding:9px 13px;cursor:pointer}.primary{background:#2457d6;color:#fff}.ghost{background:#fff;border:1px solid #d7deea}.danger{color:#b42318;background:#fff;border:1px solid #f0c3bd}.shell{display:flex;min-height:100vh}.side{position:fixed;left:0;top:0;bottom:0;width:220px;background:#101827;color:#fff;padding:14px 10px}.brand{font-size:18px;font-weight:800;padding:10px;border-bottom:1px solid #243047}.brand small{display:block;font-size:11px;color:#91a0b7;margin-top:4px}.nav{margin-top:12px}.nav button{display:block;width:100%;padding:10px;border:0;border-radius:8px;background:transparent;color:#c7d0df;text-align:left;cursor:pointer;margin:2px 0}.nav button.on,.nav button:hover{background:#2457d6;color:#fff}.sidefoot{position:absolute;left:10px;right:10px;bottom:12px}.main{margin-left:220px;width:calc(100% - 220px)}header{height:64px;background:#fff;border-bottom:1px solid #e6ebf2;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:10}.content{padding:18px;max-width:1700px;margin:auto}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card,.panel{background:#fff;border:1px solid #e1e7ef;border-radius:12px}.card{padding:15px;cursor:pointer}.card b{display:block;font-size:25px;margin-top:8px}.card span{color:#667085}.panel{margin-top:14px;overflow:hidden}.ph{padding:13px 15px;border-bottom:1px solid #e7ebf0;display:flex;justify-content:space-between;align-items:center}.pb{padding:15px}.flow{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.step{border:1px solid #e3e8ef;border-radius:9px;padding:13px;text-align:center;cursor:pointer;background:#fff}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar .field{width:auto;min-width:160px}.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.title h2{margin:0}.table{background:#fff;border:1px solid #e1e7ef;border-radius:12px;overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:1100px}.table th{background:#f8fafc;color:#5b6575;font-size:12px;text-align:left;padding:10px;white-space:nowrap}.table td{padding:10px;border-top:1px solid #edf0f3;white-space:nowrap}.thumb{width:52px;height:52px;border-radius:8px;object-fit:cover;background:#f3f5f8;border:1px solid #e3e8ef}.link{border:0;background:none;color:#2457d6;cursor:pointer;padding:3px}.red{color:#b42318}.empty{text-align:center;padding:48px;color:#7b8798}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:30;padding:16px}.modal.open{display:flex}.box{width:min(880px,96vw);max-height:92vh;overflow:auto;background:#fff;border-radius:14px;padding:20px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form label{display:flex;flex-direction:column;gap:5px;color:#475467;font-size:12px}.form .full{grid-column:1/-1}.form input,.form select,.form textarea{padding:9px;border:1px solid #d7deea;border-radius:8px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.tag{display:inline-block;padding:3px 7px;border-radius:999px;background:#eef3ff;color:#2457d6;font-size:12px}.warn{background:#fff7e8;border:1px solid #f6d39b;color:#7a5210;padding:10px;border-radius:8px;margin-bottom:12px}.ok{color:#067647}.bad{color:#b42318}.mono{font-family:ui-monospace,monospace}.rowbtns{display:flex;gap:6px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.small{font-size:12px}.right{text-align:right}.printdoc{display:none}@media(max-width:900px){.side{display:none}.main{margin:0;width:100%}.cards{grid-template-columns:repeat(2,1fr)}.flow{grid-template-columns:repeat(2,1fr)}.content{padding:12px}.form,.grid2{grid-template-columns:1fr}.form .full{grid-column:auto}}@media print{.side,header,.toolbar,.noprint{display:none!important}.main{margin:0;width:100%}.content{padding:0}.printdoc{display:block}.panel,.table{border:0}}
</style>

<body>
<div id="login" class="login">
  <div class="loginbox"><h1>Amazon Supply</h1><div class="muted">供应链线上工作台</div>
    <input id="email" class="field" type="email" placeholder="邮箱">

</div></div>

<script>
const SB_URL='https://whajxxonwtlfuvjyrooh.supabase.co';
const SB_KEY='sb_publishable_R3C66b8mtDzaKyKogBYQCw_KyUbw6G1';
const sb=supabase.createClient(SB_URL,SB_KEY);
let user=null, route='dashboard', expandedParents=new Set(), cache={products:[],images:[],parent_images:[],suppliers:[],purchase_orders:[],purchase_order_items:[],materials:[],production_orders:[],production_order_items:[],inventory:[],ledger:[],fba:[],fba_items:[],outbound:[],outbound_items:[]};
const navs=[['dashboard','经营总览'],['products','商品 / ASIN'],['suppliers','供应商'],['purchase','货物采购'],['materials','辅料采购'],['production','生产进度'],['inventory','库存中心'],['fba','FBA 发货'],['outbound','出库单'],['ledger','库存流水'],['data','数据中心']];
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), money=n=>'¥'+Number(n||0).toFixed(2), today=()=>new Date().toISOString().slice(0,10), gen=p=>p+'-'+Date.now().toString().slice(-10);
function msg(t,bad=false){const el=document.getElementById('authMsg');if(!el)return;el.textContent=t;el.className='small '+(bad?'bad':'muted')}
function authEls(){return {email:document.getElementById('email'),password:document.getElementById('password'),login:document.getElementById('login'),app:document.getElementById('app'),userMail:document.getElementById('userMail')}}
async function signIn(){try{const e=authEls();const em=e.email.value.trim(),pw=e.password.value;if(!em||!pw)return msg('请输入邮箱和密码',true);msg('登录中…');let {error}=await sb.auth.signInWithPassword({email:em,password:pw});if(error)return msg('登录失败：'+error.message,true)}catch(err){msg('登录失败：'+err.message,true)}}
async function signUp(){try{const e=authEls();const em=e.email.value.trim(),pw=e.password.value;if(!em)return msg('请输入邮箱',true);if(pw.length<6)return msg('密码至少6位',true);msg('注册中…');let {data,error}=await sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.origin+location.pathname}});if(error)return msg('注册失败：'+error.message,true);if(data?.session)msg('注册成功，正在进入系统…');else msg('注册成功。请检查邮箱验证邮件，完成验证后再登录。')}catch(err){msg('注册失败：'+err.message,true)}}
async function signOut(){await sb.auth.signOut()}
sb.auth.onAuthStateChange(async(_e,s)=>{user=s?.user||null;const e=authEls();if(user){e.login.classList.add('hidden');e.app.classList.remove('hidden');e.userMail.textContent=user.email;await loadAll({preserveScroll:false});}else{e.app.classList.add('hidden');e.login.classList.remove('hidden')}});
sb.auth.getSession().then(({data})=>{if(data.session){user=data.session.user;const e=authEls();e.login.classList.add('hidden');e.app.classList.remove('hidden');e.userMail.textContent=user.email;loadAll({preserveScroll:false})}}).catch(err=>msg('初始化失败：'+err.message,true))
async function q(table,sel='*'){let {data,error}=await sb.from(table).select(sel);if(error)throw error;return data||[]}
function restoreScrollPosition(y){const apply=()=>window.scrollTo(0,Math.max(0,Math.min(y,document.documentElement.scrollHeight-window.innerHeight)));requestAnimationFrame(()=>{apply();requestAnimationFrame(apply)});setTimeout(apply,120)}
async function loadAll(opts={}){const preserveScroll=opts.preserveScroll!==false,scrollY=preserveScroll?window.scrollY:0;sync.textContent='云端同步中…';try{const [a,b,pi,c,d,e,f,g,h,i,j,k,l,m,n]=await Promise.all([q('products'),q('product_images'),q('parent_product_images'),q('suppliers'),q('purchase_orders'),q('purchase_order_items'),q('material_items'),q('production_orders'),q('production_order_items'),q('inventory'),q('inventory_ledger'),q('fba_shipments'),q('fba_shipment_items'),q('outbound_orders'),q('outbound_order_items')]);Object.assign(cache,{products:a,images:b,parent_images:pi,suppliers:c,purchase_orders:d,purchase_order_items:e,materials:f,production_orders:g,production_order_items:h,inventory:i,ledger:j,fba:k,fba_items:l,outbound:m,outbound_items:n});sync.textContent='云端已同步 '+new Date().toLocaleTimeString();render();if(preserveScroll)restoreScrollPosition(scrollY)}catch(e){sync.textContent='同步失败：'+e.message}}
function go(r){if(r==='products'&&route!=='products')expandedParents.clear();route=r;window.scrollTo(0,0);render()}function render(){nav.innerHTML=navs.map(x=>'<button class="'+(route===x[0]?'on':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>').join('');pageTitle.textContent=navs.find(x=>x[0]===route)?.[1]||'';root.innerHTML=views[route]();if(route==='products')loadThumbs()}
const inv=p=>cache.inventory.find(x=>x.product_id===p.id)?.available_qty||0;
const imgRec=p=>cache.images.find(x=>x.parent_asin===(p.parent_asin||'')&&x.color===(p.color||''));
const parentImgRec=parentAsin=>cache.parent_images.find(x=>x.parent_asin===parentAsin);
const sizeRank=s=>{const x=String(s||'').trim().toUpperCase();const order=['S','M','L','XL','2XL','3XL','4XL'];const i=order.indexOf(x);return i<0?999:i};
const sortParentRows=rows=>{const colorOrder=[];rows.forEach(x=>{const c=String(x.color||'');if(!colorOrder.includes(c))colorOrder.push(c)});return rows.slice().sort((a,b)=>{const ca=colorOrder.indexOf(String(a.color||'')),cb=colorOrder.indexOf(String(b.color||''));if(ca!==cb)return ca-cb;const sa=sizeRank(a.size),sb=sizeRank(b.size);if(sa!==sb)return sa-sb;return String(a.size||'').localeCompare(String(b.size||''),'zh-CN')})};
const card=(t,v,r)=>'<div class="card" onclick="go(\''+r+'\')"><span>'+t+'</span><b>'+Number(v||0).toLocaleString()+'</b></div>';
const empty=(a,b)=>'<div class="empty"><b>'+a+'</b><div>'+b+'</div></div>';
const views={
dashboard(){let stock=cache.inventory.reduce((s,x)=>s+Number(x.available_qty||0),0),po=cache.purchase_orders.filter(x=>!['已完成','已取消'].includes(x.status)).length,pd=cache.production_orders.filter(x=>x.status!=='生产完成').length,trans=cache.fba.filter(x=>['运输中','已送达'].includes(x.status)).length;return '<div class="cards">'+card('商品资料',cache.products.length,'products')+card('成品现货',stock,'inventory')+card('待跟进采购',po,'purchase')+card('生产任务',pd,'production')+card('FBA在途',trans,'fba')+'</div><div class="panel"><div class="ph"><b>供应链主流程</b></div><div class="pb"><div class="flow">'+[['采购下单','purchase'],['生产中','production'],['待质检','production'],['生产完成','inventory'],['FBA运输中','fba'],['亚马逊接收','fba']].map(x=>'<div class="step" onclick="go(\''+x[1]+'\')">'+x[0]+'</div>').join('')+'</div></div></div><div class="grid2"><div class="panel"><div class="ph"><b>最近库存流水</b></div><div class="pb">'+(cache.ledger.slice(0,8).map(l=>'<div>'+esc(l.business_type)+' · '+esc(product(l.product_id)?.sku)+' · '+(l.qty_change>0?'+':'')+l.qty_change+'</div>').join('')||'暂无流水')+'</div></div><div class="panel"><div class="ph"><b>库存提醒</b></div><div class="pb">'+(cache.products.filter(p=>inv(p)<Number(p.safety_stock||0)).map(p=>'<div class="bad">'+esc(p.sku)+'：'+inv(p)+' / 安全库存 '+p.safety_stock+'</div>').join('')||'当前没有低库存提醒')+'</div></div></div>'},
products(){return '<div class="title"><h2>商品主数据</h2><button class="btn primary" onclick="editProduct()">＋ 新增商品</button></div><div class="warn"><b>图片共享规则：</b>同一父ASIN + 同一颜色只需上传 1 次。任意尺码上传后，同颜色其他尺码自动共用；不同颜色绝不串图。</div><div class="toolbar"><input id="pSearch" class="field" placeholder="搜索父体 / 子体ASIN / SKU / 内部编码" oninput="filterProducts()"><select id="pColor" class="field" onchange="filterProducts()"><option value="">全部颜色</option>'+[...new Set(cache.products.map(x=>x.color).filter(Boolean))].map(x=>'<option>'+esc(x)+'</option>').join('')+'</select><button class="btn ghost" onclick="exportCSV(\'products\')">导出CSV</button></div><div id="productWrap">'+productGroups(cache.products)+'</div>'},
suppliers(){return '<div class="title"><h2>供应商</h2><button class="btn primary" onclick="editSupplier()">＋ 新增供应商</button></div>'+(cache.suppliers.length?'<div class="table"><table><thead><tr><th>公司</th><th>网址</th><th>地址</th><th>联系人</th><th>电话</th><th>账户</th><th>收款人</th><th>银行</th><th>银行账户</th><th>操作</th></tr></thead><tbody>'+cache.suppliers.map(s=>'<tr><td>'+esc(s.company_name)+'</td><td>'+esc(s.website)+'</td><td>'+esc(s.company_address)+'</td><td>'+esc(s.contact_name)+'</td><td>'+esc(s.phone)+'</td><td>'+esc(s.bank_type)+'</td><td>'+esc(s.account_name)+'</td><td>'+esc(s.bank_name)+'</td><td>'+esc(s.bank_account)+'</td><td><button class="link" onclick="editSupplier(\''+s.id+'\')">编辑</button><button class="link red" onclick="delSupplier(\''+s.id+'\')">删除</button></td></tr>').join('')+'</tbody></table></div>':empty('暂无供应商','点击“新增供应商”开始录入'))},
purchase(){return '<div class="title"><h2>货物采购</h2><button class="btn primary" onclick="newPO()">＋ 新建采购单</button></div>'+ordersTable(cache.purchase_orders,'采购单',o=>'<button class="link" onclick="poToProduction(\''+o.id+'\')">生成生产单</button>')},
materials(){return '<div class="title"><h2>辅料采购</h2><button class="btn primary" onclick="editMaterial()">＋ 新增辅料</button></div>'+(cache.materials.length?'<div class="table"><table><thead><tr><th>名称</th><th>规格</th><th>单位</th><th>当前库存</th><th>安全库存</th><th>采购价</th><th>操作</th></tr></thead><tbody>'+cache.materials.map(m=>'<tr><td>'+esc(m.name)+'</td><td>'+esc(m.specification)+'</td><td>'+esc(m.unit)+'</td><td>'+m.current_stock+'</td><td>'+m.safety_stock+'</td><td>'+money(m.purchase_price)+'</td><td><button class="link" onclick="editMaterial(\''+m.id+'\')">编辑</button><button class="link" onclick="materialInbound(\''+m.id+'\')">采购入库</button></td></tr>').join('')+'</tbody></table></div>':empty('暂无辅料','先建立辅料资料'))},
production(){return '<div class="title"><h2>生产进度</h2></div>'+ordersTable(cache.production_orders,'生产单',o=>'<button class="link" onclick="advanceProduction(\''+o.id+'\')">推进状态</button> <button class="link" onclick="printOrder(\'生产单\',\''+o.id+'\')">打印</button>')},
inventory(){return '<div class="title"><h2>库存中心</h2><button class="btn primary" onclick="adjustStock()">＋ 库存调整</button></div><div class="table"><table><thead><tr><th>SKU</th><th>内部编码</th><th>商品</th><th>颜色</th><th>尺码</th><th>可用库存</th><th>安全库存</th><th>状态</th></tr></thead><tbody>'+cache.products.map(p=>'<tr><td>'+esc(p.sku)+'</td><td>'+esc(p.internal_code)+'</td><td>'+esc(p.product_name)+'</td><td>'+esc(p.color)+'</td><td>'+esc(p.size)+'</td><td><b>'+inv(p)+'</b></td><td>'+p.safety_stock+'</td><td>'+(inv(p)<p.safety_stock?'<span class="bad">低库存</span>':'<span class="ok">正常</span>')+'</td></tr>').join('')+'</tbody></table></div>'},
fba(){return '<div class="title"><h2>FBA 发货</h2><button class="btn primary" onclick="newFBA()">＋ 创建FBA发货</button></div>'+ordersTable(cache.fba,'FBA发货',o=>'<button class="link" onclick="advanceFBA(\''+o.id+'\')">推进状态</button>')},
outbound(){return '<div class="title"><h2>出库单</h2></div>'+ordersTable(cache.outbound,'出库单',o=>'<button class="link" onclick="printOrder(\'出库单\',\''+o.id+'\')">打印</button>')},
ledger(){return '<div class="title"><h2>库存流水</h2><button class="btn ghost" onclick="exportCSV(\'ledger\')">导出CSV</button></div><div class="table"><table><thead><tr><th>日期</th><th>业务类型</th><th>关联单号</th><th>SKU</th><th>内部编码</th><th>变动</th><th>结存</th><th>备注</th></tr></thead><tbody>'+cache.ledger.map(l=>{let p=product(l.product_id);return '<tr><td>'+new Date(l.occurred_at).toLocaleString()+'</td><td>'+esc(l.business_type)+'</td><td>'+esc(l.reference_no)+'</td><td>'+esc(p?.sku)+'</td><td>'+esc(p?.internal_code)+'</td><td>'+(l.qty_change>0?'+':'')+l.qty_change+'</td><td>'+l.balance_after+'</td><td>'+esc(l.notes)+'</td></tr>'}).join('')+'</tbody></table></div>'},
data(){return '<div class="title"><h2>数据中心</h2></div><div class="warn">当前使用 GitHub Pages 免费托管前端 + Supabase 云数据库。业务数据和图片不依赖这台电脑。</div><div class="panel"><div class="ph"><b>V10 一次迁移 / 云端备份</b></div><div class="pb"><p>先在旧 V10 “数据中心”导出全部 JSON，再在这里导入。系统会预览数据数量，并按“父ASIN+颜色”去重商品图片。</p><button class="btn primary" onclick="importFile.click()">导入V10 JSON</button> <button class="btn ghost" onclick="backupAll()">导出云端JSON备份</button><div id="importPreview" style="margin-top:12px"></div></div></div>'}

async function loadThumbs(){

function editParentImage(parentAsin){openModal('父体图片 · '+parentAsin,'<form id="parentImageForm" class="form"><label class="full">上传父体图片<input type="file" name="image" accept="image/jpeg,image/png,image/webp" required><span class="small muted">该图片只用于父体汇总行，不会覆盖任何颜色子体图片。</span></label><div class="actions full"><button type="button" class="btn ghost" onclick="closeModal()">取消</button><button class="btn primary">保存父体图片</button></div></form>');parentImageForm.onsubmit=async e=>{e.preventDefault();let file=e.target.image.files[0];if(!file)return;let path=user.id+'/'+safe(parentAsin)+'__PARENT.'+imageExt(file);let up=await sb.storage.from('product-images').upload(path,file,{upsert:true,contentType:file.type||'image/jpeg',cacheControl:'31536000'});if(up.error)return alert('父体图片上传失败：'+up.error.message);let r=await sb.from('parent_product_images').upsert({parent_asin:parentAsin,storage_path:path},{onConflict:'owner_id,parent_asin'});if(r.error)return alert('父体图片关联失败：'+r.error.message);invalidateImageCache(path);closeModal();await loadAll()}}
async function deleteParentGroup(parentAsin,childCount){
  const warning='确定删除父体 '+parentAsin+' 吗？\n\n将同时删除该父体下全部 '+childCount+' 个子体、对应国内库存记录、颜色共享图片关联和父体图片关联。\n\n此操作不可恢复。';
  if(!confirm(warning))return;
  if(!confirm('再次确认：删除 '+parentAsin+' 及全部子体？'))return;
  const colorPaths=cache.images.filter(x=>x.parent_asin===parentAsin).map(x=>x.storage_path).filter(Boolean);
  const parentPath=parentImgRec(parentAsin)?.storage_path;
  const paths=[...new Set([...colorPaths,...(parentPath?[parentPath]:[])])];
  sync.textContent='正在删除父体 '+parentAsin+'…';
  const {data,error}=await sb.rpc('delete_parent_product_group',{p_parent_asin:parentAsin});
  if(error){
    sync.textContent='删除失败';
    return alert('无法删除父体：'+error.message);
  }
  if(paths.length){
    const {error:storageError}=await sb.storage.from('product-images').remove(paths);
    if(storageError)console.warn('父体数据已删除，但清理图片文件失败：',storageError);
    paths.forEach(invalidateImageCache);
  }
  alert('已删除父体 '+parentAsin+'，同时删除 '+Number(data?.deleted_children||childCount)+' 个子体。');
  await loadAll({preserveScroll:true});
}

async function changeStock(pid,delta,type,ref,notes=''){let row=cache.inventory.find(x=>x.product_id===pid),before=Number(row?.available_qty||0),after=before+Number(delta);if(after<0)throw new Error('库存不足');if(row)await sb.from('inventory').update({available_qty:after}).eq('id',row.id);else await sb.from('inventory').insert({product_id:pid,available_qty:after,safety_stock:product(pid)?.safety_stock||0});await sb.from('inventory_ledger').insert({business_type:type,reference_no:ref,product_id:pid,qty_change:delta,balance_after:after,notes})}
function adjustStock(){openModal('库存调整','<form id="f" class="form"><label>商品<select name="product_id">'+cache.products.map(p=>'<option value="'+p.id+'">'+esc(p.sku+' | '+p.internal_code+' | '+p.color+' '+p.size)+'</option>').join('')+'</select></label><label>调整数量<input type="number" name="qty" placeholder="增加填正数，减少填负数"></label><label class="full">备注<input name="notes"></label><div class="actions full"><button type="button" class="btn ghost" onclick="closeModal()">取消</button><button class="btn primary">确认调整</button></div></form>');f.onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(f).entries());try{await changeStock(d.product_id,Number(d.qty||0),'库存调整',gen('ADJ'),d.notes)}catch(x){return alert(x.message)}closeModal();await loadAll()}}
function newFBA(){openModal('创建FBA发货','<form id="f" class="form"><label>Shipment ID<input required name="shipment_id" value="'+gen('FBA')+'"></label><label>目的仓 FC<input name="destination_fc"></label><label>承运商/货代<input name="carrier"></label><label>跟踪号<input name="tracking_no"></label><label>出库日期<input type="date" name="outbound_date" value="'+today()+'"></label><label>箱数<input type="number" name="box_count" value="1"></label><label>经办人<input name="operator_name"></label><label>状态<select name="status"><option>草稿</option><option>运输中</option></select></label><label class="full">备注<textarea name="notes"></textarea></label><div class="full"><b>发货明细</b><div id="poLines">'+lineRow()+'</div><button type="button" class="btn ghost" onclick="poLines.insertAdjacentHTML(\'beforeend\',lineRow())">＋ 添加SKU</button></div><div class="actions full"><button type="button" class="btn ghost" onclick="closeModal()">取消</button><button class="btn primary">保存并出库</button></div></form>');document.querySelectorAll('.price').forEach(x=>x.parentElement.removeChild(x));f.onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(f).entries());d.box_count=Number(d.box_count||0);let lines=[...document.querySelectorAll('.poLine')].map(x=>({product_id:x.querySelector('.psel').value,quantity:Number(x.querySelector('.qty').value||0)}));for(const x of lines){let p=product(x.product_id);if(x.quantity>inv(p))return alert(p.sku+' 库存不足')}let {data:o,error}=await sb.from('fba_shipments').insert(d).select().single();if(error)return alert(error.message);await sb.from('fba_shipment_items').insert(lines.map(x=>({fba_shipment_id:o.id,...x})));let outNo=gen('OUT'),{data:oo,error:oe}=await sb.from('outbound_orders').insert({outbound_no:outNo,fba_shipment_id:o.id,outbound_date:d.outbound_date,destination:d.destination_fc,carrier:d.carrier,tracking_no:d.tracking_no,operator_name:d.operator_name,notes:d.notes}).select().single();if(oe)return alert(oe.message);await sb.from('outbound_order_items').insert(lines.map(x=>({outbound_order_id:oo.id,...x})));for(const x of lines){await changeStock(x.product_id,-x.quantity,'FBA出库',d.shipment_id,'FBA发货自动扣库存')}closeModal();await loadAll()}}
async function advanceFBA(id){let o=cache.fba.find(x=>x.id===id),seq=['草稿','运输中','已送达','Amazon已接收'],i=seq.indexOf(o.status);if(i===seq.length-1)return alert('已完成接收');await sb.from('fba_shipments').update({status:seq[i+1]}).eq('id',id);await loadAll()}
function printOrder(type,id){let o=(type==='生产单'?cache.production_orders:cache.outbound).find(x=>x.id===id);let items=type==='生产单'?cache.production_order_items.filter(x=>x.production_order_id===id):cache.outbound_items.filter(x=>x.outbound_order_id===id);let w=window.open('','_blank');w.document.write('<meta charset="utf-8"><style>body{font-family:Arial,"Microsoft YaHei";padding:30px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #aaa;padding:8px;text-align:left}h1{text-align:center}</style><h1>'+type+'</h1><p>单号：'+esc(o.production_no||o.outbound_no)+'</p><table><tr><th>SKU</th><th>内部编码</th><th>商品</th><th>颜色</th><th>尺码</th><th>数量</th></tr>'+items.map(i=>{let p=product(i.product_id);return '<tr><td>'+esc(p?.sku)+'</td><td>'+esc(p?.internal_code)+'</td><td>'+esc(p?.product_name)+'</td><td>'+esc(p?.color)+'</td><td>'+esc(p?.size)+'</td><td>'+i.quantity+'</td></tr>'}).join('')+'</table><br><p>制单：________　复核：________　仓库：________</p>');w.document.close();w.focus();setTimeout(()=>w.print(),300)}
function exportCSV(kind){let rows=kind==='ledger'?cache.ledger.map(l=>({日期:l.occurred_at,业务类型:l.business_type,关联单号:l.reference_no,SKU:product(l.product_id)?.sku,内部编码:product(l.product_id)?.internal_code,变动:l.qty_change,结存:l.balance_after,备注:l.notes})):cache.products.map(p=>({父ASIN:p.parent_asin,子ASIN:p.child_asin,SKU:p.sku,内部编码:p.internal_code,商品:p.product_name,类目:p.category,颜色:p.color,尺码:p.size,不含税:p.untaxed_price,税率:p.tax_rate,含税:p.taxed_price,库存:inv(p)}));downloadCSV(rows,kind+'.csv')}
function downloadCSV(rows,name){if(!rows.length)return alert('没有可导出的数据');let heads=Object.keys(rows[0]),csv='\ufeff'+heads.join(',')+'\n'+rows.map(r=>heads.map(h=>'"'+String(r[h]??'').replace(/"/g,'""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=name;a.click()}
async function backupAll(){let data={products:cache.products,product_images:cache.images,suppliers:cache.suppliers,purchase_orders:cache.purchase_orders,purchase_order_items:cache.purchase_order_items,material_items:cache.materials,production_orders:cache.production_orders,production_order_items:cache.production_order_items,inventory:cache.inventory,inventory_ledger:cache.ledger,fba_shipments:cache.fba,fba_shipment_items:cache.fba_items,outbound_orders:cache.outbound,outbound_order_items:cache.outbound_items};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='AmazonSupply_Cloud_'+today()+'.json';a.click()}
importFile.onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let j=JSON.parse(await file.text()),products=j.products||j.商品||[];let stats={商品:products.length,父体:new Set(products.map(x=>x.parent_asin||x.父ASIN||x.父体ASIN).filter(Boolean)).size,供应商:(j.suppliers||j.供应商||[]).length,采购单:(j.purchase_orders||j.purchaseOrders||[]).length,生产单:(j.production_orders||j.productionOrders||[]).length,库存:Array.isArray(j.inventory)?j.inventory.length:Object.keys(j.inventory||{}).length,FBA:(j.fba_shipments||j.fbaShipments||[]).length,出库单:(j.outbound_orders||j.outboundOrders||[]).length,图片:products.filter(x=>x.imageData||x.imageUrl).length};importPreview.innerHTML='<b>迁移预览：</b> '+Object.entries(stats).map(x=>x[0]+' '+x[1]).join(' · ')+'<br><button class="btn primary" id="mergeBtn">合并导入</button> <button class="btn danger" id="overwriteBtn">覆盖导入</button>';mergeBtn.onclick=()=>doImport(j,false);overwriteBtn.onclick=()=>{if(confirm('危险操作：覆盖会先删除当前账号已有业务数据，确定继续？'))doImport(j,true)}}catch(x){alert('JSON解析失败：'+x.message)}}
async function doImport(j,overwrite){sync.textContent='正在迁移V10…';try{if(overwrite){for(const t of ['outbound_order_items','outbound_orders','fba_shipment_items','fba_shipments','inventory_ledger','inventory','production_order_items','production_orders','material_items','purchase_order_items','purchase_orders','product_images','suppliers','products'])await sb.from(t).delete().neq('id','00000000-0000-0000-0000-000000000000')}let oldP=j.products||j.商品||[];let imageGroups=new Map();for(const x of oldP){let parent=x.parent_asin||x.父ASIN||x.父体ASIN||'',color=x.color||x.颜色||'',sku=x.sku||x.SKU||x.子SKU;if(!sku)continue;let row={parent_asin:parent,child_asin:x.child_asin||x.ASIN||x.子ASIN||null,sku,internal_code:x.internal_code||x.内部编码||'',product_name:x.product_name||x.商品名称||x.商品||'',category:x.category||x.产品类目||x.类目||'',color,size:x.size||x.尺码||'',untaxed_price:Number(x.untaxed_price??x.不含税价格RMB??x.单件采购成本RMB??0),tax_rate:Number(x.tax_rate??x.含税税率??0),first_leg_cost:Number(x.first_leg_cost??x.单件头程成本RMB??0),other_cost:Number(x.other_cost??x.单件其他成本RMB??0),safety_stock:Number(x.safety_stock??x.安全库存??0),notes:x.notes||x.备注||''};let {data:p,error}=await sb.from('products').upsert(row,{onConflict:'owner_id,sku'}).select().single();if(error)throw error;await sb.from('inventory').upsert({product_id:p.id,available_qty:Number(x.inventory??x.国内库存??0),safety_stock:row.safety_stock},{onConflict:'owner_id,product_id'});let img=x.imageData||x.imageUrl;if(img&&parent&&color&&!imageGroups.has(parent+'|'+color))imageGroups.set(parent+'|'+color,img)}for(const [k,img] of imageGroups){if(!String(img).startsWith('data:'))continue;let [parent,color]=k.split('|'),blob=await (await fetch(img)).blob(),path=sharedImagePath(parent,color,{name:'image.'+imageExt({type:blob.type}),type:blob.type});let up=await sb.storage.from('product-images').upload(path,blob,{upsert:true,contentType:blob.type||'image/jpeg',cacheControl:'31536000'});if(!up.error){await sb.from('product_images').upsert({parent_asin:parent,color,storage_path:path},{onConflict:'owner_id,parent_asin,color'});invalidateImageCache(path)}}let olds=j.suppliers||j.供应商||[];for(const s of olds){let row={company_name:s.company_name||s.name||s.公司名称||s.供应商名称,website:s.website||s.供应商网址,company_address:s.company_address||s.address||s.公司地址,contact_name:s.contact_name||s.contact||s.联系人,phone:s.phone||s.电话,payment_method:s.payment_method||s.付款方式,bank_type:s.bankType||s.bank_type||s.账户类型||null,account_name:s.accountName||s.account_name||s.收款人,bank_name:s.bankName||s.bank_name||s.收款银行,bank_account:s.bankAccount||s.bank_account||s.银行账户,notes:s.notes||s.备注};if(row.company_name)await sb.from('suppliers').upsert(row,{onConflict:'owner_id,company_name'})}alert('V10 商品、图片和供应商迁移完成。其余历史业务单据可继续在新系统录入或后续扩展迁移。');await loadAll()}catch(x){alert('迁移失败：'+x.message);sync.textContent='迁移失败'}}
</script>
