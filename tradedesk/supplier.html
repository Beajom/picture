<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TradeDesk Supplier Portal</title>
<style>
:root{--blue:#155eef;--navy:#101828;--muted:#667085;--line:#e4e7ec;--bg:#f5f7fb;--ok:#067647;--warn:#b54708;--bad:#b42318}
*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--navy)}
button,input,select,textarea{font:inherit}.hidden{display:none!important}
.top{position:sticky;top:0;z-index:20;height:64px;background:#0d1b33;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;box-shadow:0 2px 12px rgba(16,24,40,.12)}
.brand{display:flex;align-items:center;gap:10px}.logo{width:36px;height:36px;border-radius:10px;background:#246bfe;display:grid;place-items:center;font-weight:900}.brand b{font-size:17px}.brand small{display:block;color:#9fb3d1;margin-top:2px}
.top-actions{display:flex;gap:10px;align-items:center}.top button{border:1px solid #40506a;background:#152744;color:#fff;border-radius:9px;padding:8px 12px;cursor:pointer}
.wrap{max-width:1420px;margin:0 auto;padding:24px}
.hero{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:18px}.hero h1{margin:0;font-size:25px}.hero p{margin:6px 0 0;color:var(--muted)}.summary{display:flex;gap:10px;flex-wrap:wrap}
.chip{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:106px}.chip b{font-size:18px;display:block}.chip span{font-size:11px;color:var(--muted)}
.card{background:#fff;border:1px solid #e1e6ef;border-radius:16px;box-shadow:0 4px 16px rgba(16,24,40,.04)}
.toolbar{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.toolbar input{width:min(380px,100%);height:40px;border:1px solid #d0d5dd;border-radius:9px;padding:0 12px}.toolbar .hint{font-size:12px;color:var(--muted)}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1180px}th{background:#f8fafc;color:#475467;font-size:11px;text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);white-space:nowrap}td{padding:10px;border-bottom:1px solid #edf0f5;vertical-align:middle;font-size:12px}tr:last-child td{border-bottom:0}
.prod{display:flex;align-items:center;gap:10px;min-width:190px}.prod img{width:48px;height:48px;object-fit:contain;border:1px solid var(--line);border-radius:9px;background:#fff}.prod b{display:block}.prod small{color:var(--muted);display:block;margin-top:3px}
.field{width:88px;height:34px;border:1px solid #d0d5dd;border-radius:7px;padding:0 8px;background:#fff}.field.wide{width:116px}.field.note{width:150px}.dims{display:flex;align-items:center;gap:4px}.dims input{width:58px}.cbm{font-weight:700;color:#344054;white-space:nowrap}
.btn{border:1px solid #d0d5dd;background:#fff;color:#344054;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn:disabled{opacity:.55;cursor:wait}
.status{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:800}.status.pending{background:#f2f4f7;color:#475467}.status.submitted{background:#fff6ed;color:var(--warn)}.status.approved{background:#ecfdf3;color:var(--ok)}.status.rejected{background:#fef3f2;color:var(--bad)}
.review-note{font-size:10px;color:var(--bad);margin-top:4px;max-width:150px}.empty{padding:54px;text-align:center;color:var(--muted)}
.auth-shell{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#eaf0ff,#f8fafc 55%,#edf7ff)}
.auth-card{width:min(440px,100%);background:#fff;border:1px solid #dfe5ef;border-radius:20px;padding:28px;box-shadow:0 18px 55px rgba(16,24,40,.12)}.auth-head{text-align:center;margin-bottom:24px}.auth-head .logo{margin:0 auto 12px}.auth-head h1{font-size:22px;margin:0}.auth-head p{font-size:13px;color:var(--muted);line-height:1.6}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#f2f4f7;padding:4px;border-radius:10px;margin-bottom:18px}.tabs button{border:0;background:transparent;border-radius:7px;padding:9px;cursor:pointer;font-weight:700;color:#667085}.tabs button.active{background:#fff;color:#175cd3;box-shadow:0 1px 4px rgba(16,24,40,.08)}
.auth-field{margin-bottom:13px}.auth-field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.auth-field input{width:100%;height:43px;border:1px solid #d0d5dd;border-radius:9px;padding:0 12px}.auth-card .primary{width:100%;height:44px;margin-top:4px}.invite-note{background:#eff6ff;border:1px solid #b2ccff;color:#1849a9;border-radius:10px;padding:10px 12px;font-size:12px;margin-bottom:14px}.msg{font-size:12px;line-height:1.5;margin-top:12px}.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}
.no-access{max-width:620px;margin:80px auto;padding:28px;text-align:center}.no-access h2{margin-top:0}.invite-accept{display:flex;gap:8px;margin-top:18px}.invite-accept input{flex:1;height:40px;border:1px solid #d0d5dd;border-radius:8px;padding:0 10px}
.toast{position:fixed;right:22px;bottom:22px;z-index:50;background:#101828;color:#fff;border-radius:10px;padding:12px 15px;box-shadow:0 12px 30px rgba(16,24,40,.25);font-size:12px;max-width:360px}
@media(max-width:760px){.wrap{padding:14px}.hero{display:block}.summary{margin-top:14px}.top{padding:0 14px}.brand small{display:none}.toolbar{align-items:stretch;flex-direction:column}.toolbar input{width:100%}}
</style>
</head>
<body>
<div id="app">加载中...</div>
<div id="toast" class="toast hidden"></div>
<script>
const SUPABASE_URL='https://whajxxonwtlfuvjyrooh.supabase.co';
const SUPABASE_KEY='sb_publishable_R3C66b8mtDzaKyKogBYQCw_KyUbw6G1';
const STORE='tradedesk_supplier_session_v1';
const INVITE_STORE='tradedesk_supplier_invite_v1';
const $=s=>document.querySelector(s);
let session=null,account=null,items=[],filterText='',authMode='login';

function toast(msg){const el=$('#toast');if(!el)return;el.textContent=msg;el.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.add('hidden'),3200)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(v){const n=Number(v);return Number.isFinite(n)?n:0}
function stored(){try{return JSON.parse(localStorage.getItem(STORE)||'null')}catch(e){return null}}
function saveSession(v){session=v;v?localStorage.setItem(STORE,JSON.stringify(v)):localStorage.removeItem(STORE)}
function jwtPayload(token=''){try{const p=token.split('.')[1];return JSON.parse(atob(p.replace(/-/g,'+').replace(/_/g,'/')))}catch(e){return {}}}
function jwtExp(token=''){return Number(jwtPayload(token).exp||0)}
async function raw(url,opts={}){const r=await fetch(url,opts);const txt=await r.text();let body=null;try{body=txt?JSON.parse(txt):null}catch(e){body=txt}if(!r.ok)throw new Error(body?.message||body?.error_description||body?.error||('HTTP '+r.status));return body}
async function refresh(){let s=stored();if(!s?.access_token)return null;if(!s.user){const p=jwtPayload(s.access_token);if(p.sub){s.user={id:p.sub,email:p.email||''};saveSession(s)}}if(jwtExp(s.access_token)>Date.now()/1000+90){session=s;return s}if(!s.refresh_token){saveSession(null);return null}try{const d=await raw(SUPABASE_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})});s={...d,user:d.user||s.user};saveSession(s);session=s;return s}catch(e){saveSession(null);return null}}
async function authHeaders(extra={}){const s=await refresh();return {apikey:SUPABASE_KEY,Authorization:'Bearer '+(s?.access_token||SUPABASE_KEY),'Content-Type':'application/json',...extra}}
async function rest(table,query=''){const h=await authHeaders();return raw(SUPABASE_URL+'/rest/v1/'+table+(query?'?'+query:''),{headers:h})}
async function rpc(name,payload={}){const h=await authHeaders();return raw(SUPABASE_URL+'/rest/v1/rpc/'+name,{method:'POST',headers:h,body:JSON.stringify(payload)})}
async function signIn(email,password){const d=await raw(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});session={...d,user:d.user};saveSession(session);return d}
async function signUp(email,password){const redirect=location.origin+location.pathname;return raw(SUPABASE_URL+'/auth/v1/signup?redirect_to='+encodeURIComponent(redirect),{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})})}
async function signOut(){try{if(session?.access_token)await raw(SUPABASE_URL+'/auth/v1/logout',{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+session.access_token}})}catch(e){}saveSession(null);session=null;account=null;items=[];renderAuth()}

function captureAuthCallback(){try{const h=new URLSearchParams(location.hash.replace(/^#/,''));
 const access=h.get('access_token'),refreshToken=h.get('refresh_token');
 if(access){const userRaw=h.get('user');let user=null;try{user=userRaw?JSON.parse(decodeURIComponent(userRaw)):null}catch(e){}
  const p=jwtPayload(access),s={access_token:access,refresh_token:refreshToken||'',token_type:h.get('token_type')||'bearer',expires_in:Number(h.get('expires_in')||0),user:user||stored()?.user||(p.sub?{id:p.sub,email:p.email||''}:null)};
  saveSession(s);session=s;history.replaceState({},'',location.pathname+location.search);return s}
 }catch(e){}return null}
function normalizeInviteCode(v=''){const raw=String(v||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');return raw.length===12?raw.slice(0,4)+'-'+raw.slice(4,8)+'-'+raw.slice(8):String(v||'').trim().toUpperCase()}
function inviteToken(){const legacy=new URLSearchParams(location.search).get('invite');if(legacy){const code=normalizeInviteCode(legacy);localStorage.setItem(INVITE_STORE,code);return code}return normalizeInviteCode(localStorage.getItem(INVITE_STORE)||'')}
function setAuthMode(mode){authMode=mode;renderAuth()}
function renderAuth(message='',kind=''){
 const inv=inviteToken();
 document.getElementById('app').innerHTML=`<div class="auth-shell"><div class="auth-card"><div class="auth-head"><div class="logo">TD</div><h1>供应商工作台</h1><p>仅用于维护分配给您的产品报价、重量和装箱资料。</p></div>
 <div class="tabs"><button class="${authMode==='login'?'active':''}" onclick="setAuthMode('login')">登录</button><button class="${authMode==='signup'?'active':''}" onclick="setAuthMode('signup')">首次注册</button></div>
 <form onsubmit="submitAuth(event)"><div class="auth-field"><label>邮箱</label><input id="authEmail" type="email" required autocomplete="email" placeholder="supplier@example.com"></div><div class="auth-field"><label>密码</label><input id="authPassword" type="password" minlength="6" required autocomplete="${authMode==='login'?'current-password':'new-password'}" placeholder="至少 6 位"></div>
 <div class="auth-field"><label>邀请码 <span style="font-weight:400;color:#98a2b3">（首次绑定必填）</span></label><input id="authInviteCode" value="${esc(inv)}" maxlength="14" autocomplete="off" placeholder="例如：7F3A-9C2D-B681" style="text-transform:uppercase;letter-spacing:1.2px"><div style="font-size:11px;color:#98a2b3;margin-top:5px">已经绑定过的账号，后续登录可以不填。</div></div>
 <button class="btn primary" id="authBtn" type="submit">${authMode==='login'?'登录供应商工作台':'创建供应商账号'}</button></form>
 <div id="authMsg" class="msg ${kind}">${esc(message)}</div></div></div>`;
}
async function submitAuth(e){e.preventDefault();const email=$('#authEmail').value.trim(),password=$('#authPassword').value,code=normalizeInviteCode($('#authInviteCode')?.value||'');if(code)localStorage.setItem(INVITE_STORE,code);const btn=$('#authBtn');btn.disabled=true;btn.textContent='处理中...';try{
 if(authMode==='signup'){const d=await signUp(email,password);if(d.access_token){session={...d,user:d.user};saveSession(session);await afterAuth()}else{renderAuth('注册成功。请先到邮箱完成验证，然后返回此页面登录。','ok')}}
 else{await signIn(email,password);await afterAuth()}
 }catch(err){renderAuth(err.message||'操作失败','err')}}
async function acceptInvite(token){if(!token)return null;const d=await rpc('accept_trade_supplier_invite',{p_token:token});localStorage.removeItem(INVITE_STORE);history.replaceState({},'',location.pathname);return d}
async function afterAuth(){const token=inviteToken();if(token){try{await acceptInvite(token);toast('供应商账号已绑定')}catch(e){toast(e.message)}}await loadPortal()}

async function loadPortal(){try{
 const accounts=await rest('trade_supplier_accounts','select=*&auth_user_id=eq.'+encodeURIComponent(session.user.id)+'&limit=1');
 account=accounts?.[0]||null;
 if(!account){renderNoAccess();return}
 if(account.status!=='active'){renderDisabled();return}
 items=await rest('trade_supplier_product_inputs','select=*&supplier_id=eq.'+encodeURIComponent(account.supplier_id)+'&is_active=eq.true&order=sku.asc');
 renderPortal();
 }catch(e){document.getElementById('app').innerHTML='<div class="no-access card"><h2>加载失败</h2><p>'+esc(e.message)+'</p><button class="btn" onclick="location.reload()">重新加载</button></div>'}}
function renderNoAccess(){document.getElementById('app').innerHTML=`<div class="top"><div class="brand"><div class="logo">TD</div><div><b>Supplier Portal</b><small>TradeDesk 供应商工作台</small></div></div><button onclick="signOut()">退出</button></div><div class="no-access card"><h2>账号尚未绑定供应商</h2><p>请输入采购方提供的 12 位邀请码，绑定后即可看到分配给您的产品。</p><div class="invite-accept"><input id="manualInvite" maxlength="14" value="${esc(inviteToken())}" placeholder="例如：7F3A-9C2D-B681" style="text-transform:uppercase;letter-spacing:1.2px"><button class="btn primary" onclick="acceptManualInvite()">绑定账号</button></div></div>`}
async function acceptManualInvite(){const t=normalizeInviteCode($('#manualInvite').value);if(!t)return toast('请输入邀请码');localStorage.setItem(INVITE_STORE,t);try{await acceptInvite(t);await loadPortal()}catch(e){toast(e.message)}}
function renderDisabled(){document.getElementById('app').innerHTML=`<div class="top"><div class="brand"><div class="logo">TD</div><div><b>Supplier Portal</b><small>TradeDesk 供应商工作台</small></div></div><button onclick="signOut()">退出</button></div><div class="no-access card"><h2>账号已暂停</h2><p>该供应商账号当前已被管理员停用。如需继续填写，请联系采购方。</p></div>`}

function filteredItems(){const q=filterText.trim().toLowerCase();return q?items.filter(x=>(x.sku+' '+x.product_name).toLowerCase().includes(q)):items}
function statusLabel(s){return {pending:'未填写',submitted:'待审核',approved:'已通过',rejected:'需修改'}[s]||s}
function cbmOf(x){return num(x.carton_length_cm)*num(x.carton_width_cm)*num(x.carton_height_cm)/1000000}
function renderPortal(){
 const list=filteredItems(),submitted=items.filter(x=>x.status==='submitted').length,approved=items.filter(x=>x.status==='approved').length;
 document.getElementById('app').innerHTML=`<div class="top"><div class="brand"><div class="logo">TD</div><div><b>TradeDesk Supplier</b><small>${esc(account.supplier_name||'供应商工作台')}</small></div></div><div class="top-actions"><span>${esc(account.email||session.user.email||'')}</span><button onclick="signOut()">退出</button></div></div>
 <div class="wrap"><div class="hero"><div><h1>我的产品资料</h1><p>只显示采购方分配给您的产品。保存后进入采购方审核，不会直接修改对方正式产品库。</p></div><div class="summary"><div class="chip"><b>${items.length}</b><span>分配产品</span></div><div class="chip"><b>${submitted}</b><span>待审核</span></div><div class="chip"><b>${approved}</b><span>已通过</span></div></div></div>
 <div class="card"><div class="toolbar"><input placeholder="搜索 SKU / 产品名称" value="${esc(filterText)}" oninput="filterText=this.value;renderPortal()"><div class="hint">箱规单位：cm · 重量单位：KG · CBM 自动计算</div></div>
 ${list.length?`<div class="table-wrap"><table><thead><tr><th>产品</th><th>采购价</th><th>币种</th><th>净重/箱 KG</th><th>毛重/箱 KG</th><th>每箱数量</th><th>箱规 长 × 宽 × 高 cm</th><th>CBM</th><th>MOQ</th><th>交期/天</th><th>备注</th><th>状态</th><th>操作</th></tr></thead><tbody>
 ${list.map(row=>`<tr data-id="${row.id}"><td><div class="prod">${row.image_url?'<img src="'+esc(row.image_url)+'" alt="">':'<div style="width:48px;height:48px;background:#f2f4f7;border-radius:9px"></div>'}<div><b>${esc(row.sku)}</b><small>${esc(row.product_name)}</small></div></div></td>
 <td><input class="field" data-k="purchase_price" type="number" step="0.0001" min="0" value="${num(row.purchase_price)}"></td>
 <td><select class="field" data-k="purchase_currency">${['CNY','USD','EUR','GBP'].map(c=>'<option '+(c===row.purchase_currency?'selected':'')+'>'+c+'</option>').join('')}</select></td>
 <td><input class="field" data-k="net_weight" type="number" step="0.001" min="0" value="${num(row.net_weight)}"></td>
 <td><input class="field" data-k="gross_weight" type="number" step="0.001" min="0" value="${num(row.gross_weight)}"></td>
 <td><input class="field" data-k="pcs_carton" type="number" step="1" min="1" value="${num(row.pcs_carton)||1}"></td>
 <td><div class="dims"><input class="field" data-k="carton_length_cm" type="number" step="0.1" min="0" value="${num(row.carton_length_cm)}" oninput="updateCbm(this)"><span>×</span><input class="field" data-k="carton_width_cm" type="number" step="0.1" min="0" value="${num(row.carton_width_cm)}" oninput="updateCbm(this)"><span>×</span><input class="field" data-k="carton_height_cm" type="number" step="0.1" min="0" value="${num(row.carton_height_cm)}" oninput="updateCbm(this)"></div></td>
 <td class="cbm" data-cbm>${cbmOf(row).toFixed(6)}</td>
 <td><input class="field" data-k="moq" type="number" step="1" min="1" value="${num(row.moq)||1}"></td>
 <td><input class="field" data-k="lead_time_days" type="number" step="1" min="0" value="${num(row.lead_time_days)}"></td>
 <td><input class="field note" data-k="note" value="${esc(row.note||'')}" placeholder="包装/报价说明"></td>
 <td><span class="status ${esc(row.status)}">${statusLabel(row.status)}</span>${row.status==='rejected'&&row.review_note?'<div class="review-note">'+esc(row.review_note)+'</div>':''}</td>
 <td><button class="btn primary" onclick="saveRow('${row.id}',this)">保存提交</button></td></tr>`).join('')}
 </tbody></table></div>`:'<div class="empty">采购方暂时没有分配产品给您。</div>'}</div></div>`;
}
function updateCbm(el){const tr=el.closest('tr');const l=num(tr.querySelector('[data-k="carton_length_cm"]').value),w=num(tr.querySelector('[data-k="carton_width_cm"]').value),h=num(tr.querySelector('[data-k="carton_height_cm"]').value);tr.querySelector('[data-cbm]').textContent=(l*w*h/1000000).toFixed(6)}
async function saveRow(id,btn){const tr=document.querySelector('tr[data-id="'+id+'"]');if(!tr)return;const v=k=>tr.querySelector('[data-k="'+k+'"]').value;btn.disabled=true;btn.textContent='保存中...';try{
 const data=await rpc('supplier_update_trade_product_input',{
  p_input_id:id,p_purchase_price:num(v('purchase_price')),p_purchase_currency:v('purchase_currency'),
  p_net_weight:num(v('net_weight')),p_gross_weight:num(v('gross_weight')),p_pcs_carton:num(v('pcs_carton')),
  p_carton_length_cm:num(v('carton_length_cm')),p_carton_width_cm:num(v('carton_width_cm')),p_carton_height_cm:num(v('carton_height_cm')),
  p_moq:num(v('moq')),p_lead_time_days:Math.round(num(v('lead_time_days'))),p_note:v('note')
 });
 const idx=items.findIndex(x=>x.id===id);if(idx>=0){items[idx].status='submitted';items[idx].carton_cbm=data.carton_cbm;items[idx].supplier_updated_at=data.supplier_updated_at;items[idx].review_note=''}toast('已提交给采购方审核');renderPortal();
 }catch(e){toast(e.message||'保存失败');btn.disabled=false;btn.textContent='保存提交'}}
(async function init(){const q=new URLSearchParams(location.search).get('invite');if(q)localStorage.setItem(INVITE_STORE,q);captureAuthCallback();session=await refresh();if(!session)renderAuth();else await afterAuth()})();
</script>
</body>
</html>
