function createLightSupabase(baseUrl,apiKey){
  const storageKey='tradedesk_supabase_session_v1',listeners=new Set();
  const apiBase=baseUrl.replace(/\/$/,'');
  function getStored(){try{return JSON.parse(localStorage.getItem(storageKey)||'null')}catch(e){return null}}
  function store(s){try{s?localStorage.setItem(storageKey,JSON.stringify(s)):localStorage.removeItem(storageKey)}catch(e){}}
  function jwtExp(token=''){try{const p=token.split('.')[1];if(!p)return 0;const json=JSON.parse(atob(p.replace(/-/g,'+').replace(/_/g,'/')));return Number(json.exp||0)}catch(e){return 0}}
  async function request(url,opts={},timeout=12000){const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),timeout);try{const r=await fetch(url,{...opts,signal:ctrl.signal});const txt=await r.text();let body=null;if(txt){try{body=JSON.parse(txt)}catch(e){body=txt}}if(!r.ok){return {data:null,error:{message:body?.msg||body?.message||body?.error_description||body?.error||`HTTP ${r.status}`,status:r.status,code:body?.code}}}return {data:body,error:null,response:r}}catch(e){return {data:null,error:{message:e?.name==='AbortError'?'请求超时，请检查网络后重试。':(e?.message||'网络请求失败')}}}finally{clearTimeout(timer)}}
  async function refreshIfNeeded(){let s=getStored();if(!s?.access_token)return s;const exp=jwtExp(s.access_token);if(exp&&exp>Date.now()/1000+90)return s;if(!s.refresh_token)return s;const r=await request(`${apiBase}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:{apikey:apiKey,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})});if(r.error){store(null);listeners.forEach(fn=>fn('SIGNED_OUT',null));return null}const ns={...r.data,user:r.data.user||s.user};store(ns);listeners.forEach(fn=>fn('TOKEN_REFRESHED',ns));return ns}
  async function headers(extra={}){const s=await refreshIfNeeded();return {apikey:apiKey,'Content-Type':'application/json',...(s?.access_token?{Authorization:`Bearer ${s.access_token}`}:{ }),...extra}}
  class Query{
    constructor(table){this.table=table;this.action='select';this.cols='*';this.filters=[];this.sort=null;this.max=null;this.payload=null;this.singleMode='';this.upsertOpts=null;this.selectOpts={}}

    then(resolve,reject){return this.exec().then(resolve,reject)}
    async exec(){
      try{
        const u=new URL(`${apiBase}/rest/v1/${this.table}`);
        if(this.cols)u.searchParams.set('select',this.cols);
        for(const [k,v] of this.filters)u.searchParams.append(k,`eq.${v}`);
        if(this.sort)u.searchParams.set('order',`${this.sort[0]}.${this.sort[1]?'asc':'desc'}`);
        if(this.max)u.searchParams.set('limit',String(this.max));

        if(this.action==='update'){method='PATCH';body=JSON.stringify(this.payload);prefer='return=representation'}

function cnMoneyUpper(value){let n=Number(value||0);if(!Number.isFinite(n))return '';n=Math.round(n*100)/100;const CN_NUM=['零','壹','贰','叁','肆','伍','陆','柒','捌','玖'];const CN_INT_RADICE=['','拾','佰','仟'];const CN_INT_UNITS=['','万','亿','兆'];const CN_DEC_UNITS=['角','分'];const integerNum=Math.floor(n);let decimalNum=Math.round((n-integerNum)*100);let chinese='';if(integerNum===0)chinese='零';else{let str=String(integerNum),zeroCount=0,parts=[];while(str.length){parts.unshift(str.slice(-4));str=str.slice(0,-4)}parts.forEach((part,groupIndex)=>{const group=parts.length-1-groupIndex;let partText='',zero=false;const s=part.padStart(4,'0');for(let i=0;i<4;i++){const digit=Number(s[i]);const unitIndex=3-i;if(digit===0){zero=true}else{if(zero&&partText&&!partText.endsWith('零'))partText+='零';partText+=CN_NUM[digit]+CN_INT_RADICE[unitIndex];zero=false}}if(partText)chinese+=partText+CN_INT_UNITS[group]});}

function underThousand(n){n=Math.floor(n);let out=[];if(n>=100){out.push(ONES[Math.floor(n/100)]+' HUNDRED');n%=100}if(n>=20){out.push(TENS[Math.floor(n/10)]);if(n%10)out.push(ONES[n%10])}else if(n>0)out.push(ONES[n]);return out.join(' ')}

function activeDraftPayload(){
  if(state.orderDraft)return {kind:'order',page:'orders',data:state.orderDraft};
  if(state.purchaseDraft)return {kind:'purchase',page:'purchases',data:state.purchaseDraft};
  if(state.draft)return {kind:'document',page:state.page,data:state.draft};
  return null;
}
function persistLocalDraft(){
  const p=activeDraftPayload();if(!p||!state.formDirty)return;
  const payload={version:1,savedAt:new Date().toISOString(),kind:p.kind,page:p.page,data:p.data};
  try{localStorage.setItem('tradedesk_autodraft',JSON.stringify(payload));state.draftSavedAt=payload.savedAt}catch(e){}
}
window.markDirty=()=>{state.formDirty=true;clearTimeout(window._tradeDraftTimer);window._tradeDraftTimer=setTimeout(persistLocalDraft,300)};
window.clearLocalDraft=()=>{clearTimeout(window._tradeDraftTimer);try{localStorage.removeItem('tradedesk_autodraft')}catch(e){}state.draftSavedAt='';state.formDirty=false};
function recoverLocalDraft(){
  let x=null;try{x=JSON.parse(localStorage.getItem('tradedesk_autodraft')||'null')}catch(e){}
  if(!x?.data||!x.savedAt)return false;
  if(Date.now()-new Date(x.savedAt).getTime()>7*86400000){localStorage.removeItem('tradedesk_autodraft');return false}
  const when=String(x.savedAt).replace('T',' ').slice(0,16);
  if(!confirm('发现未保存的本地草稿（'+when+'）。\n是否恢复继续编辑？')){localStorage.removeItem('tradedesk_autodraft');return false}
  state.page=pages[x.page]?x.page:'dashboard';state.formDirty=true;state.draftSavedAt=x.savedAt;
  if(x.kind==='order')state.orderDraft=x.data;
  if(x.kind==='purchase')state.purchaseDraft=x.data;
  if(x.kind==='document')state.draft=x.data;
  setPageUrl(state.page,true);return true
}

function renderAuth(){app.innerHTML=`<div class="auth-shell"><section class="auth-hero"><div><div class="brand-line"><div class="logo">TD</div><b>TradeDesk</b></div><h1>外贸业务，从询价到出货<br>集中在一个工作台。</h1><p>产品库、客户库、报价单、PI、商业发票、装箱单与销售合同统一管理，数据保存在云端并按账号隔离。</p><div class="auth-points"><div class="auth-point">✓ 产品与客户信息只录一次</div><div class="auth-point">✓ 报价确认后可一键转为正式销售订单</div><div class="auth-point">✓ 自动计算金额和装箱重量</div><div class="auth-point">✓ A4 单据打印 / 保存 PDF</div></div></div><small style="color:#9fb8e5">TradeDesk Foreign Trade Management System</small></section><section class="auth-side"><div class="auth-card"><div class="brand-line"><div class="logo">TD</div><div><h2>登录 TradeDesk</h2><div class="sub">Foreign Trade Management System</div></div></div><div class="notice">这是内部业务系统。请使用你的工作邮箱和密码登录；首次使用可注册账号。</div><div class="field"><label>邮箱</label><input id="authEmail" type="email" autocomplete="email" placeholder="name@company.com"></div><div class="field"><label>密码</label><input id="authPassword" type="password" autocomplete="current-password" placeholder="至少 6 位"></div><div class="row"><button class="btn primary block" id="loginBtn">登录</button><button class="btn block" id="signupBtn">注册</button></div><div class="auth-forgot"><button id="forgotBtn" type="button">忘记密码？</button></div><p class="muted" style="font-size:11px;margin-top:12px">如果注册后要求邮箱验证，请先在邮箱完成验证，再回来登录。</p></div></section></div>`;$('#loginBtn').onclick=login;$('#signupBtn').onclick=signup;$('#forgotBtn').onclick=forgotPassword;$('#authPassword').addEventListener('keydown',e=>{if(e.key==='Enter')login()})}
async function forgotPassword(){const email=$('#authEmail')?.value.trim()||'';if(!/^\S+@\S+\.\S+$/.test(email))return toast('请先输入正确邮箱','warn','输入注册 TradeDesk 时使用的邮箱，再点击“忘记密码”。');const b=$('#forgotBtn');busy(b,true,'发送中');const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:'https://beajom.github.io/picture/tradedesk/'});busy(b,false,'忘记密码？');if(error)return toast('发送失败','err',niceError(error));toast('重置邮件已发送','ok','请打开邮箱中的“Reset Password”邮件，点击链接后设置新密码。')}
function renderPasswordRecovery(accessToken){app.innerHTML=`<div class="auth-shell"><section class="auth-hero"><div><div class="brand-line"><div class="logo">TD</div><b>TradeDesk</b></div><h1>重新设置登录密码</h1><p>为了保护你的业务数据，请设置一个新的登录密码。</p></div><small style="color:#9fb8e5">TradeDesk Account Security</small></section><section class="auth-side"><div class="auth-card"><div class="brand-line"><div class="logo">TD</div><div><h2>设置新密码</h2><div class="sub">Password Recovery</div></div></div><div class="notice">新密码至少 8 位。设置成功后，请使用新密码重新登录。</div><div class="field"><label>新密码</label><input id="newPassword" type="password" autocomplete="new-password" placeholder="至少 8 位"></div><div class="field"><label>再次输入</label><input id="confirmPassword" type="password" autocomplete="new-password" placeholder="再次输入新密码"></div><button class="btn primary block" id="resetPasswordBtn">确认重置密码</button></div></section></div>`;$('#resetPasswordBtn').onclick=async()=>{const p=$('#newPassword').value,c=$('#confirmPassword').value;if(p.length<8)return toast('新密码至少 8 位','warn');if(p!==c)return toast('两次输入的密码不一致','warn');const b=$('#resetPasswordBtn');busy(b,true,'重置中');try{const r=await fetch(`${SUPABASE_URL}/auth/v1/user`,{method:'PUT',headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${accessToken}`,'Content-Type':'application/json'},body:JSON.stringify({password:p})});const body=await r.json().catch(()=>({}));busy(b,false,'确认重置密码');if(!r.ok)return toast('密码重置失败','err',niceError(body));history.replaceState(null,'',location.pathname+location.search);renderAuth();toast('密码已重置','ok','现在请使用新密码登录。')}catch(e){busy(b,false,'确认重置密码');toast('密码重置失败','err','网络连接失败，请稍后重试。')}}}
async function login(){const email=$('#authEmail').value.trim(),password=$('#authPassword').value;if(!email||!password)return toast('请输入邮箱和密码','warn');const b=$('#loginBtn');busy(b,true,'登录中');const {error}=await supabase.auth.signInWithPassword({email,password});busy(b,false,'登录');if(error)toast('登录失败','err',niceError(error))}
async function signup(){const email=$('#authEmail').value.trim(),password=$('#authPassword').value;if(!/^\S+@\S+\.\S+$/.test(email))return toast('请输入有效邮箱','warn');if(password.length<6)return toast('密码至少 6 位','warn');const b=$('#signupBtn');busy(b,true,'注册中');const {error}=await supabase.auth.signUp({email,password});busy(b,false,'注册');if(error)toast('注册失败','err',niceError(error));else toast('注册请求已提交','ok','如系统要求邮箱验证，请先完成验证后再登录。')}
function busy(btn,on,label){if(!btn)return;btn.disabled=on;btn.innerHTML=on?`<span class="spinner"></span>${esc(label)}`:esc(label)}
async function loadCloud(){if(!user)return;const uid=state.dataOwnerId||user.id;const [s,p,cus,sp,o,pay,d,pc,media,audit,att,team]=await Promise.all([supabase.from('trade_settings').select('*').eq('user_id',uid).maybeSingle(),supabase.from('trade_products').select('*').eq('user_id',uid).order('created_at',{ascending:false}),supabase.from('trade_customers').select('*').eq('user_id',uid).order('created_at',{ascending:false}),supabase.from('trade_suppliers').select('*').eq('user_id',uid).order('created_at',{ascending:false}),supabase.from('trade_sales_orders').select('*').eq('user_id',uid).order('created_at',{ascending:false}),supabase.from('trade_payment_records').select('*').eq('user_id',uid).order('payment_date',{ascending:false}),supabase.from('trade_documents').select('*').eq('user_id',uid).order('created_at',{ascending:false}),supabase.from('trade_purchase_contracts').select('*').eq('user_id',uid).order('created_at',{ascending:false}),supabase.from('trade_media_assets').select('asset_key,data_url').eq('user_id',uid),supabase.from('trade_audit_logs').select('*').eq('user_id',uid).order('created_at',{ascending:false}).limit(300),supabase.from('trade_attachments').select('*').eq('user_id',uid).order('created_at',{ascending:false}),supabase.from('trade_members').select('*').eq('owner_user_id',uid).order('created_at',{ascending:true})]);const errs=[s.error,p.error,cus.error,sp.error,o.error,pay.error,d.error,pc.error,media.error,audit.error,att.error,team.error].filter(Boolean);state.cloudOk=!errs.length;if(errs.length)toast('云端数据加载异常','err',niceError(errs[0]));const mediaMap={};for(const row of (media.data||[]))mediaMap[row.asset_key]=row.data_url||'';db.company={...seedCompany,...(s.data?.company||{}),...mediaMap};state.mediaDirty={};db.prefs={...seedPrefs,...(s.data?.preferences||{})};const pr=p.data||[],cr=cus.data||[],sr=sp.data||[],or=o.data||[],pyr=pay.data||[],dr=d.data||[],pcr=pc.data||[];db.suppliers=sr.filter(x=>!x.deleted_at).map(supplierFromRow);db.products=pr.filter(x=>!x.deleted_at).map(productFromRow);db.customers=cr.filter(x=>!x.deleted_at).map(customerFromRow);db.salesOrders=or.filter(x=>!x.deleted_at).map(salesOrderFromRow);db.payments=pyr.filter(x=>!x.deleted_at).map(paymentRecordFromRow);db.documents=dr.filter(x=>!x.deleted_at).map(x=>{const dm=parseDocMeta(x.notes||'');return {id:x.id,type:x.type,no:x.doc_no,date:x.doc_date,customerId:x.customer_id,currency:x.currency,incoterm:x.incoterm,destination:x.destination||'',payment:x.payment||'',notes:dm.memo||'',meta:dm,status:x.status,items:Array.isArray(x.items)?x.items:[],salesOrderId:x.sales_order_id||'',createdAt:x.created_at}});db.purchaseContracts=pcr.filter(x=>!x.deleted_at).map(x=>{const pm=parsePurchaseMeta(x.notes||'');return {id:x.id,no:x.contract_no,date:x.contract_date,supplierId:x.supplier_id||'',supplierSnapshot:x.supplier_snapshot||{},currency:x.currency||'CNY',deliveryAddress:x.delivery_address||'',paymentTerms:x.payment_terms||'',deliveryTerms:x.delivery_terms||'',taxRate:Number(x.tax_rate||0),status:x.status||'Draft',notes:pm.memo||'',meta:pm,items:Array.isArray(x.items)?x.items:[],salesOrderId:x.sales_order_id||'',createdAt:x.created_at}});db.attachments=(att.data||[]).filter(x=>!x.deleted_at).map(x=>({id:x.id,entityType:x.entity_type,entityId:x.entity_id,fileName:x.file_name,mimeType:x.mime_type||'',fileSize:Number(x.file_size||0),storagePath:x.storage_path,note:x.note||'',createdAt:x.created_at}));db.teamMembers=team.data||[];db.recycleBin=[];for(const [table,rows] of [['trade_products',pr],['trade_customers',cr],['trade_suppliers',sr],['trade_sales_orders',or],['trade_payment_records',pyr],['trade_documents',dr],['trade_purchase_contracts',pcr]])for(const row of rows.filter(x=>x.deleted_at))db.recycleBin.push({table,id:row.id,name:deletedName(table,row),deletedAt:row.deleted_at,row});db.recycleBin.sort((a,b)=>String(b.deletedAt).localeCompare(String(a.deletedAt)));db.auditLogs=audit.data||[]}

/div><div class="card-pad"><div class="cost-grid">${ORDER_STAGES.map(s=>{const n=db.salesOrders.filter(o=>o.status===s).length;return `<div class="cost-chip metric-link" onclick="window.openOrdersByStatus('${s}')"><span>${esc(orderStatusLabel(s))}</span><b>${n}</b></div>`}).join('')}</div><div class="notice" style="margin-top:12px">累计销售额：<b>${moneyCny(sales)}</b> · 真实利润：<b class="${profit>=0?'profit-pos':'profit-neg'}">${moneyCny(profit)}</b> · 未收：<b class="${receivable>0?'profit-neg':'profit-pos'}">${moneyCny(receivable)}</b> · 逾期：<b class="${overdueAmt>0?'profit-neg':'profit-pos'}">${moneyCny(overdueAmt)}</b></div></div></div><div class="card"><div class="section-head"><div><h3>最近销售订单</h3><p>同时显示收款风险</p></div></div>${recentOrders.length?`<div class="table-wrap"><table class="table"><tr><th>订单号</th><th>客户</th><th>状态</th><th>收款</th><th>金额</th></tr>${recentOrders.map(o=>{const m=orderMetrics(o),risk=paymentRisk(o);return `<tr class="click-row" onclick="window.editSalesOrder('${o.id}')"><td><b>${esc(o.no)}</b></td><td>${esc(cust(o.customerId)?.company||'-')}</td><td><span class="order-status s-${esc(o.status)}">${esc(orderStatusLabel(o.status))}</span></td><td><span class="pay-risk ${risk.key}">${esc(risk.label)}</span></td><td>${money(m.salesNative,o.currency)}</td></tr>`}).join('')}</table></div>`:'<div class="empty">暂无销售订单</div>'}</div></div><div class="grid grid-2" style="margin-top:14px"><div class="card"><div class="section-head"><div><h3>快速操作</h3><p>订单、收款、报价与采购</p></div></div><div class="card-pad actions"><button class="btn primary" onclick="window.newSalesOrder()">新建销售订单</button><button class="btn" onclick="window.gotoPage('payments')">收款中心</button><button class="btn" onclick="window.goNew('quotes')">新建报价单</button><button class="btn" onclick="window.goPurchaseNew()">新建采购合同</button></div></div><div class="card"><div class="section-head"><div><h3>最近外贸单据</h3><p>PI / CI / PL / 报关单 / 销售合同</p></div></div>${recentDocs.length?`<div class="table-wrap"><table class="table"><tr><th>编号</th><th>类型</th><th>客户</th><th>金额</th></tr>${recentDocs.map(d=>`<tr class="click-row" onclick="window.openDashboardDoc('${d.id}')"><td><b>${esc(d.no)}</b></td><td><span class="badge">${docTitles[d.type][1]}</span></td><td>${esc(cust(d.customerId)?.company||'-')}</td><td>${d.type==='packing'?'-':money(amount(d),d.currency)}</td></tr>`).join('')}</table></div>`:'<div class="empty">暂无单据</div>'}</div></div>`}

function paymentCenter(){
  const q=state.paymentSearch.toLowerCase(),all=db.salesOrders.filter(o=>o.status!=='cancelled');
  let allRows=all.map(o=>({o,m:orderMetrics(o),risk:paymentRisk(o)})).filter(x=>{
    const co=cust(x.o.customerId)?.company||'';
    const okSearch=!q||[x.o.no,co,x.o.destination].join(' ').toLowerCase().includes(q);
    const okCustomer=!state.paymentCustomer||x.o.customerId===state.paymentCustomer;
    const okStatus=!state.paymentStatus||x.risk.key===state.paymentStatus;
    return okSearch&&okCustomer&&okStatus;
  });
  const rows=pagedRows(allRows,'payments');
  const totalReceivable=allRows.reduce((s,x)=>s+(toCny(x.m.receivable,x.o.currency)||0),0);
  const overdue=allRows.filter(x=>x.risk.key==='overdue'),dueSoon=rows.filter(x=>x.risk.key==='due');
  const overdueAmt=overdue.reduce((s,x)=>s+(toCny(x.m.receivable,x.o.currency)||0),0);
  const dueAmt=dueSoon.reduce((s,x)=>s+(toCny(x.m.receivable,x.o.currency)||0),0);
  const month=today().slice(0,7),monthCollected=db.payments.filter(p=>String(p.date||'').startsWith(month)).reduce((s,p)=>s+(toCny(p.amount,p.currency)||0),0);
  const paid=allRows.filter(x=>x.risk.key==='paid').length,pendingDeposit=allRows.filter(x=>x.risk.key==='unpaid').length;
  const recent=[...db.payments].sort((a,b)=>String(b.date).localeCompare(String(a.date))||String(b.createdAt||'').localeCompare(String(a.createdAt||''))).slice(0,12);
  return `<div class="payment-kpis"><div class="payment-kpi"><span>未收款 RMB</span><b class="${totalReceivable>0?'profit-neg':'profit-pos'}">${moneyCny(totalReceivable)}</b><small>当前筛选范围</small></div><div class="payment-kpi"><span>逾期应收</span><b class="${overdueAmt>0?'profit-neg':''}">${moneyCny(overdueAmt)}</b><small>${overdue.length} 笔订单</small></div><div class="payment-kpi"><span>7天内到期</span><b>${moneyCny(dueAmt)}</b><small>${dueSoon.length} 笔订单</small></div><div class="payment-kpi"><span>本月已收款</span><b class="profit-pos">${moneyCny(monthCollected)}</b><small>${month}</small></div><div class="payment-kpi"><span>已收全款订单</span><b>${paid}</b><small>当前筛选范围</small></div><div class="payment-kpi"><span>待收定金</span><b>${pendingDeposit}</b><small>需要优先跟进</small></div></div>
  <div class="card"><div class="section-head"><div><h3>应收账款 / Receivables</h3><p>按真实收款流水自动计算定金、尾款、逾期和未收余额。</p></div></div><div class="toolbar order-filters"><input class="search" placeholder="搜索订单号 / 客户 / 目的地" value="${esc(state.paymentSearch)}" oninput="window.filterPayments('search',this.value)"><select onchange="window.filterPayments('status',this.value)"><option value="">全部收款状态</option><option value="overdue" ${state.paymentStatus==='overdue'?'selected':''}>逾期</option><option value="due" ${state.paymentStatus==='due'?'selected':''}>7天内到期</option><option value="unpaid" ${state.paymentStatus==='unpaid'?'selected':''}>待收定金</option><option value="normal" ${state.paymentStatus==='normal'?'selected':''}>待收尾款</option><option value="paid" ${state.paymentStatus==='paid'?'selected':''}>已收全款</option></select><select onchange="window.filterPayments('customer',this.value)"><option value="">全部客户</option>${db.customers.map(x=>`<option value="${x.id}" ${state.paymentCustomer===x.id?'selected':''}>${esc(x.company)}</option>`).join('')}</select><button class="btn small" onclick="window.clearPaymentFilters()">清除筛选</button></div>
  ${rows.length?`<div class="table-wrap"><table class="table"><tr><th>订单号</th><th>客户</th><th>订单金额</th><th>已收</th><th>未收</th><th>尾款到期</th><th>风险</th><th>最近收款</th><th>操作</th></tr>${rows.map(({o,m,risk})=>{const last=paymentsForOrder(o.id)[0];return `<tr><td><button class="customer-link" onclick="window.editSalesOrder('${o.id}')">${esc(o.no)}</button></td><td>${esc(cust(o.customerId)?.company||'-')}</td><td>${money(m.salesNative,o.currency)}</td><td class="profit-pos"><b>${money(m.totalPaid,o.currency)}</b></td><td class="${m.receivable>0?'profit-neg':'profit-pos'}"><b>${money(m.receivable,o.currency)}</b></td><td>${esc(o.balanceDueDate||'-')}</td><td><span class="pay-risk ${risk.key}">${esc(risk.label)}</span></td><td>${last?`${esc(last.date)}<br><span class="muted">${money(last.amount,last.currency)}</span>`:'-'}</td><td><button class="btn small primary" onclick="window.paymentModal('${o.id}')">记录收款</button> <button class="btn small" onclick="window.editSalesOrder('${o.id}')">订单</button></td></tr>`}).join('')}</table></div>`:'<div class="empty">暂无符合条件的应收订单</div>'}${paginationBar(allRows.length,'payments')}</div>
  <div class="card" style="margin-top:12px"><div class="section-head"><div><h3>最近收款流水</h3><p>每一笔定金和尾款都会保留日期、银行流水号和备注。</p></div></div>${recent.length?`<div class="table-wrap"><table class="table"><tr><th>日期</th><th>订单</th><th>客户</th><th>类型</th><th>金额</th><th>银行流水号</th><th>备注</th><th></th></tr>${recent.map(p=>{const o=db.salesOrders.find(x=>x.id===p.orderId);return `<tr><td>${esc(p.date)}</td><td>${o?`<button class="customer-link" onclick="window.editSalesOrder('${o.id}')">${esc(o.no)}</button>`:'-'}</td><td>${esc(cust(o?.customerId)?.company||'-')}</td><td>${p.type==='deposit'?'定金':p.type==='balance'?'尾款':'其他'}</td><td class="profit-pos"><b>${money(p.amount,p.currency)}</b></td><td>${esc(p.bankRef||'-')}</td><td>${esc(p.note||'-')}</td><td><button class="btn small danger" onclick="window.delPayment('${p.id}')">删除</button></td></tr>`}).join('')}</table></div>`:'<div class="empty">暂无收款流水</div>'}</div>`;
}

function salesOrders(){if(state.orderDraft)return orderEditor(state.orderDraft);const q=state.orderSearch.toLowerCase(),base=db.salesOrders.filter(o=>{const co=cust(o.customerId)?.company||'',okSearch=!q||[o.no,co,o.destination,o.trackingNo,o.blNo].join(' ').toLowerCase().includes(q),okStatus=!state.orderStatus||o.status===state.orderStatus,okCustomer=!state.orderCustomer||o.customerId===state.orderCustomer,okFrom=!state.orderDateFrom||o.date>=state.orderDateFrom,okTo=!state.orderDateTo||o.date<=state.orderDateTo;return okSearch&&okStatus&&okCustomer&&okFrom&&okTo}),sort=state.sorting.orders,all=sort?sortRowsBy(base,'orders',sort.field):base,list=pagedRows(all,'orders');const totalSales=all.reduce((s,o)=>s+(orderMetrics(o).salesCny||0),0),totalProfit=all.reduce((s,o)=>s+(orderMetrics(o).profit||0),0),receivable=all.reduce((s,o)=>s+(toCny(orderMetrics(o).receivable,o.currency)||0),0),active=all.filter(o=>!['completed','cancelled'].includes(o.status)).length;return `<div class="order-kpis"><div class="order-kpi"><span>订单数</span><b>${all.length}</b><small>筛选范围</small></div><div class="order-kpi"><span>进行中</span><b>${active}</b><small>未完成 / 未取消</small></div><div class="order-kpi"><span>销售额 RMB</span><b>${moneyCny(totalSales)}</b><small>按订单锁定汇率</small></div><div class="order-kpi"><span>真实利润 RMB</span><b class="${totalProfit>=0?'profit-pos':'profit-neg'}">${moneyCny(totalProfit)}</b><small>已扣采购及录入费用</small></div><div class="order-kpi"><span>未收款 RMB</span><b class="${receivable>0?'profit-neg':'profit-pos'}">${moneyCny(receivable)}</b><small>应收余额</small></div><div class="order-kpi"><span>待出货</span><b>${all.filter(o=>['ready_ship','pending_balance'].includes(o.status)).length}</b><small>需重点跟进</small></div></div><div class="card"><div class="section-head"><div><h3>销售订单 Sales Order</h3><p>一笔真实业务一张订单，所有外贸单据、收款、采购和出货统一挂在订单下面。</p></div><button class="btn primary" onclick="window.newSalesOrder()">＋ 新建订单</button></div><div class="toolbar order-filters"><input class="search" placeho function normalizedOrderItems(d){return (d.items||[]).map(it=>({p:String(it.productId||'').trim(),d:String(it.description||'').trim().toLowerCase(),q:Number(it.qty||0),u:String(it.unit||'').trim().toUpperCase(),v:Number(it.price||0)})).sort((a,b)=>(a.p||a.d).localeCompare(b.p||b.d)||a.q-b.q||a.v-b.v)}

function orderGroupKey(d){const source=d.meta?.sourceOrderKey||d.meta?.sourceDocId||d.meta?.sourceQuoteNo;if(source)return `src|${source}`;return `legacy|${legacyOrderFingerprint(d)}`}
function orderTypePriority(t){return ({contract:4,invoice:3,pi:2,quote:1})[t]||0}

function customerOrderGroups(customerId,includeQuoteOnly=false){
  const docs=db.documents.filter(d=>d.customerId===customerId&&['quote','pi','invoice','contract'].includes(d.type));
  const groups=new Map();
  for(const d of docs){const k=orderGroupKey(d),g=groups.get(k)||{key:k,docs:[]};g.docs.push(d);groups.set(k,g)}
  const orders=[];
  for(const g of groups.values()){
    const hasOrderDoc=g.docs.some(d=>['contract','invoice','pi'].includes(d.type));
    if(!hasOrderDoc&&!includeQuoteOnly)continue;
    const rep=[...g.docs].sort((a,b)=>orderTypePriority(b.type)-orderTypePriority(a.type)||String(b.createdAt||'').localeCompare(String(a.createdAt||'')))[0];
    if(rep)orders.push({...rep,_groupDocs:g.docs,_isQuoteOnly:!hasOrderDoc});
  }
  return orders.sort((a,b)=>String(b.date).localeCompare(String(a.date))||String(b.no).localeCompare(String(a.no)))
}
function legacyDocMetrics(d){
  let qty=0,salesNative=0,costCny=0,costKnown=true,estimatedCost=false;
  for(const it of (d.items||[])){
    const q=Number(it.qty||0),price=Number(it.price||0);qty+=q;salesNative+=q*price;
    let cp=it.purchasePriceSnapshot,cc=it.purchaseCurrencySnapshot;
    if(cp==null||cc==null){const p=db.products.find(x=>x.id===it.productId);if(p){cp=p.purchasePrice;cc=p.purchaseCurrency;estimatedCost=true}else{costKnown=false;continue}}
    const cny=toCny(Number(cp||0),cc||'CNY');if(cny==null){costKnown=false;continue}costCny+=q*cny;
  }
  const salesCny=toCny(salesNative,d.currency);
  const profit=(salesCny!=null&&costKnown)?salesCny-costCny:null;
  const margin=(profit!=null&&salesCny>0)?profit/salesCny*100:null;
  return {qty,salesNative,salesCny,costCny:costKnown?costCny:null,profit,margin,estimatedCost};
}
function customerAnalytics(customerId){
  const realOrders=db.salesOrders.filter(o=>o.customerId===customerId&&!['draft','cancelled'].includes(o.status));
  const quotes=db.documents.filter(d=>d.customerId===customerId&&d.type==='quote'&&!d.salesOrderId);
  let rows=[],orders=[];
  if(realOrders.length){
    orders=realOrders;
    rows=orders.map(o=>{const om=orderMetrics(o),qty=(o.items||[]).reduce((s,it)=>s+Number(it.qty||0),0),estimatedCost=(o.items||[]).some(it=>it.purchasePriceSnapshot==null||!it.purchaseCurrencySnapshot);return {doc:{...o,type:'order'},m:{qty,salesNative:om.salesNative,salesCny:om.salesCny,costCny:om.productCost,profit:om.profit,margin:om.margin,estimatedCost}}});
  }else{
    orders=customerOrderGroups(customerId,false);
    rows=orders.map(d=>({doc:d,m:legacyDocMetrics(d)}));
  }
  const totalQty=rows.reduce((s,x)=>s+x.m.qty,0),sales=rows.reduce((s,x)=>s+(x.m.salesCny||0),0),profit=rows.reduce((s,x)=>s+(x.m.profit||0),0),collected=realOrders.length?realOrders.reduce((s,o)=>s+(toCny(orderMetrics(o).totalPaid,o.currency)||0),0):0,receivable=realOrders.length?realOrders.reduce((s,o)=>s+(toCny(orderMetrics(o).receivable,o.currency)||0),0):0;
  const knownProfit=rows.some(x=>x.m.profit!=null),avg=orders.length?sales/orders.length:0;
  const monthly=new Map(),yearly=new Map();
  for(const x of rows){
    const month=String(x.doc.date||'').slice(0,7)||'未知',year=String(x.doc.date||'').slice(0,4)||'未知';
    for(const [map,key] of [[monthly,month],[yearly,year]]){
      const v=map.get(key)||{key,orders:0,qty:0,sales:0,profit:0};
      v.orders++;v.qty+=x.m.qty;v.sales+=x.m.salesCny||0;v.profit+=x.m.profit||0;map.set(key,v)
    }
  }
  return {orders,rows,quotes,totalQty,sales,collected,receivable,profit:knownProfit?profit:null,avg,monthly:[...monthly.values()].sort((a,b)=>a.key.localeCompare(b.key)),yearly:[...yearly.values()].sort((a,b)=>a.key.localeCompare(b.key))}
}

async function invokeTradeEdge(name,payload){
  const {data}=await supabase.auth.getSession(),token=data.session?.access_token;
  if(!token)return {data:null,error:{message:'登录状态已失效，请重新登录。'}};
  try{
    const r=await fetch(SUPABASE_URL+'/functions/v1/'+name,{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const txt=await r.text();let body=null;try{body=JSON.parse(txt)}catch(e){body={message:txt||('HTTP '+r.status)}}
    if(!r.ok)return {data:null,error:{message:body?.message||body?.error||('HTTP '+r.status)}};
    return {data:body,error:null}
  }catch(e){return {data:null,error:{message:e?.message||'网络请求失败'}}}
}

window.paymentModal=orderId=>{const o=db.salesOrders.find(x=>x.id===orderId);if(!o)return;const m=orderMetrics(o);if(m.receivable<=.009)return toast('该订单已收全款','ok',o.no);const type=m.depositPaid<m.depositDue-.009?'deposit':'balance',suggest=type==='deposit'?Math.max(0,Math.min(m.depositDue-m.depositPaid,m.receivable)):m.receivable;showModal('记录客户收款',`<div class="notice">订单：<b>${esc(o.no)}</b> · 客户：<b>${esc(cust(o.customerId)?.company||'-')}</b><br>订单金额：${money(m.salesNative,o.currency)} · 当前未收：<b>${money(m.receivable,o.currency)}</b></div><div class="form-grid"><div class="field"><label>收款类型</label><select id="payType"><option value="deposit" ${type==='deposit'?'selected':''}>定金</option><option value="balance" ${type==='balance'?'selected':''}>尾款</option><option value="other">其他收款</option></select></div>${modalField('收款日期','payDate',today(),'date')}${modalField('收款金额','payAmount',Number(suggest||0).toFixed(2),'number','不能超过当前未收金额')}<div class="field"><label>币种</label><input id="payCurrency" value="${esc(o.currency)}" readonly></div>${modalField('银行流水号 / Reference','payBankRef','') }<div class="field full"><label>备注</label><textarea id="payNote" placeholder="例如：T/T deposit received、尾款到账等"></textarea></div></div>`,`window.savePayment('${orderId}')`,'确认收款')};

window.startOrderColumnResize=(e,key)=>{e.preventDefault();e.stopPropagation();const table=document.getElementById('orderItemsTable');if(!table)return;const heads=[...table.querySelectorAll('th[data-order-head]')],idx=heads.findIndex(h=>h.dataset.orderHead===key);if(idx<0||idx>=heads.length-1)return;const cols=[...table.querySelectorAll('col[data-order-col]')],widths=heads.map(h=>h.getBoundingClientRect().width),mins=ORDER_ITEM_COLS.map(x=>x[2]),total=widths.reduce((s,x)=>s+x,0),startX=e.clientX,startA=widths[idx],startB=widths[idx+1],handle=e.currentTarget;handle.classList.add('dragging');try{handle.setPointerCapture(e.pointerId)}catch(_){}const move=ev=>{let diff=ev.clientX-startX,a=startA+diff,b=startB-diff;if(a<mins[idx]){b-=mins[idx]-a;a=mins[idx]}if(b<mins[idx+1]){a-=mins[idx+1]-b;b=mins[idx+1]}if(a<mins[idx]||b<mins[idx+1])return;widths[idx]=a;widths[idx+1]=b;cols.forEach((col,i)=>col.style.width=(widths[i]/total*100).toFixed(3)+'%')};const up=()=>{handle.classList.remove('dragging');document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);const final=heads.map(h=>h.getBoundingClientRect().width),sum=final.reduce((s,x)=>s+x,0),pct=final.map(x=>x/sum*100);try{localStorage.setItem('tradedesk_order_item_col_widths',JSON.stringify(pct))}catch(e){}};document.addEventListener('pointermove',move);document.addEventListener('pointerup',up,{once:true})};

function tableRowsForKey(key){
  if(key==='products')return db.products;
  if(key==='customers')return db.customers;
  if(key==='suppliers')return db.suppliers;
  if(key==='orders')return db.salesOrders;
  if(key==='purchases')return db.purchaseContracts;
  if(key==='payments')return db.payments;
  if(String(key).startsWith('docs_')){const t=String(key).slice(5);return db.documents.filter(x=>x.type===t)}
  return [];
}
function tableRecycleInfo(key,id){
  if(key==='products')return {table:'trade_products',item:db.products.find(x=>x.id===id),name:x=>x?.sku||id};
  if(key==='customers')return {table:'trade_customers',item:db.customers.find(x=>x.id===id),name:x=>x?.company||id};
  if(key==='suppliers')return {table:'trade_suppliers',item:db.suppliers.find(x=>x.id===id),name:x=>x?.company||id};
  if(key==='orders')return {table:'trade_sales_orders',item:db.salesOrders.find(x=>x.id===id),name:x=>x?.no||id};
  if(key==='purchases')return {table:'trade_purchase_contracts',item:db.purchaseContracts.find(x=>x.id===id),name:x=>x?.no||id};
  if(key==='payments')return {table:'trade_payment_records',item:db.payments.find(x=>x.id===id),name:x=>x?`${x.date} · ${money(x.amount,x.currency)}`:id};
  if(String(key).startsWith('docs_'))return {table:'trade_documents',item:db.documents.find(x=>x.id===id),name:x=>x?.no||id};
  return null;
}

async function moveToRecycle(table,id,name){const u=await fastUser();if(!u)return {error:{message:'登录失效'}};return supabase.from(table).update({deleted_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',id).eq('user_id',state.dataOwnerId||u.id).select('*').single()}
window.restoreRecycle=async(table,id)=>{const item=db.recycleBin.find(x=>x.table===table&&x.id===id);if(!item)return;if(!confirm(`确认恢复 ${recycleLabel(table)}：${item.name}？`))return;const u=await fastUser();if(!u)return;const {error}=await supabase.from(table).update({deleted_at:null,updated_at:new Date().toISOString()}).eq('id',id).eq('user_id',state.dataOwnerId||u.id);if(error)return toast('恢复失败','err',niceError(error));await loadCloud();if(table==='trade_payment_records'&&item.row?.sales_order_id){await window.syncOrderPaymentAggregates(item.row.sales_order_id);await loadCloud()}render();toast('已从回收站恢复','ok',item.name)};
window.permanentDelete=async(table,id)=>{const item=db.recycleBin.find(x=>x.table===table&&x.id===id),name=item?.name||id;if(!confirm(`永久删除后无法恢复。\n确认彻底删除：${name}？`))return;const u=await fastUser();if(!u)return;const {error}=await supabase.from(table).delete().eq('id',id).eq('user_id',state.dataOwnerId||u.id);if(error)return toast('永久删除失败','err',niceError(error));await loadCloud();render();toast('已永久删除','ok',name)};

// V11 soft-delete overrides
window.delProduct=async id=>{const p=db.products.find(x=>x.id===id);if(!p||!confirm(`将产品 ${p.sku} 移入回收站？\n之后可以恢复。`))return;const idx=db.products.findIndex(x=>x.id===id);db.products.splice(idx,1);render();const {error}=await moveToRecycle('trade_products',id,p.sku);if(error){db.products.splice(Math.max(0,idx),0,p);render();return toast('删除失败，已恢复记录','err',niceError(error))}await loadCloud();render();toast('产品已移入回收站','ok',p.sku)};
window.delCustomer=async id=>{const x=db.customers.find(v=>v.id===id);if(!x||!confirm(`将客户 ${x.company} 移入回收站？\n历史订单和单据不会丢失。`))return;const idx=db.customers.findIndex(v=>v.id===id);db.customers.splice(idx,1);render();const {error}=await moveToRecycle('trade_customers',id,x.company);if(error){db.customers.splice(Math.max(0,idx),0,x);render();return toast('删除失败，已恢复记录','err',niceError(error))}await loadCloud();render();toast('客户已移入回收站','ok',x.company)};
window.delSupplier=async id=>{const x=db.suppliers.find(v=>v.id===id);if(!x||!confirm(`将供应商 ${x.company} 移入回收站？\n产品的供应商关联会保留，恢复后自动重新显示。`))return;const idx=db.suppliers.findIndex(v=>v.id===id);db.suppliers.splice(idx,1);render();const {error}=await moveToRecycle('trade_suppliers',id,x.company);if(error){db.suppliers.splice(Math.max(0,idx),0,x);render();return toast('删除失败，已恢复记录','err',niceError(error))}await loadCloud();render();toast('供应商已移入回收站','ok',x.company)};
window.delSalesOrder=async id=>{const x=db.salesOrders.find(v=>v.id===id);if(!x||!confirm(`将订单 ${x.no} 移入回收站？\n收款、关联单据和采购合同不会被物理删除。`))return;const idx=db.salesOrders.findIndex(v=>v.id===id);db.salesOrders.splice(idx,1);if(state.orderDraft?.id===id)state.orderDraft=null;render();const {error}=await moveToRecycle('trade_sales_orders',id,x.no);if(error){db.salesOrders.splice(Math.max(0,idx),0,x);render();return toast('删除失败，已恢复订单','err',niceError(error))}await loadCloud();render();toast('订单已移入回收站','ok',x.no)};
window.delPurchase=async id=>{const x=db.purchaseContracts.find(v=>v.id===id);if(!x||!confirm(`将采购合同 ${x.no} 移入回收站？`))return;const idx=db.purchaseContracts.findIndex(v=>v.id===id);db.purchaseContracts.splice(idx,1);if(state.purchaseDraft?.id===id)state.purchaseDraft=null;render();const {error}=await moveToRecycle('trade_purchase_contracts',id,x.no);if(error){db.purchaseContracts.splice(Math.max(0,idx),0,x);render();return toast('删除失败，已恢复采购合同','err',niceError(error))}await loadCloud();render();toast('采购合同已移入回收站','ok',x.no)};
window.delDoc=async id=>{const x=db.documents.find(v=>v.id===id);if(!x||!confirm(`将单据 ${x.no} 移入回收站？`))return;const idx=db.documents.findIndex(v=>v.id===id);db.documents.splice(idx,1);if(state.draft?.id===id)state.draft=null;render();const {error}=await moveToRecycle('trade_documents',id,x.no);if(error){db.documents.splice(Math.max(0,idx),0,x);render();return toast('删除失败，已恢复单据','err',niceError(error))}await loadCloud();render();toast('单据已移入回收站','ok',x.no)};
window.delPayment=async id=>{const x=db.payments.find(v=>v.id===id);if(!x||!confirm(`将这笔收款记录移入回收站？\n${x.date} · ${money(x.amount,x.currency)}`))return;const idx=db.payments.findIndex(v=>v.id===id),orderId=x.orderId;db.payments.splice(idx,1);render();const {error}=await moveToRecycle('trade_payment_records',id,money(x.amount,x.currency));if(error){db.payments.splice(Math.max(0,idx),0,x);render();return toast('删除失败，已恢复收款记录','err',niceError(error))}await window.syncOrderPaymentAggregates(orderId);await loadCloud();render();toast('收款记录已移入回收站','ok')};

// V11 list reset behavior
window.searchProducts=v=>{state.productSearch=v;state.pagination.products=1;render()};
window.searchCustomers=v=>{state.customerSearch=v;state.pagination.customers=1;render()};
window.searchSuppliers=v=>{state.supplierSearch=v;state.pagination.suppliers=1;render()};
window.filterOrders=(k,v)=>{if(k==='search')state.orderSearch=v;if(k==='status')state.orderStatus=v;if(k==='customer')state.orderCustomer=v;if(k==='from')state.orderDateFrom=v;if(k==='to')state.orderDateTo=v;state.pagination.orders=1;render()};
window.filterPayments=(k,v)=>{if(k==='search')state.paymentSearch=v;if(k==='status')state.paymentStatus=v;if(k==='customer')state.paymentCustomer=v;state.pagination.payments=1;render()};
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();const el=document.getElementById('globalSearchInput');if(el){el.focus();el.select()}}});

window.downloadFullBackup=()=>{const payload={version:'TradeDesk V12',exportedAt:new Date().toISOString(),company:db.company,preferences:db.prefs,products:db.products,customers:db.customers,suppliers:db.suppliers,salesOrders:db.salesOrders,payments:db.payments,purchaseContracts:db.purchaseContracts,documents:db.documents,attachments:db.attachments,teamMembers:state.userRole==='owner'?db.teamMembers:[]};downloadBlob(`tradedesk-backup-${today()}.json`,JSON.stringify(payload,null,2),'application/json;charset=utf-8');toast('完整业务备份已导出','ok')};
window.downloadCsvBackup=kind=>{const map={products:db.products,customers:db.customers,suppliers:db.suppliers,orders:db.salesOrders,payments:db.payments};const rows=map[kind]||[];downloadBlob(`tradedesk-${kind}-${today()}.csv`,'\ufeff'+csvText(rows),'text/csv;charset=utf-8')};
window.inviteMemberModal=()=>{if(state.userRole!=='owner')return toast('只有账户所有者可以邀请员工','warn');showModal('邀请员工',`<div class="form-grid"><div class="field full"><label>员工邮箱 *</label><input id="memberEmail" type="email" placeholder="name@company.com"></div><div class="field full"><label>角色</label><select id="memberRole"><option value="sales">销售</option><option value="purchasing">采购</option><option value="finance">财务</option><option value="readonly">只读</option><option value="admin">管理员</option></select></div></div><div class="permission-note" style="margin-top:10px">系统会发送 Supabase 邀请邮件。员工接受邀请后使用同一个 TradeDesk 网址登录，看到的是你公司的共享数据，但写入权限按角色限制。</div>`,'window.sendMemberInvite()','发送邀请')};
window.sendMemberInvite=async()=>{const email=$('#memberEmail')?.value.trim()||'',role=$('#memberRole')?.value||'readonly';if(!/^\S+@\S+\.\S+$/.test(email))return toast('请输入有效邮箱','warn');const btn=$('#modalSaveBtn');busy(btn,true,'发送中');const res=await invokeTradeEdge('tradedesk-invite-member',{email,role,redirectTo:'https://beajom.github.io/picture/tradedesk/'});busy(btn,false,'发送邀请');if(res.error)return toast('邀请失败','err',niceError(res.error));state.modal='';await loadCloud();render();toast('员工邀请已发送','ok',email)};
window.editMemberRole=(id,current)=>{if(state.userRole!=='owner')return;showModal('修改员工角色',`<div class="field"><label>角色</label><select id="editMemberRole">${[['sales','销售'],['purchasing','采购'],['finance','财务'],['readonly','只读'],['admin','管理员']].map(x=>`<option value="${x[0]}" ${x[0]===current?'selected':''}>${x[1]}</option>`).join('')}</select></div>`,`window.saveMemberRole('${id}')`,'保存角色')};
window.saveMemberRole=async id=>{const role=$('#editMemberRole')?.value||'readonly',u=await fastUser();if(!u)return;const {error}=await supabase.from('trade_members').update({role,updated_at:new Date().toISOString()}).eq('id',id).eq('owner_user_id',u.id);if(error)return toast('角色修改失败','err',niceError(error));state.modal='';await loadCloud();render();toast('员工角色已更新','ok')};
window.toggleMemberStatus=async(id,status)=>{if(state.userRole!=='owner')return;const next=status==='disabled'?'active':'disabled';if(!confirm(next==='disabled'?'停用后该员工将无法访问公司数据，确认停用？':'确认重新启用该员工？'))return;const u=await fastUser();if(!u)return;const {error}=await supabase.from('trade_members').update({status:next,updated_at:new Date().toISOString()}).eq('id',id).eq('owner_user_id',u.id);if(error)return toast('状态修改失败','err',niceError(error));await loadCloud();render();toast(next==='active'?'员工已启用':'员工已停用','ok')};

window.attachmentCenter=(entityType,entityId,title)=>{if(!entityId)return toast('请先保存当前记录','warn','保存后才能上传附件。');const rows=db.attachments.filter(x=>x.entityType===entityType&&x.entityId===entityId);showModal('附件中心 · '+title,`<div class="attachment-drop"><b>上传业务附件</b><div class="muted" style="font-size:10px;margin:5px 0 9px">支持 PDF、Excel、Word、图片等，单文件最大 20MB</div><input id="attachmentFile" type="file"></div><div class="attachment-list">${rows.length?rows.map(x=>`<div class="attachment-item"><div><b>${esc(x.fileName)}</b><span>${attachmentFileSize(x.fileSize)} · ${esc(String(x.createdAt||'').replace('T',' ').slice(0,16))}</span></div><div class="row"><button class="btn small" onclick="window.downloadAttachment('${x.id}')">下载</button><button class="btn small danger" onclick="window.removeAttachment('${x.id}')">删除</button></div></div>`).join(''):'<div class="empty">暂无附件</div>'}</div>`,`window.uploadAttachment('${entityType}','${entityId}','${encodeURIComponent(title)}')`,'上传文件')};
window.uploadAttachment=async(entityType,entityId,encTitle)=>{if(!can('attachments'))return toast('当前账号没有上传附件权限','warn');const file=$('#attachmentFile')?.files?.[0];if(!file)return toast('请选择文件','warn');if(file.size>20*1024*1024)return toast('单个附件不能超过 20MB','warn');const {data}=await supabase.auth.getSession(),token=data.session?.access_token;if(!token)return toast('登录状态失效','err');const owner=state.dataOwnerId||user.id,safe=(file.name||'file').replace(/[^A-Za-z0-9._\-\u4e00-\u9fa5]/g,'_'),path=`${owner}/${entityType}/${entityId}/${Date.now()}-${safe}`,encoded=path.split('/').map(encodeURIComponent).join('/'),btn=$('#modalSaveBtn');busy(btn,true,'上传中');try{const up=await fetch(`${SUPABASE_URL}/storage/v1/object/tradedesk-attachments/${encoded}`,{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+token,'Content-Type':file.type||'application/octet-stream','x-upsert':'false'},body:file});if(!up.ok){const t=await up.text();throw new Error(t||'附件上传失败')}const meta=await supabase.from('trade_attachments').insert({user_id:owner,entity_type:entityType,entity_id:entityId,file_name:file.name,mime_type:file.type||'',file_size:file.size,storage_path:path,note:''}).select('*').single();if(meta.error)throw meta.error;db.attachments.unshift({id:meta.data.id,entityType:meta.data.entity_type,entityId:meta.data.entity_id,fileName:meta.data.file_name,mimeType:meta.data.mime_type,fileSize:Number(meta.data.file_size||0),storagePath:meta.data.storage_path,note:meta.data.note||'',createdAt:meta.data.created_at});state.modal='';render();toast('附件已上传','ok',file.name);setTimeout(()=>window.attachmentCenter(entityType,entityId,decodeURIComponent(encTitle||'')),0)}catch(e){busy(btn,false,'上传文件');toast('附件上传失败','err',niceError(e))}};
window.downloadAttachment=async id=>{const x=db.attachments.find(a=>a.id===id);if(!x)return;const {data}=await supabase.auth.getSession(),token=data.session?.access_token;if(!token)return;const encoded=x.storagePath.split('/').map(encodeURIComponent).join('/');try{const r=await fetch(`${SUPABASE_URL}/storage/v1/object/authenticated/tradedesk-attachments/${encoded}`,{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+token}});if(!r.ok)throw new Error(await r.text());const blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=x.fileName;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}catch(e){toast('附件下载失败','err',niceError(e))}};
window.removeAttachment=async id=>{const x=db.attachments.find(a=>a.id===id);if(!x||!confirm(`确认删除附件：${x.fileName}？`))return;const u=await fastUser();if(!u)return;const {error}=await supabase.from('trade_attachments').update({deleted_at:new Date().toISOString()}).eq('id',id).eq('user_id',state.dataOwnerId||u.id);if(error)return toast('附件删除失败','err',niceError(error));db.attachments=db.attachments.filter(a=>a.id!==id);state.modal='';render();toast('附件已删除','ok',x.fileName)};
window.addEventListener('beforeunload',e=>{if(!state.formDirty)return;e.preventDefault();e.returnValue=''});
window.addEventListener('popstate',()=>{if(!user)return;const p=pageFromUrl();if(state.page!==p){state.page=p;state.draft=null;state.purchaseDraft=null;state.orderDraft=null;state.customerDetailId='';state.previewEditing=false;state.modal='';render()}});
Promise.race([init(),new Promise((_,reject)=>setTimeout(()=>reject(new Error('启动超时')),15000))]).catch(err=>{app.innerHTML=`<div style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f7fb"><div style="max-width:520px;background:#fff;border:1px solid #e5eaf1;border-radius:16px;padding:26px;box-shadow:0 14px 40px rgba(16,24,40,.08)"><h2 style="margin-top:0">TradeDesk 暂时无法连接云端</h2><p style="color:#667085;line-height:1.7">页面本身已经加载完成，但云数据库连接超时。请刷新页面，或直接使用正式线上地址。</p><div style="font-size:12px;color:#98a2b3">${esc(err?.message||String(err))}</div></div></div>`});
</script>
</body>
