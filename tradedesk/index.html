  function store(s){try{s?localStorage.setItem(storageKey,JSON.stringify(s)):localStorage.removeItem(storageKey)}catch(e){}}
  function jwtExp(token=''){try{const p=token.split('.')[1];if(!p)return 0;const json=JSON.parse(atob(p.replace(/-/g,'+').replace(/_/g,'/')));return Number(json.exp||0)}catch(e){return 0}}
  async function request(url,opts={},timeout=12000){const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),timeout);try{const r=await fetch(url,{...opts,signal:ctrl.signal});const txt=await r.text();let body=null;if(txt){try{body=JSON.parse(txt)}catch(e){body=txt}}if(!r.ok){return {data:null,error:{message:body?.msg||body?.message||body?.error_description||body?.error||`HTTP ${r.status}`,status:r.status,code:body?.code}}}return {data:body,error:null,response:r}}catch(e){return {data:null,error:{message:e?.name==='AbortError'?'请求超时，请检查网络后重试。':(e?.message||'网络请求失败')}}}finally{clearTimeout(timer)}}
  async function refreshIfNeeded(){let s=getStored();if(!s?.access_token)return s;const exp=jwtExp(s.access_token);if(exp&&exp>Date.now()/1000+90)return s;if(!s.refresh_token)return s;const r=await request(`${apiBase}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:{apikey:apiKey,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})});if(r.error){store(null);listeners.forEach(fn=>fn('SIGNED_OUT',null));return null}const ns={...r.data,user:r.data.user||s.user};store(ns);listeners.forEach(fn=>fn('TOKEN_REFRESHED',ns));return ns}
  async function headers(extra={}){const s=await refreshIfNeeded();return {apikey:apiKey,'Content-Type':'application/json',...(s?.access_token?{Authorization:`Bearer ${s.access_token}`}:{ }),...extra}}
  class Query{
    constructor(table){this.table=table;this.action='select';this.cols='*';this.filters=[];this.sort=null;this.max=null;this.payload=null;this.singleMode='';this.upsertOpts=null;this.selectOpts={}}
    select(cols='*',opts={}){this.cols=cols;this.selectOpts=opts||{};return this}
    eq(k,v){this.filters.push([k,v]);return this}
    order(k,o={}){this.sort=[k,o?.ascending!==false];return this}
    limit(n){this.max=Number(n);return this}
    maybeSingle(){this.singleMode='maybe';return this.exec()}
    single(){this.singleMode='single';return this.exec()}
    insert(row){this.action='insert';this.payload=row;return this}
    update(row){this.action='update';this.payload=row;return this}
    delete(){this.action='delete';return this}
    upsert(row,opts={}){this.action='upsert';this.payload=row;this.upsertOpts=opts;return this}
    then(resolve,reject){return this.exec().then(resolve,reject)}
    async exec(){
      try{
        const u=new URL(`${apiBase}/rest/v1/${this.table}`);
        if(this.cols)u.searchParams.set('select',this.cols);
        for(const [k,v] of this.filters)u.searchParams.append(k,`eq.${v}`);
        if(this.sort)u.searchParams.set('order',`${this.sort[0]}.${this.sort[1]?'asc':'desc'}`);

        if(this.action==='update'){method='PATCH';body=JSON.stringify(this.payload);prefer='return=representation'}
        if(this.action==='delete'){method='DELETE';prefer='return=representation'}
        const h=await headers(prefer?{Prefer:prefer}:{});
        const r=await request(u.toString(),{method,headers:h,body});
        if(r.error)return {data:null,error:r.error};

        if(this.action==='select'&&!Array.isArray(data)&&data==null)data=[];

    }
  }
  const auth={
    async getSession(){const s=await refreshIfNeeded();return {data:{session:s},error:null}},
    async getUser(){const s=await refreshIfNeeded();return s?.user?{data:{user:s.user},error:null}:{data:{user:null},error:{message:'No active session'}}},
    onAuthStateChange(fn){listeners.add(fn);return {data:{subscription:{unsubscribe:()=>listeners.delete(fn)}}}},
    async signInWithPassword({email,password}){const r=await request(`${apiBase}/auth/v1/token?grant_type=password`,{method:'POST',headers:{apikey:apiKey,'Content-Type':'application/json'},body:JSON.stringify({email,password})});if(r.error)return {data:null,error:r.error};const s={...r.data,user:r.data.user};store(s);listeners.forEach(fn=>fn('SIGNED_IN',s));return {data:{session:s,user:s.user},error:null}},
    async signUp({email,password}){const r=await request(`${apiBase}/auth/v1/signup`,{method:'POST',headers:{apikey:apiKey,'Content-Type':'application/json'},body:JSON.stringify({email,password})});if(r.error)return {data:null,error:r.error};if(r.data?.access_token){const s={...r.data,user:r.data.user};store(s);listeners.forEach(fn=>fn('SIGNED_IN',s));return {data:{session:s,user:s.user},error:null}}return {data:{session:null,user:r.data?.user||null},error:null}},
    async resetPasswordForEmail(email,{redirectTo}={}){const target=redirectTo||location.href.split('#')[0];const r=await request(`${apiBase}/auth/v1/recover?redirect_to=${encodeURIComponent(target)}`,{method:'POST',headers:{apikey:apiKey,'Content-Type':'application/json'},body:JSON.stringify({email})});return {data:r.data,error:r.error}},
    async signOut(){const s=getStored();if(s?.access_token)request(`${apiBase}/auth/v1/logout`,{method:'POST',headers:{apikey:apiKey,Authorization:`Bearer ${s.access_token}`}},5000).catch(()=>{});store(null);listeners.forEach(fn=>fn('SIGNED_OUT',null));return {error:null}}
  };
  return {auth,from:(table)=>new Query(table)}
}

function niceError(error){if(!error)return '未知错误';const msg=error.message||String(error);if(/email rate limit exceeded/i.test(msg))return '验证邮件发送次数已达到当前额度，请稍后重试。正式多人使用建议配置自定义 SMTP。';if(/email not confirmed/i.test(msg))return '邮箱尚未验证，请先打开验证邮件完成验证。';if(/invalid login credentials/i.test(msg))return '邮箱或密码错误。如果记不清密码，请点击“忘记密码”。';if(/over_email_send_rate_limit|rate limit/i.test(msg))return '重置邮件发送过于频繁，请稍后再试。';if(/user already registered/i.test(msg))return '该邮箱已经注册，请直接登录。';if(error.code==='23505'||/duplicate key/i.test(msg))return 'SKU、单据编号或合同编号已存在，请更换后再保存。';if(/row-level security/i.test(msg))return '当前账号没有写入权限，请重新登录后再试。';if(/JWT|token|session/i.test(msg))return '登录状态已过期，请重新登录。';if(/Failed to fetch|NetworkError|fetch/i.test(msg))return '网络请求失败，请检查网络后重试。';return msg}
async function ensureUser(){const {data,error}=await supabase.auth.getUser();if(error||!data.user){toast('登录状态已失效','err',niceError(error));await supabase.auth.signOut();return null}user=data.user;return user}
async function init(){const hp=new URLSearchParams(location.hash.replace(/^#/,''));if(hp.get('type')==='recovery'&&hp.get('access_token'))return renderPasswordRecovery(hp.get('access_token'));const {data}=await supabase.auth.getSession();user=data.session?.user||null;if(!user)return renderAuth();await loadCloud();render()}
supabase.auth.onAuthStateChange(async(_event,session)=>{const next=session?.user||null;if(next?.id===user?.id)return;user=next;if(!user)return renderAuth();await loadCloud();render()});
function renderAuth(){app.innerHTML=`<div class="auth-shell"><section class="auth-hero"><div><div class="brand-line"><div class="logo">TD</div><b>TradeDesk</b></div><h1>外贸业务，从询价到出货<br>集中在一个工作台。</h1><p>产品库、客户库、报价单、PI、商业发票、装箱单与销售合同统一管理，数据保存在云端并按账号隔离。</p><div class="auth-points"><div class="auth-point">✓ 产品与客户信息只录一次</div><div class="auth-point">✓ 报价可转换为 PI / CI / PL</div><div class="auth-point">✓ 自动计算金额和装箱重量</div><div class="auth-point">✓ A4 单据打印 / 保存 PDF</div></div></div><small style="color:#9fb8e5">TradeDesk Foreign Trade Management System</small></section><section class="auth-side"><div class="auth-card"><div class="brand-line"><div class="logo">TD</div><div><h2>登录 TradeDesk</h2><div class="sub">Foreign Trade Management System</div></div></div><div class="notice">这是内部业务系统。请使用你的工作邮箱和密码登录；首次使用可注册账号。</div><div class="field"><label>邮箱</label><input id="authEmail" type="email" autocomplete="email" placeholder="name@company.com"></div><div class="field"><label>密码</label><input id="authPassword" type="password" autocomplete="current-password" placeholder="至少 6 位"></div><div class="row"><button class="btn primary block" id="loginBtn">登录</button><button class="btn block" id="signupBtn">注册</button></div><div class="auth-forgot"><button id="forgotBtn" type="button">忘记密码？</button></div><p class="muted" style="font-size:11px;margin-top:12px">如果注册后要求邮箱验证，请先在邮箱完成验证，再回来登录。</p></div></section></div>`;$('#loginBtn').onclick=login;$('#signupBtn').onclick=signup;$('#forgotBtn').onclick=forgotPassword;$('#authPassword').addEventListener('keydown',e=>{if(e.key==='Enter')login()})}
async function forgotPassword(){const email=$('#authEmail')?.value.trim()||'';if(!/^\S+@\S+\.\S+$/.test(email))return toast('请先输入正确邮箱','warn','输入注册 TradeDesk 时使用的邮箱，再点击“忘记密码”。');const b=$('#forgotBtn');busy(b,true,'发送中');const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});busy(b,false,'忘记密码？');if(error)return toast('发送失败','err',niceError(error));toast('重置邮件已发送','ok','请打开邮箱中的“Reset Password”邮件，点击链接后设置新密码。')}
function renderPasswordRecovery(accessToken){app.innerHTML=`<div class="auth-shell"><section class="auth-hero"><div><div class="brand-line"><div class="logo">TD</div><b>TradeDesk</b></div><h1>重新设置登录密码</h1><p>为了保护你的业务数据，请设置一个新的登录密码。</p></div><small style="color:#9fb8e5">TradeDesk Account Security</small></section><section class="auth-side"><div class="auth-card"><div class="brand-line"><div class="logo">TD</div><div><h2>设置新密码</h2><div class="sub">Password Recovery</div></div></div><div class="notice">新密码至少 8 位。设置成功后，请使用新密码重新登录。</div><div class="field"><label>新密码</label><input id="newPassword" type="password" autocomplete="new-password" placeholder="至少 8 位"></div><div class="field"><label>再次输入</label><input id="confirmPassword" type="password" autocomplete="new-password" placeholder="再次输入新密码"></div><button class="btn primary block" id="resetPasswordBtn">确认重置密码</button></div></section></div>`;$('#resetPasswordBtn').onclick=async()=>{const p=$('#newPassword').value,c=$('#confirmPassword').value;if(p.length<8)return toast('新密码至少 8 位','warn');if(p!==c)return toast('两次输入的密码不一致','warn');const b=$('#resetPasswordBtn');busy(b,true,'重置中');try{const r=await fetch(`${SUPABASE_URL}/auth/v1/user`,{method:'PUT',headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${accessToken}`,'Content-Type':'application/json'},body:JSON.stringify({password:p})});const body=await r.json().catch(()=>({}));busy(b,false,'确认重置密码');if(!r.ok)return toast('密码重置失败','err',niceError(body));history.replaceState(null,'',location.pathname+location.search);renderAuth();toast('密码已重置','ok','现在请使用新密码登录。')}catch(e){busy(b,false,'确认重置密码');toast('密码重置失败','err','网络连接失败，请稍后重试。')}}}
async function login(){const email=$('#authEmail').value.trim(),password=$('#authPassword').value;if(!email||!password)return toast('请输入邮箱和密码','warn');const b=$('#loginBtn');busy(b,true,'登录中');const {error}=await supabase.auth.signInWithPassword({email,password});busy(b,false,'登录');if(error)toast('登录失败','err',niceError(error))}
async function signup(){const email=$('#authEmail').value.trim(),password=$('#authPassword').value;if(!/^\S+@\S+\.\S+$/.test(email))return toast('请输入有效邮箱','warn');if(password.length<6)return toast('密码至少 6 位','warn');const b=$('#signupBtn');busy(b,true,'注册中');const {error}=await supabase.auth.signUp({email,password});busy(b,false,'注册');if(error)toast('注册失败','err',niceError(error));else toast('注册请求已提交','ok','如系统要求邮箱验证，请先完成验证后再登录。')}
function busy(btn,on,label){if(!btn)return;btn.disabled=on;btn.innerHTML=on?`<span class="spinner"></span>${esc(label)}`:esc(label)}
async function loadCloud(){if(!user)return;const uid=user.id;const [s,p,c,sp,d,pc]=await Promise.all([supabase.from('trade_settings').select('*').eq('user_id',uid).maybeSingle(),supabase.from('trade_products').select('*').eq('user_id',uid).order('created_at',{ascending:false}),supabase.from('trade_customers').select('*').eq('user_id',uid).order('created_at',{ascending:false}),supabase.from('trade_suppliers').select('*').eq('user_id',uid).order('created_at',{ascending:false}),supabase.from('trade_documents').select('*').eq('user_id',uid).order('created_at',{ascending:false}),supabase.from('trade_purchase_contracts').select('*').eq('user_id',uid).order('created_at',{ascending:false})]);const errs=[s.error,p.error,c.error,sp.error,d.error,pc.error].filter(Boolean);state.cloudOk=!errs.length;if(errs.length)toast('云端数据加载异常','err',niceError(errs[0]));db.company={...seedCompany,...(s.data?.company||{})};db.prefs={...seedPrefs,...(s.data?.preferences||{})};db.suppliers=(sp.data||[]).map(x=>({id:x.id,company:x.company,contact:x.contact||'',phone:x.phone||'',email:x.email||'',address:x.address||'',taxId:x.tax_id||'',bankName:x.bank_name||'',bankAccount:x.bank_account||'',paymentTerms:x.payment_terms||'',notes:x.notes||''}));db.products=(p.data||[]).map(x=>{const box=parseCartonSize(x.carton_size||''),sale=Number(x.sale_price??x.price??0),purchase=Number(x.purchase_price||0);return {id:x.id,sku:x.sku,name:x.name,nameCn:x.name_cn||'',hs:x.hs_code||'',unit:x.unit,salePrice:sale,purchasePrice:purchase,price:sale,currency:x.currency||'USD',purchaseCurrency:x.purchase_currency||'CNY',supplierId:x.supplier_id||'',moq:Number(x.moq),pcsCarton:Number(x.pcs_carton),nw:Number(x.net_weight),gw:Number(x.gross_weight),carton:x.carton_size||'',imageUrl:x.image_url||'',len:box.len,wid:box.wid,hei:box.hei,cbm:box.cbm}});db.customers=(c.data||[]).map(x=>{const meta=parseCustomerMeta(x.notes||'');return {id:x.id,company:x.company,contact:x.contact||'',country:x.country||'',email:x.email||'',phone:x.phone||'',address:x.address||'',taxId:x.tax_id||'',noteText:meta.memo,depositRate:Number(meta.depositRate||0),orderQty:Number(meta.orderQty||0),orderAmount:Number(meta.orderAmount||0)}});db.documents=(d.data||[]).map(x=>{const dm=parseDocMeta(x.notes||'');return {id:x.id,type:x.type,no:x.doc_no,date:x.doc_date,customerId:x.customer_id,currency:x.currency,incoterm:x.incoterm,destination:x.destination||'',payment:x.payment||'',notes:dm.memo||'',meta:dm,status:x.status,items:Array.isArray(x.items)?x.items:[],createdAt:x.created_at}});db.purchaseContracts=(pc.data||[]).map(x=>{const pm=parsePurchaseMeta(x.notes||'');return {id:x.id,no:x.contract_no,date:x.contract_date,supplierId:x.supplier_id||'',supplierSnapshot:x.supplier_snapshot||{},currency:x.currency||'CNY',deliveryAddress:x.delivery_address||'',paymentTerms:x.payment_terms||'',deliveryTerms:x.delivery_terms||'',taxRate:Number(x.tax_rate||0),status:x.status||'Draft',notes:pm.memo||'',meta:pm,items:Array.isArray(x.items)?x.items:[],createdAt:x.created_at}})}
function shell(content){const [title,sub]=pages[state.page];return `<div class="app-shell"><aside class="sidebar"><div class="brand"><div class="logo">TD</div><div><h2>TradeDesk</h2><small>Foreign Trade OS</small></div></div><div class="nav-title">业务中心</div><div class="nav">${[['dashboard','工作台总览'],['products','产品库'],['customers','客户库'],['suppliers','供应商'],['purchases','采购合同'],['quotes','报价单'],['pi','形式发票 PI'],['invoice','商业发票'],['packing','装箱单'],['customs','报关单'],['contracts','销售合同']].map(([k,n])=>`<button data-nav="${k}" class="${state.page===k?'active':''}">${n}</button>`).join('')}</div><div class="nav-title">系统</div><div class="nav"><button data-nav="settings" class="${state.page==='settings'?'active':''}">公司设置</button></div></aside><main class="main"><header class="topbar"><div><h1>${title}</h1><p>${sub}</p></div><div class="row"><div class="cloud"><span class="status-dot ${state.cloudOk?'ok':'bad'}"></span>${state.cloudOk?'云端已连接':'云端异常'}</div><span class="muted" style="font-size:11px">${esc(user?.email||'')}</span><button class="btn" id="logoutBtn">退出</button></div></header><section class="content">${content}<div class="footer">TradeDesk Complete · Sales + Procurement · Secure Cloud Database</div></section></main></div>${state.modal}`}
function render(){let content=state.page==='dashboard'?dashboard():state.page==='products'?products():state.page==='customers'?customers():state.page==='suppliers'?suppliers():state.page==='purchases'?purchaseContracts():docPages[state.page]?documents():settings();app.innerHTML=shell(content);document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{state.page=b.dataset.nav;state.draft=null;state.purchaseDraft=null;state.modal='';render()});$('#logoutBtn').onclick=()=>supabase.auth.signOut()}
function dashboard(){const qs=db.documents.filter(x=>x.type==='quote'),pis=db.documents.filter(x=>x.type==='pi'),pcs=db.purchaseContracts;const recent=db.documents.slice(0,6);return `<div class="grid grid-4">${[['产品数量',db.products.length,'销售/采购双价格'],['客户数量',db.customers.length,'外贸客户资料'],['供应商',db.suppliers.length,'国内采购资源'],['采购合同',pcs.length,pcs.length?'采购记录已建立':'暂无采购合同'],['累计报价',qs.length,qs.length?'已建立报价记录':'暂无报价'],['PI / 订单',pis.length,pis.length?'持续跟进':'暂无 PI']].map(x=>`<div class="card metric"><span>${x[0]}</span><strong>${x[1]}</strong><span>${x[2]}</span></div>`).join('')}</div><div class="grid grid-2" style="margin-top:14px"><div class="card"><div class="section-head"><div><h3>快速开单</h3><p>销售与采购信息自动带入</p></div></div><div class="card-pad actions"><button class="btn primary" onclick="window.goPurchaseNew()">新建采购合同</button>${[['quotes','新建报价单'],['pi','新建 PI'],['invoice','商业发票'],['packing','装箱单'],['customs','报关单'],['contracts','销售合同']].map(([p,n])=>`<button class="btn primary" onclick="window.goNew('${p}')">${n}</button>`).join('')}</div></div><div class="card"><div class="section-head"><div><h3>最近销售单据</h3><p>最近 6 条</p></div></div>${recent.length?`<div class="table-wrap"><table class="table"><tr><th>编号</th><th>类型</th><th>客户</th><th>金额</th></tr>${recent.map(d=>`<tr><td><b>${esc(d.no)}</b></td><td><span class="badge">${docTitles[d.type][1]}</span></td><td>${esc(cust(d.customerId)?.company||'-')}</td><td>${d.type==='packing'?'-':money(amount(d),d.currency)}</td></tr>`).join('')}</table></div>`:'<div class="empty">暂无单据</div>'}</div></div>`}
function products(){const s=state.productSearch.toLowerCase(),list=db.products.filter(p=>[p.sku,p.name,p.nameCn,p.hs].join(' ').toLowerCase().includes(s));return `<div class="card"><div class="section-head"><div><h3>产品资料</h3><p>采购价格、销售价格、默认供应商、图片、尺寸体积、HS Code、装箱参数</p></div><button class="btn primary" onclick="window.productModal()">＋ 新增产品</button></div><div class="toolbar"><input class="search" placeholder="搜索 SKU / 产品名 / HS Code" value="${esc(state.productSearch)}" oninput="window.searchProducts(this.value)"><span class="muted" style="font-size:11px">共 ${db.products.length} 个产品</span></div>${list.length?`<div class="table-wrap"><table class="table"><tr><th>SKU</th><th>产品</th><th>图片</th><th>采购价</th><th>销售价</th><th>毛利率</th><th>默认供应商</th><th>尺寸 / 体积</th><th>装箱 / 重量</th><th>操作</th></tr>${list.map(p=>`<tr><td><b>${esc(p.sku)}</b></td><td>${esc(p.name)}<br><span class="muted">${esc(p.nameCn)}</span><br><span class="muted">HS: ${esc(p.hs||'-')}</span></td><td>${imgThumb(p.imageUrl,p.name)}</td><td>${money(p.purchasePrice,p.purchaseCurrency)}</td><td>${money(p.salePrice,p.currency)}</td><td>${marginPct(p)==null?'-':`${marginPct(p).toFixed(1)}%`}</td><td>${esc(supplier(p.supplierId)?.company||'-')}</td><td>${esc(p.carton||'-')}<br><span class="muted">${formatCbm(p.cbm)}</span></td><td>${p.pcsCarton} ${esc(p.unit)}/CTN<br><span class="muted">N.W. ${p.nw} / G.W. ${p.gw} KG</span></td><td><button class="btn small" onclick="window.productModal('${p.id}')">编辑</button> <button class="btn small danger" onclick="window.delProduct('${p.id}')">删除</button></td></tr>`).join('')}</table></div>`:'<div class="empty">暂无匹配产品</div>'}</div>`}

function renderInvoicePaper(d){const c=cust(d.customerId)||{},m={...DOC_META_DEFAULT,...(d.meta||{})},total=amount(d);return `<div class="paper traditional">${tradHeader()}<div class="trad-title">COMMERCIAL INVOICE</div><table class="trad-table"><tr><td class="label">ISSUER</td><td>${sellerBlock()}</td><td class="label">INVOICE NO.</td><td>${esc(d.no)}</td></tr><tr><td class="label">BUYER</td><td><b>${esc(c.company||'')}</b><br>${esc(c.contact||'')} ${esc(c.phone||'')}<br>${esc(c.address||'')}</td><td class="label">DATE</td><td>${esc(d.date)}</td></tr><tr><td class="label">TRANSPORT DETAILS</td><td>Shipment from ${esc(m.portLoading||'Origin')} to ${esc(m.portDischarge||d.destination||'Destination')}<br>Trade Term: ${esc(d.incoterm)}</td><td class="label">PAYMENT</td><td>${esc(d.payment||'-')}</td></tr><tr><td class="label">S/C NO.</td><td>${esc(m.scNo||'-')}</td><td class="label">L/C NO.</td><td>${esc(m.lcNo||'-')}</td></tr></table><table class="trad-table"><tr><th style="width:72px">Marks & No.</th><th>Number and Kind of Packages / Description of Goods</th><th style="width:66px">Qty</th><th style="width:58px">Unit</th><th style="width:92px">Unit Price</th><th style="width:105px">Amount</th></tr>${(d.items||[]).map((it,i)=>`<tr><td class="center">${esc(m.marks||'N/M')}</td><td>${esc(it.description)}<br>HS CODE: ${esc(it.hs||'-')}</td><td class="right">${Number(it.qty||0)}</td><td class="center">${esc(it.unit)}</td><td class="right">${money(it.price,d.currency)}</td><td class="right">${money(Number(it.qty||0)*Number(it.price||0),d.currency)}</td></tr>`).join('')}<tr><td colspan="5" class="right"><b>TOTAL</b></td><td class="right"><b>${money(total,d.currency)}</b></td></tr></table><div class="trad-words">SAY TOTAL: ${esc(amountWords(total,d.currency))}</div><div class="trad-declare"><b>Declaration:</b> We hereby certify that the above invoice is true and correct.</div>${tradSign('Authorized Signature')}</div>`}
function renderPackingPaper(d){const c=cust(d.customerId)||{},m={...DOC_META_DEFAULT,...(d.meta||{})},w=calcWeights(d),cartons=sumCartons(d);return `<div class="paper traditional">${tradHeader()}<div class="trad-title">PACKING LIST</div><table class="trad-table"><tr><td class="label">CONSIGNEE</td><td><b>${esc(c.company||'')}</b><br>${esc(c.contact||'')} ${esc(c.phone||'')}<br>${esc(c.address||'')}</td><td class="label">PACKING LIST NO.</td><td>${esc(d.no)}</td></tr><tr><td class="label">SHIPMENT TERMS</td><td>${esc(d.incoterm)} ${esc(d.destination||'')}</td><td class="label">DATE</td><td>${esc(d.date)}</td></tr><tr><td class="label">PORT OF LOADING</td><td>${esc(m.portLoading||'-')}</td><td class="label">PORT OF DISCHARGE</td><td>${esc(m.portDischarge||'-')}</td></tr></table><table class="trad-table"><tr><th>No.</th><th>Description of Commodity</th><th>HS Code</th><th>Qty</th><th>Unit</th><th>Cartons</th><th>Carton Size / CBM</th><th>N.W. KGS</th><th>G.W. KGS</th></tr>${(d.items||[]).map((it,i)=>{const p=db.products.find(x=>x.id===it.productId),ct=p?.pcsCarton?Math.ceil(Number(it.qty||0)/p.pcsCarton):0;return `<tr><td class="center">${i+1}</td><td>${esc(it.description)}</td><td class="center">${esc(it.hs||'')}</td><td class="right">${Number(it.qty||0)}</td><td class="center">${esc(it.unit)}</td><td class="right">${ct}</td><td>${esc(p?.carton||'-')}<br>${p?.cbm?`${Number(p.cbm).toFixed(3)} CBM/CTN`:''}</td><td class="right">${(ct*Number(p?.nw||0)).toFixed(2)}</td><td class="right">${(ct*Number(p?.gw||0)).toFixed(2)}</td></tr>`}).join('')}</table><div class="trad-packing-summary"><div>Total Cartons<b>${cartons}</b></div><div>Total CBM<b>${sumCbm(d).toFixed(3)}</b></div><div>Total N.W.<b>${w.nw.toFixed(2)} KGS</b></div><div>Total G.W.<b>${w.gw.toFixed(2)} KGS</b></div></div><div class="trad-declare"><b>Marks & Nos.:</b> ${esc(m.marks||'N/M')} &nbsp;&nbsp; <b>Package:</b> ${esc(m.packageType||'CARTON')}</div>${tradSign('Authorized Signature')}</div>`}
function renderCustomsPaper(d){const c=cust(d.customerId)||{},m={...DOC_META_DEFAULT,...(d.meta||{})},w=calcWeights(d),cartons=sumCartons(d),total=amount(d);return `<div class="paper traditional">${tradHeader()}<div class="trad-title">CUSTOMS DECLARATION</div><table class="trad-table"><tr><td class="label">EXPORTER</td><td>${esc(db.company.name)}<br>${esc(db.company.address||'')}</td><td class="label">CONSIGNEE</td><td>${esc(c.company||'')}<br>${esc(c.address||'')}</td></tr><tr><td class="label">DECLARATION NO.</td><td>${esc(d.no)}</td><td class="label">DATE</td><td>${esc(d.date)}</td></tr><tr><td class="label">PORT OF LOADING</td><td>${esc(m.portLoading||'-')}</td><td class="label">PORT OF DISCHARGE</td><td>${esc(m.portDischarge||'-')}</td></tr><tr><td class="label">COUNTRY OF ORIGIN</td><td>${esc(m.originCountry||'China')}</td><td class="label">DESTINATION COUNTRY</td><td>${esc(m.destinationCountry||'-')}</td></tr><tr><td class="label">TRADE TERM</td><td>${esc(d.incoterm)} ${esc(d.destination||'')}</td><td class="label">TRANSPORT MODE</td><td>${esc(m.transportMode||'SEA')}</td></tr><tr><td class="label">PACKAGE / MARKS</td><td>${esc(m.packageType||'CARTON')} / ${esc(m.marks||'N/M')}</td><td class="label">CURRENCY</td><td>${esc(d.currency)}</td></tr></table><table class="trad-table"><tr><th>No.</th><th>Description of Goods</th><th>HS Code</th><th>Qty</th><th>Unit</th><th>Unit Price</th><th>Amount</th></tr>${(d.items||[]).map((it,i)=>`<tr><td class="center">${i+1}</td><td>${esc(it.description)}</td><td class="center">${esc(it.hs||'')}</td><td class="right">${Number(it.qty||0)}</td><td class="center">${esc(it.unit)}</td><td class="right">${money(it.price,d.currency)}</td><td class="right">${money(Number(it.qty||0)*Number(it.price||0),d.currency)}</td></tr>`).join('')}</table><table class="trad-summary"><tr><td class="k">Total Value</td><td>${money(total,d.currency)}</td><td class="k">Total Qty</td><td>${sumQty(d)}</td></tr><tr><td class="k">Total Cartons</td><td>${cartons}</td><td class="k">Total CBM</td><td>${sumCbm(d).toFixed(3)}</td></tr><tr><td class="k">Net Weight</td><td>${w.nw.toFixed(2)} KGS</td><td class="k">Gross Weight</td><td>${w.gw.toFixed(2)} KGS</td></tr></table><div class="trad-declare"><b>Declaration Elements:</b> ${esc(m.customsElements||'-')}<br><br><b>Declaration Statement:</b> We hereby declare that the information stated above is true and correct for customs clearance purpose.</div>${tradSign('Authorized Signature / Chop')}</div>`}
function renderContractPaper(d){const c=cust(d.customerId)||{},total=amount(d);return `<div class="paper traditional">${tradHeader()}<div class="trad-title">SALES CONTRACT</div><table class="trad-table"><tr><td class="label">SELLER</td><td>${esc(db.company.name)}<br>${esc(db.company.address||'')}</td><td class="label">BUYER</td><td>${esc(c.company||'')}<br>${esc(c.address||'')}</td></tr><tr><td class="label">CONTRACT NO.</td><td>${esc(d.no)}</td><td class="label">DATE</td><td>${esc(d.date)}</td></tr><tr><td class="label">PRICE TERM</td><td>${esc(d.incoterm)} ${esc(d.destination||'')}</td><td class="label">PAYMENT</td><td>${esc(d.payment||'-')}</td></tr></table><table class="trad-table"><tr><th>No.</th><th>Description</th><th>Qty</th><th>Unit</th><th>Unit Price</th><th>Amount</th></tr>${(d.items||[]).map((it,i)=>`<tr><td class="center">${i+1}</td><td>${esc(it.description)}</td><td class="right">${Number(it.qty||0)}</td><td class="center">${esc(it.unit)}</td><td class="right">${money(it.price,d.currency)}</td><td class="right">${money(Number(it.qty||0)*Number(it.price||0),d.currency)}</td></tr>`).join('')}<tr><td colspan="5" class="right"><b>TOTAL CONTRACT VALUE</b></td><td class="right"><b>${money(total,d.currency)}</b></td></tr></table><div class="trad-notes"><b>1. Amount in Words:</b> ${esc(amountWords(total,d.currency))}<br><b>2. Shipment:</b> Shipment and packing details shall be subject to mutual confirmation.<br><b>3. Payment:</b> ${esc(d.payment||'-')}<br><b>4. Remarks:</b> ${esc(d.notes||'None')}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:50px;margin-top:35px"><div style="text-align:center;border-top:1px solid #111;padding-top:8px">SELLER<br>${esc(db.company.name)}</div><div style="text-align:center;border-top:1px solid #111;padding-top:8px">BUYER<br>${esc(c.company||'')}</div></div></div>`}
function paper(d){if(d.type==='quote')return renderQuotePaper(d);if(d.type==='pi')return renderPiPaper(d);if(d.type==='invoice')return renderInvoicePaper(d);if(d.type==='packing')return renderPackingPaper(d);if(d.type==='customs')return renderCustomsPaper(d);return renderContractPaper(d)}
function settings(){const c=db.company;return `<div class="settings-stack"><div class="card"><div class="section-head"><div><h3>公司资料 / 中英文地址 / Logo / 盖章 / 签名 / 银行信息</h3><p>保存后自动带入全部正式外贸单据</p></div><button class="btn primary" id="saveSettingsBtn" onclick="window.saveSettings()">保存设置</button></div><div class="card-pad"><div class="setting-media-grid">${mediaSetting('公司 Logo','logoUrl',c.logoUrl,'建议透明 PNG / 横版 Logo')}${mediaSetting('公司盖章 / Chop','stampUrl',c.stampUrl,'建议透明 PNG，打印时叠加到签字区')}${mediaSetting('签名 / Signature','signatureUrl',c.signatureUrl,'建议透明 PNG 手写签名')}</div><div class="form-grid">${sf('公司英文名','name',c.name)}${sf('公司中文名','nameCn',c.nameCn)}${sf('公司英文地址 / 外贸单据','address',c.address,true)}${sf('公司中文地址 / 国内采购合同','addressCn',c.addressCn,true)}${sf('国内采购联系人','purchaseContact',c.purchaseContact)}${sf('国内采购联系电话','purchasePhone',c.purchasePhone)}${sf('电话','phone',c.phone)}${sf('业务邮箱','email',c.email)}${sf('网站','website',c.website)}${sf('税号 / 注册号','taxNo',c.taxNo)}${sf('Beneficiary','beneficiary',c.beneficiary)}${sf('Bank Name','bankName',c.bankName)}${sf('Bank Address','bankAddress',c.bankAddress,true)}${sf('Account No.','accountNo',c.accountNo)}${sf('SWIFT','swift',c.swift)}${sf('默认币种','defaultCurrency',c.defaultCurrency)}<div class="field"><label>默认贸易条款</label><select id="set_defaultIncoterm">${buildIncotermOptions(c.defaultIncoterm)}</select></div>${sf('默认付款条件','defaultPayment',c.defaultPayment,true)}</div></div></div><div class="card"><div class="section-head"><div><h3>云端状态</h3><p>V4 支持一键生成全套外贸单据</p></div><button class="btn" onclick="window.runCloudTest()">重新检测</button></div><div class="card-pad"><div class="diag">当前账号：${esc(user?.email||'')}<br>数据库：${state.cloudOk?'连接正常':'连接异常'}<br>产品：${db.products.length} · 客户：${db.customers.length} · 供应商：${db.suppliers.length} · 销售单据：${db.documents.length} · 采购合同：${db.purchaseContracts.length}<br>Quotation → PI / CI / PL / 报关单 / 销售合同，并可按产品默认供应商生成国内采购合同。</div></div></div></div>`}
function mediaSetting(label,key,val,hint){return `<div class="media-card"><label style="font-size:12px;font-weight:700">${label}</label><div class="media-preview" id="prev_${key}">${val?`<img src="${esc(val)}">`:'<span class="muted">No Image</span>'}</div><input id="set_${key}" value="${esc(val||'')}" placeholder="图片 URL" oninput="window.syncSettingImage('${key}',this.value)"><input type="file" accept="image/*" style="margin-top:7px;width:100%" onchange="window.pickSettingImage('${key}',this)"><div class="hint-inline">${hint}</div></div>`}
function sf(label,key,val,wide=false){return `<div class="field ${wide?'full':''}"><label>${label}</label>${wide?`<textarea id="set_${key}">${esc(val)}</textarea>`:`<input id="set_${key}" value="${esc(val)}">`}</div>`}
window.syncSettingImage=(key,val)=>{const p=$(`#prev_${key}`);if(p)p.innerHTML=String(val||'').trim()?`<img src="${esc(String(val).trim())}">`:'<span class="muted">No Image</span>'};
window.pickSettingImage=(key,input)=>{const file=input.files&&input.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{const val=String(reader.result||'');const target=$(`#set_${key}`);if(target)target.value=val;window.syncSettingImage(key,val)};reader.readAsDataURL(file)};
function showModal(title,body,saveCall,saveLabel='保存'){state.modal=`<div class="modal-bg"><div class="modal"><div class="modal-head"><h3>${title}</h3><button class="x" onclick="window.closeModal()">×</button></div><div class="modal-body">${body}</div><div class="modal-foot"><span id="modalSaveState" class="save-state">数据将保存到云端</span><button class="btn" onclick="window.closeModal()">取消</button><button class="btn primary" id="modalSaveBtn" onclick="${saveCall}">${saveLabel}</button></div></div></div>`;render()}
window.closeModal=()=>{if(state.saving)return;state.modal='';render()};
window.searchProducts=v=>{state.productSearch=v;render()};window.searchCustomers=v=>{state.customerSearch=v;render()};
window.goNew=p=>{state.page=p;window.newDoc(docPages[p])};
function modalField(label,id,val,type='text',hint=''){return `<div class="field"><label>${label}</label><input id="${id}" type="${type}" value="${esc(val)}">${hint?`<div class="hint">${hint}</div>`:''}</div>`}
window.syncCompanyLogoUrl=v=>{const val=String(v||'').trim();const prev=$('#companyLogoPreview');if(prev){if(prev.tagName==='IMG')prev.src=val||'';else prev.outerHTML=val?`<img id="companyLogoPreview" src="${esc(val)}">`:`<div id="companyLogoPreview" class="muted">LOGO</div>`}};
window.pickCompanyLogoFile=input=>{const file=input.files&&input.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{const val=String(reader.result||'');if($('#set_logoUrl'))$('#set_logoUrl').value=val;window.syncCompanyLogoUrl(val)};reader.readAsDataURL(file)}
window.productModal=id=>{const p=id?db.products.find(x=>x.id===id):{id:'',sku:'',name:'',nameCn:'',hs:'',unit:'PCS',salePrice:0,purchasePrice:0,currency:'USD',purchaseCurrency:'CNY',supplierId:'',moq:100,pcsCarton:1,nw:0,gw:0,carton:'',imageUrl:''};const box=parseCartonSize(p.carton||'');showModal(id?'编辑产品':'新增产品',`<div class="form-grid"><div class="field full"><label>产品图片</label><div class="img-panel"><div class="preview">${p.imageUrl?`<img id="pImagePreview" src="${esc(p.imageUrl)}">`:`<div id="pImagePreview" class="muted" style="font-size:11px">No Image</div>`}</div><div><input id="pImage" type="hidden" value="${esc(p.imageUrl||'')}"><input id="pImageUrl" placeholder="图片 URL（或上传图片）" value="${esc(p.imageUrl||'')}" oninput="window.syncProductImageUrl(this.value)"><div class="row" style="margin-top:8px"><input type="file" accept="image/*" onchange="window.pickProductImageFile(this)"></div><div class="hint-inline">支持外链图片，或本地上传。</div></div></div></div>${modalField('SKU *','pSku',p.sku,'text','同一账号下 SKU 不能重复')}${modalField('英文产品名 *','pName',p.name)}${modalField('中文产品名','pNameCn',p.nameCn)}${modalField('HS Code','pHs',p.hs,'text','按文本保存，不会丢失前导 0')}<div class="field"><label>默认供应商</label><select id="pSupplier"><option value="">未指定</option>${db.suppliers.map(s=>`<option value="${s.id}" ${p.supplierId===s.id?'selected':''}>${esc(s.company)}</option>`).join('')}</select></div>${modalField('单位 *','pUnit',p.unit)}${modalField('采购币种','pPurchaseCurrency',p.purchaseCurrency)}${modalField('采购价格','pPurchasePrice',p.purchasePrice,'number')}${modalField('销售币种','pCurrency',p.currency)}${modalField('销售价格','pSalePrice',p.salePrice,'number')}${modalField('MOQ','pMoq',p.moq,'number')}${modalField('每箱数量','pPcs',p.pcsCarton,'number')}${modalField('净重/箱 KG','pNw',p.nw,'number')}${modalField('毛重/箱 KG','pGw',p.gw,'number')}${modalField('长 cm','pLen',box.len||'','number')}${modalField('宽 cm','pWid',box.wid||'','number')}${modalField('高 cm','pHei',box.hei||'','number')}<div class="field"><label>体积 CBM</label><input id="pCbm" value="${box.cbm?box.cbm.toFixed(3):''}" readonly></div></div>`,`window.saveProduct('${p.id}')`);['#pLen','#pWid','#pHei'].forEach(sel=>{const el=$(sel);if(el)el.addEventListener('input',window.updateProductVolume)})};
window.syncProductImageUrl=v=>{const val=String(v||'').trim();if($('#pImage'))$('#pImage').value=val;const prev=$('#pImagePreview');if(prev){if(prev.tagName==='IMG')prev.src=val||'';else prev.outerHTML=val?`<img id="pImagePreview" src="${esc(val)}">`:`<div id="pImagePreview" class="muted" style="font-size:11px">No Image</div>`}};

window.runCloudTest=async()=>{const u=await ensureUser();if(!u)return;const {data,error}=await supabase.from('trade_products').select('id',{count:'exact',head:false}).eq('user_id',u.id).limit(1);state.cloudOk=!error;render();if(error)toast('云端连接失败','err',niceError(error));else toast('云端连接正常','ok','当前账号可正常读取数据库。')};
Promise.race([init(),new Promise((_,reject)=>setTimeout(()=>reject(new Error('启动超时')),15000))]).catch(err=>{app.innerHTML=`<div style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f7fb"><div style="max-width:520px;background:#fff;border:1px solid #e5eaf1;border-radius:16px;padding:26px;box-shadow:0 14px 40px rgba(16,24,40,.08)"><h2 style="margin-top:0">TradeDesk 暂时无法连接云端</h2><p style="color:#667085;line-height:1.7">页面本身已经加载完成，但云数据库连接超时。请刷新页面，或直接使用正式线上地址。</p><div style="font-size:12px;color:#98a2b3">${esc(err?.message||String(err))}</div></div></div>`});
