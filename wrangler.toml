name = "amazon-supply-workbench"
main = "src/worker.js"
compatibility_date = "2026-09-20"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "amazon-supply-workbench"
database_id = "00000000-0000-0000-0000-000000000000"

[[kv_namespaces]]
binding = "IMAGES"
