name: 婚礼管家 Chrome 安装图标
on:
  push:
    paths:
      - 'wedding-planner/icon-pink.svg'
      - '.github/workflows/wedding-pwa-icons.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate 192px and 512px PNG icons
        run: |
          python -m pip install cairosvg pillow
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          from PIL import Image
          import cairosvg
          root=Path("wedding-planner")
          svg=(root/"icon-pink.svg").read_bytes()
          for size in (192,512):
              png=cairosvg.svg2png(bytestring=svg,output_width=size,output_height=size)
              image=Image.open(BytesIO(png)).convert("RGBA")
              dest=root/f"icon-heart-{size}.png"
              image.save(dest,format="PNG",optimize=True)
              print(dest,dest.stat().st_size)
          PY
      - name: Commit installable PWA icons
        run: |
          git add wedding-planner/icon-heart-192.png wedding-planner/icon-heart-512.png
          if ! git diff --cached --quiet; then
            git -c user.name="Wedding PWA Build" -c user.email="actions@users.noreply.github.com" commit -m "Generate PNG icons for Chrome wedding app installation"
            git push
          fi
