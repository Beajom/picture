name: Sync Confirmed Inventory 2026-10-12

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-inventory-20261012.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Apply exact confirmed inventory
        shell: bash
        run: |
          node <<'NODE'
          const BASE="https://amazon-supply-workbench-free.chongyu0502.workers.dev";
          async function api(path,opt={}){
            const r=await fetch(BASE+"/api"+path,{headers:{"content-type":"application/json","cache-control":"no-cache"},...opt});
            const t=await r.text();
            let j={}; try{j=JSON.parse(t)}catch{}
            if(!r.ok) throw new Error(path+" failed: "+r.status+" "+t);
            return j;
          }

          const targets={
            "B0927KVX9K":{
              model:"3036",
              rows:{
                "肤色":{S:2400,M:0,L:5200,XL:3000,"2XL":400},
                "黑色":{S:400,M:400,L:400,XL:500,"2XL":400}
              },
              expectedTotal:13100
            },
            "B08BWZRMYJ":{
              model:"3037",
              rows:{
                "肤色":{S:0,M:200,L:0,XL:0},
                "黑色":{S:640,M:200,L:840,XL:600}
              },
              expectedTotal:2480
            },
            "B0D45D9TWK":{
              model:"1697",
              rows:{
                "肤色":{S:1300,M:4600,L:4200,XL:3100,"2XL":1000},
                "黑色":{S:1800,M:2000,L:1400,XL:800,"2XL":1000}
              },
              expectedTotal:21200
            }
          };

          async function snapshot(){
            const d=await api("/bootstrap?ts="+Date.now());
            return {
              data:d,
              inv:new Map((d.inventory||[]).map(x=>[x.product_id,Number(x.available_qty||0)]))
            };
          }

          let {data,inv}=await snapshot();
          const changes=[];

          for(const [parent,cfg] of Object.entries(targets)){
            const products=(data.products||[]).filter(p=>String(p.parent_asin||"")===parent);
            for(const [color,sizes] of Object.entries(cfg.rows)){
              for(const [size,want] of Object.entries(sizes)){
                const p=products.find(x=>String(x.color||"")===color&&String(x.size||"").toUpperCase()===size);
                if(!p) throw new Error("Missing "+cfg.model+" "+color+" "+size);
                const have=inv.get(p.id)||0;
                const delta=want-have;
                if(delta!==0){
                  await api("/inventory/adjust",{method:"POST",body:JSON.stringify({
                    product_id:p.id,
                    qty_change:delta,
                    business_type:"库存校正",
                    notes:"2026-10-12 用户确认库存表校正；按型号/颜色/尺码精确同步"
                  })});
                  changes.push({model:cfg.model,color,size,sku:p.sku,from:have,to:want,delta});
                }
              }
            }
          }

          async function verify(label){
            const {data,inv}=await snapshot();
            const out={};
            for(const [parent,cfg] of Object.entries(targets)){
              const products=(data.products||[]).filter(p=>String(p.parent_asin||"")===parent);
              const rows=[];
              for(const [color,sizes] of Object.entries(cfg.rows)){
                for(const [size,want] of Object.entries(sizes)){
                  const p=products.find(x=>String(x.color||"")===color&&String(x.size||"").toUpperCase()===size);
                  if(!p) throw new Error("VERIFY missing "+cfg.model+" "+color+" "+size);
                  const qty=inv.get(p.id)||0;
                  rows.push({color,size,sku:p.sku,qty,want});
                  if(qty!==want) throw new Error(label+" "+cfg.model+" "+color+" "+size+" is "+qty+", expected "+want);
                }
              }
              const total=rows.reduce((s,x)=>s+x.qty,0);
              if(total!==cfg.expectedTotal) throw new Error(label+" "+cfg.model+" total "+total+", expected "+cfg.expectedTotal);
              out[cfg.model]={total,rows};
            }
            const grand=Object.values(out).reduce((s,x)=>s+x.total,0);
            if(grand!==36780) throw new Error(label+" grand total "+grand+", expected 36780");
            console.log(label,JSON.stringify({grand,...out}));
          }

          console.log("CHANGES",JSON.stringify(changes));
          await verify("VERIFY_NOW");
          await new Promise(r=>setTimeout(r,15000));
          await verify("VERIFY_15S");
          NODE
