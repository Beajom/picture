name: Diagnose Cloudflare Worker Storage Bindings

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-cloudflare.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: amazon-supply-workbench-free
    steps:
      - name: Inspect current and historical Worker bindings
        shell: bash
        run: |
          node <<'NODE'
          const token=process.env.CLOUDFLARE_API_TOKEN||"";
          let account=process.env.CLOUDFLARE_ACCOUNT_ID||"";
          const worker=process.env.WORKER_NAME;
          const H={Authorization:`Bearer ${token}`,"Content-Type":"application/json"};
          async function get(url){
            const r=await fetch(url,{headers:H});
            const t=await r.text();
            let j; try{j=JSON.parse(t)}catch{j={raw:t}};
            return {ok:r.ok,status:r.status,j};
          }
          if(!account){
            const accts=await get("https://api.cloudflare.com/client/v4/accounts?per_page=50");
            const arr=Array.isArray(accts.j?.result)?accts.j.result:[];
            for(const a of arr){
              const probe=await get(`https://api.cloudflare.com/client/v4/accounts/${a.id}/workers/scripts/${worker}/settings`);
              if(probe.ok&&probe.j?.success){account=a.id;break}
            }
          }
          if(!account) throw new Error("Could not resolve account id");
          console.log("ACCOUNT",account);

          const base=`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${worker}`;
          const settings=await get(base+"/settings");
          console.log("CURRENT_SETTINGS_STATUS",settings.status);
          const bindings=settings.j?.result?.bindings||[];
          console.log("CURRENT_BINDINGS",JSON.stringify(bindings.map(b=>({
            name:b.name,type:b.type,id:b.id||b.database_id||b.namespace_id||null
          }))));

          const kvBinding=bindings.find(b=>b.name==="IMAGES"&&b.type==="kv_namespace");
          const kvId=kvBinding?.namespace_id||kvBinding?.id;
          if(kvId){
            const backupUrl=`https://api.cloudflare.com/client/v4/accounts/${account}/storage/kv/namespaces/${kvId}/values/system-backups%2Flatest.json`;
            const br=await fetch(backupUrl,{headers:H});
            console.log("BACKUP_STATUS",br.status);
            if(br.ok){
              const backup=await br.json();
              console.log("BACKUP_CREATED_AT",backup.created_at||null);
              const products=backup.tables?.products||[];
              const inventory=backup.tables?.inventory||[];
              const inv=new Map(inventory.map(x=>[x.product_id,Number(x.available_qty||0)]));
              const models=new Map();
              for(const p of products){
                const m=String(p.internal_code||"").split("-")[0]||"";
                if(!models.has(m))models.set(m,{total:0,rows:[]});
                const qty=inv.get(p.id)||0;
                models.get(m).total+=qty;
                models.get(m).rows.push({color:p.color,size:p.size,sku:p.sku,qty});
              }
              for(const m of ["3037","3036","1697"]){
                const x=models.get(m);
                console.log("BACKUP_MODEL",JSON.stringify({model:m,total:x?.total||0,rows:x?.rows||[]}));
              }
            }
          }

          const live=await fetch("https://amazon-supply-workbench-free.chongyu0502.workers.dev/api/bootstrap?ts="+Date.now(),{headers:{"Cache-Control":"no-cache"}});
          console.log("LIVE_BOOTSTRAP_STATUS",live.status);
          if(live.ok){
            const d=await live.json();
            const products=d.products||[], inventory=d.inventory||[], ledger=d.ledger||[];
            const inv=new Map(inventory.map(x=>[x.product_id,Number(x.available_qty||0)]));
            const latest=new Map();
            for(const l of ledger){
              if(!latest.has(l.product_id))latest.set(l.product_id,l);
            }
            for(const m of ["3037","3036"]){
              const rows=products.filter(p=>String(p.internal_code||"").split("-")[0]===m).map(p=>{
                const l=latest.get(p.id);
                return {
                  color:p.color,size:p.size,sku:p.sku,current:inv.get(p.id)||0,
                  ledger_balance:l?Number(l.balance_after||0):null,
                  ledger_type:l?.business_type||null,
                  ledger_time:l?.created_at||null,
                  ledger_change:l?Number(l.qty_change||0):null
                };
              });
              console.log("LIVE_LEDGER_RECOVERY",JSON.stringify({model:m,rows}));
            }
          }

          const d1Binding=bindings.find(b=>b.name==="DB"&&["d1","d1_database"].includes(b.type));
          const d1Id=d1Binding?.id||d1Binding?.database_id;
          if(d1Id){
            const qurl=`https://api.cloudflare.com/client/v4/accounts/${account}/d1/database/${d1Id}/query`;
            async function d1(sql,params=[]){
              const r=await fetch(qurl,{method:"POST",headers:H,body:JSON.stringify({sql,params})});
              const j=await r.json().catch(()=>({}));
              console.log("D1_STATUS",r.status,JSON.stringify(j.errors||[]));
              return j?.result?.[0]?.results||[];
            }
            const hist=await d1(`SELECT p.internal_code,p.color,p.size,p.sku,l.business_type,l.qty_change,l.balance_after,l.created_at
              FROM inventory_ledger l JOIN products p ON p.id=l.product_id
              WHERE p.parent_asin='B0927KVX9K'
              ORDER BY l.created_at DESC LIMIT 1000`);
            console.log("D1_3036_LEDGER",JSON.stringify(hist));
          }

          const reportsResp=await fetch("https://amazon-supply-workbench-free.chongyu0502.workers.dev/api/inventory-report/list?ts="+Date.now(),{headers:{"Cache-Control":"no-cache"}});
          console.log("REPORT_LIST_STATUS",reportsResp.status);
          if(reportsResp.ok){
            const rr=await reportsResp.json();
            const reports=rr.reports||[];
            console.log("REPORT_LIST",JSON.stringify(reports.slice(0,20).map(x=>({id:x.id,generated_at:x.generated_at,reason:x.reason,total_qty:x.total_qty,file_name:x.file_name}))));
            for(const rep of reports.slice(0,10)){
              const dr=await fetch("https://amazon-supply-workbench-free.chongyu0502.workers.dev/api/inventory-report/download/"+encodeURIComponent(rep.id));
              if(!dr.ok) continue;
              const txt=await dr.text();
              const lines=txt.split(/\r?\n/).filter(line=>line.includes("3036")||line.includes("3037"));
              console.log("REPORT_ROWS",JSON.stringify({id:rep.id,generated_at:rep.generated_at,rows:lines}));
            }
          }

          const deployments=await get(base+"/deployments");
          console.log("DEPLOYMENTS_STATUS",deployments.status);
          const deps=deployments.j?.result?.deployments||deployments.j?.result||[];
          const depArr=Array.isArray(deps)?deps:[];
          console.log("DEPLOYMENT_COUNT",depArr.length);
          const versionIds=[];
          for(const d of depArr.slice(0,25)){
            const vs=d.versions||[];
            const ids=vs.map(v=>v.version_id||v.id).filter(Boolean);
            console.log("DEPLOYMENT",JSON.stringify({
              id:d.id,created_on:d.created_on,source:d.source,version_ids:ids
            }));
            for(const id of ids) if(!versionIds.includes(id)) versionIds.push(id);
          }

          const versions=await get(base+"/versions");
          console.log("VERSIONS_STATUS",versions.status);
          const list=versions.j?.result?.items||versions.j?.result?.versions||versions.j?.result||[];
          if(Array.isArray(list)){
            for(const v of list.slice(0,30)){
              const id=v.id||v.version_id;
              if(id&&!versionIds.includes(id))versionIds.push(id);
            }
          }

          for(const id of versionIds.slice(0,30)){
            const vr=await get(base+"/versions/"+id);
            const res=vr.j?.result||{};
            const bds=res.bindings||res.resources?.bindings||res.metadata?.bindings||[];
            const picked=Array.isArray(bds)?bds.map(b=>({
              name:b.name,type:b.type,id:b.id||b.database_id||b.namespace_id||null
            })):[];
            console.log("VERSION",JSON.stringify({
              id,status:vr.status,created_on:res.created_on||res.metadata?.created_on||null,
              bindings:picked
            }));
          }
          NODE
