name: Wedding Planner Android APK

on:
  push:
    branches: [main]
    paths:
      - "wedding-planner/android/**"
      - ".github/workflows/wedding-android.yml"
  pull_request:
    branches: [main]
    paths:
      - "wedding-planner/android/**"
      - ".github/workflows/wedding-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: wedding-planner/android
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build installable Android APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify APK signature and properties
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" wedding-planner-android-v1.0.0.apk
          sha256sum wedding-planner-android-v1.0.0.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wedding-planner-android-apk
          path: wedding-planner/android/wedding-planner-android-v1.0.0.apk
          if-no-files-found: error
          retention-days: 90
      - name: Publish direct download via GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: wedding-planner-android-v1-preview
        run: |
          APK="wedding-planner-android-v1.0.0.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --target "$GITHUB_SHA" \
              --title "婚礼管家 Android 安装版 v1（测试签名）" \
              --notes "原生 Android APK；粉色爱心双环图标、云端婚礼同步、账本与筹备清单。此版本使用 Android 构建测试签名，覆盖升级需保持相同签名。HarmonyOS NEXT 需另制原生 HAP。"
          fi
