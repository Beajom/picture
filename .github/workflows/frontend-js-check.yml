name: Frontend JavaScript Syntax Check

on:
  push:
    paths:
      - "cloudflare-free/public/index.html"
      - "tradedesk/index.html"
      - ".github/workflows/frontend-js-check.yml"
  workflow_dispatch:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract frontend script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("cloudflare-free/public/index.html")
          s=p.read_text(encoding="utf-8")
          a=s.rfind("<script>")
          b=s.rfind("</script>")
          js=s[a+8:b]
          Path("/tmp/frontend.js").write_text(js, encoding="utf-8")
          print("frontend.js lines:", js.count("\n")+1)
          PY
      - name: Check JavaScript syntax
        run: node --check /tmp/frontend.js
      - name: Extract TradeDesk module
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          source = Path("tradedesk/index.html").read_text(encoding="utf-8")
          match = re.search(r'<script type="module">\\s*(.*?)\\s*</script>', source, re.S)
          if not match:
              raise SystemExit("TradeDesk module script not found")
          Path("/tmp/tradedesk.js").write_text(match.group(1), encoding="utf-8")
          print("TradeDesk module lines:", match.group(1).count("\\n") + 1)
          PY
      - name: Check TradeDesk JavaScript syntax
        run: node --input-type=module --check < /tmp/tradedesk.js
