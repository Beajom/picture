name: Frontend JavaScript Syntax Check

on:
  push:
    paths:
      - "cloudflare-free/public/index.html"
      - "tradedesk/index.html"
      - "ads-academy/index.html"
      - "ads-academy/workshop.html"
      - "ads-academy/mindmap-261105.json"
      - "ads-academy/workshop-guides.json"
      - ".github/workflows/frontend-js-check.yml"
  workflow_dispatch:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract frontend script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("cloudflare-free/public/index.html")
          s=p.read_text(encoding="utf-8")
          a=s.rfind("<script>")
          b=s.rfind("</script>")
          js=s[a+8:b]
          Path("/tmp/frontend.js").write_text(js, encoding="utf-8")
          print("frontend.js lines:", js.count("\n")+1)
          PY
      - name: Check JavaScript syntax
        run: node --check /tmp/frontend.js
      - name: Extract TradeDesk module
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          source = Path("tradedesk/index.html").read_text(encoding="utf-8")
          match = re.search(r'<script type="module">\s*(.*?)\s*</script>', source, re.S)
          if not match:
              raise SystemExit("TradeDesk module script not found")
          Path("/tmp/tradedesk.js").write_text(match.group(1), encoding="utf-8")
          print("TradeDesk module lines:", match.group(1).count("\n") + 1)
          PY
      - name: Check TradeDesk JavaScript syntax
        run: node --input-type=module --check < /tmp/tradedesk.js

      - name: Check Academy JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("ads-academy/index.html").read_text(encoding="utf-8")
          a=s.rfind("<script>")
          b=s.rfind("</script>")
          if a < 0 or b <= a: raise SystemExit("Academy main script missing")
          Path("/tmp/ads-academy.js").write_text(s[a+8:b],encoding="utf-8")
          print("Academy script size:",b-a)
          PY
          node --check /tmp/ads-academy.js

      - name: Check Workshop JavaScript and lesson completeness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=Path("ads-academy/workshop.html").read_text(encoding="utf-8")
          a=s.rfind("<script>")
          b=s.rfind("</script>")
          if a<0 or b<=a: raise SystemExit("No workshop JS script")
          Path("/tmp/ads-workshop.js").write_text(s[a+8:b],encoding="utf-8")
          x=json.loads(Path("ads-academy/mindmap-261105.json").read_text(encoding="utf-8"))
          g=json.loads(Path("ads-academy/workshop-guides.json").read_text(encoding="utf-8"))
          def count(n): return 1+sum(count(c) for c in n.get("c",[]))
          assert count(x["root"])==1748
          assert len(g["guides"])==32
          assert len(g["extras"])==4
          assert sum(len(d.get("c",[])) for d in x["root"]["c"])==50
          print("Validated:", count(x["root"]), "nodes, 32 guides, 18 homework topics, 4 extra tasks")
          PY
          node --check /tmp/ads-workshop.js
