name: Repair Confirmed Inventory After Cloudflare Build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-3037-once.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  checks: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare Git build to finish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          node <<'NODE'
          const {GH_TOKEN,REPO,SHA}=process.env;
          const url=`https://api.github.com/repos/${REPO}/commits/${SHA}/check-runs`;
          const headers={Authorization:`Bearer ${GH_TOKEN}`,Accept:"application/vnd.github+json"};
          for(let i=0;i<30;i++){
            const r=await fetch(url,{headers});
            const j=await r.json();
            const cf=(j.check_runs||[]).find(x=>x.name==="Workers Builds: amazon-supply-workbench-free");
            console.log("Cloudflare check",cf?.status||"not-found",cf?.conclusion||"");
            if(cf?.status==="completed"){
              if(cf.conclusion!=="success")throw new Error("Cloudflare build failed");
              process.exit(0);
            }
            await new Promise(res=>setTimeout(res,5000));
          }
          throw new Error("Timed out waiting for Cloudflare build");
          NODE

      - name: Inspect complete 3036 recovery history
        shell: bash
        run: |
          node <<'NODE'
          const u="https://amazon-supply-workbench-free.chongyu0502.workers.dev/api/debug-recovery-3036?ts="+Date.now();
          const r=await fetch(u,{headers:{"cache-control":"no-cache"}});
          const t=await r.text();
          console.log("DEBUG_STATUS",r.status);
          console.log("DEBUG_BODY",t);
          if(!r.ok)throw new Error("3036 recovery endpoint unavailable");
          NODE

      - name: Restore confirmed 3037 inventory only
        shell: bash
        run: |
          node <<'NODE'
          const BASE="https://amazon-supply-workbench-free.chongyu0502.workers.dev";
          async function api(path,opt={}){
            const r=await fetch(BASE+"/api"+path,{headers:{"content-type":"application/json","cache-control":"no-cache"},...opt});
            const t=await r.text();
            let j={}; try{j=JSON.parse(t)}catch{}
            if(!r.ok) throw new Error(path+" failed: "+r.status+" "+t);
            return j;
          }
          const target={
            "肤色":{S:0,M:200,L:0,XL:0},
            "黑色":{S:640,M:200,L:840,XL:600}
          };
          let data=await api("/bootstrap?ts="+Date.now());
          const products=(data.products||[]).filter(p=>String(p.parent_asin||"")==="B08BWZRMYJ");
          const inv=new Map((data.inventory||[]).map(x=>[x.product_id,Number(x.available_qty||0)]));
          const changes=[];
          for(const [color,sizes] of Object.entries(target)){
            for(const [size,want] of Object.entries(sizes)){
              const p=products.find(x=>String(x.color||"")===color&&String(x.size||"").toUpperCase()===size);
              if(!p) throw new Error("Missing 3037 "+color+" "+size);
              const have=inv.get(p.id)||0, delta=want-have;
              if(delta!==0){
                await api("/inventory/adjust",{method:"POST",body:JSON.stringify({
                  product_id:p.id,qty_change:delta,business_type:"库存校正",
                  notes:"恢复用户已确认的3037库存；仅修正3037，不触碰3036/1697"
                })});
                changes.push({color,size,sku:p.sku,from:have,to:want,delta});
              }
            }
          }
          data=await api("/bootstrap?ts="+Date.now());
          const inv2=new Map((data.inventory||[]).map(x=>[x.product_id,Number(x.available_qty||0)]));
          const rows=(data.products||[]).filter(p=>String(p.parent_asin||"")==="B08BWZRMYJ")
            .map(p=>({color:p.color,size:p.size,sku:p.sku,qty:inv2.get(p.id)||0}));
          const total=rows.reduce((s,x)=>s+x.qty,0);
          console.log("CHANGES",JSON.stringify(changes));
          console.log("ROWS",JSON.stringify(rows));
          console.log("TOTAL",total);
          if(total!==2480)throw new Error("3037 verification failed");
          NODE

      - name: Verify live inventory UI features
        shell: bash
        run: |
          BASE="https://amazon-supply-workbench-free.chongyu0502.workers.dev"
          curl -fsS -H "Cache-Control: no-cache" "$BASE/?verify=$(date +%s)" > /tmp/index.html
          grep -q "变体显示管理" /tmp/index.html
          grep -q "隐藏变体" /tmp/index.html
          grep -q "setColorVariantHiddenFromButton" /tmp/index.html
          echo "Inventory UI markers verified."
