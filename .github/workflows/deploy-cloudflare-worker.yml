name: Deploy Amazon Supply Workbench to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare-free/**"
      - ".github/workflows/deploy-cloudflare-worker.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: amazon-supply-workbench-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Cloudflare token
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret."
            exit 1
          fi

      - name: Patch low-stock product images into main page
        shell: bash
        run: node cloudflare-free/scripts/patch-low-stock-images.mjs

      - name: Patch purchase contract generator into main page
        shell: bash
        run: node cloudflare-free/scripts/patch-purchase-contract-v3.mjs

      - name: Enable editable purchase contract content
        shell: bash
        run: node cloudflare-free/scripts/patch-contract-editing.mjs

      - name: Validate frontend JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("cloudflare-free/public/index.html").read_text(encoding="utf-8")
          a=s.rfind("<script>")
          b=s.rfind("</script>")
          if a < 0 or b < 0 or b <= a:
              raise SystemExit("frontend script block not found")
          Path("/tmp/frontend.js").write_text(s[a+8:b], encoding="utf-8")
          PY
          node --check /tmp/frontend.js
          grep -q "<th>产品图片</th>" cloudflare-free/public/index.html
          grep -q "function previewPurchaseContract(id)" cloudflare-free/public/index.html
          grep -q "出口产品购货合同" cloudflare-free/public/index.html
          grep -q "contractPaper" cloudflare-free/public/index.html
          grep -q "保存修改" cloudflare-free/public/index.html

      - name: Install Wrangler
        working-directory: cloudflare-free
        run: npm install --no-audit --no-fund

      - name: Build safe deploy config from existing bindings
        working-directory: cloudflare-free
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: amazon-supply-workbench-free
        run: node scripts/make-deploy-config.mjs

      - name: Deploy Worker and static assets
        working-directory: cloudflare-free
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          CLOUDFLARE_ACCOUNT_ID="$(cat .cloudflare-account-id)" \
            npx wrangler deploy --config wrangler.deploy.toml --no-x-provision

      - name: Restore confirmed 3037 inventory on live worker
        working-directory: cloudflare-free
        run: node scripts/restore-3037-inventory-once.mjs

      - name: Verify deployed production page
        shell: bash
        run: |
          BASE="https://amazon-supply-workbench-free.chongyu0502.workers.dev"
          curl -fsS "$BASE/health?ts=$(date +%s)" | grep -q '"ok":true'
          ok=0
          for i in 1 2 3 4 5 6; do
            curl -fsS -H "Cache-Control: no-cache" "$BASE/?ts=$(date +%s)-$i" > /tmp/index.html
            if grep -q "load().then(render)" /tmp/index.html &&
               grep -q "商品 / ASIN" /tmp/index.html &&
               grep -q "库存中心" /tmp/index.html &&
               grep -q "隐藏变体" /tmp/index.html &&
               grep -q "变体显示管理" /tmp/index.html &&
               grep -q "setColorVariantHiddenFromButton" /tmp/index.html; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = "1"
          curl -fsS -H "Cache-Control: no-cache" "$BASE/api/bootstrap?ts=$(date +%s)" > /tmp/bootstrap.json
          python - <<'PY'
          import json
          d=json.load(open("/tmp/bootstrap.json",encoding="utf-8"))
          products=d.get("products",[])
          inv={x.get("product_id"):int(x.get("available_qty") or 0) for x in d.get("inventory",[])}
          rows=[p for p in products if str(p.get("parent_asin") or "")=="B08BWZRMYJ"]
          total=sum(inv.get(p.get("id"),0) for p in rows)
          print("LIVE_3037_TOTAL", total)
          print("LIVE_3037_ROWS", json.dumps([
              {"color":p.get("color"),"size":p.get("size"),"sku":p.get("sku"),"qty":inv.get(p.get("id"),0)}
              for p in rows
          ],ensure_ascii=False))
          if total != 2480:
              raise SystemExit(f"3037 live total is {total}, expected 2480")
          PY
          echo "Deployment verified."
