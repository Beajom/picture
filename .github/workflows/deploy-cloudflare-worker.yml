name: Deploy Amazon Supply Workbench to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare-free/**"
      - ".github/workflows/deploy-cloudflare-worker.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Cloudflare secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID repository secret."
            exit 1
          fi

      - name: Install Wrangler
        working-directory: cloudflare-free
        run: npm install --no-audit --no-fund

      - name: Build safe deploy config from existing bindings
        working-directory: cloudflare-free
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: amazon-supply-workbench-free
        run: node scripts/make-deploy-config.mjs

      - name: Deploy Worker and static assets
        working-directory: cloudflare-free
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.deploy.toml --no-x-provision

      - name: Verify deployed production page
        shell: bash
        run: |
          BASE="https://amazon-supply-workbench-free.chongyu0502.workers.dev"
          sleep 8
          curl -fsS "$BASE/health" | grep -q '"ok":true'
          curl -fsS "$BASE/" > /tmp/index.html
          grep -q "生产完成剩余时间" /tmp/index.html
          grep -q "预计耗材消耗" /tmp/index.html
          echo "Deployment verified."
