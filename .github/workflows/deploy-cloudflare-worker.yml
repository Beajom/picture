name: Deploy Amazon Supply Workbench to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare-free/**"
      - ".github/workflows/deploy-cloudflare-worker.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Cloudflare token
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret."
            exit 1
          fi

      - name: Validate frontend JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("cloudflare-free/public/index.html").read_text(encoding="utf-8")
          a=s.rfind("<script>")
          b=s.rfind("</script>")
          if a < 0 or b < 0 or b <= a:
              raise SystemExit("frontend script block not found")
          Path("/tmp/frontend.js").write_text(s[a+8:b], encoding="utf-8")
          PY
          node --check /tmp/frontend.js

      - name: Install Wrangler
        working-directory: cloudflare-free
        run: npm install --no-audit --no-fund

      - name: Build safe deploy config from existing bindings
        working-directory: cloudflare-free
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: amazon-supply-workbench-free
        run: node scripts/make-deploy-config.mjs

      - name: Deploy Worker and static assets
        working-directory: cloudflare-free
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          CLOUDFLARE_ACCOUNT_ID="$(cat .cloudflare-account-id)"             npx wrangler deploy --config wrangler.deploy.toml --no-x-provision

      - name: Verify deployed production page
        shell: bash
        run: |
          BASE="https://amazon-supply-workbench-free.chongyu0502.workers.dev"
          sleep 8
          curl -fsS "$BASE/health" | grep -q '"ok":true'
          curl -fsS "$BASE/" > /tmp/index.html
          grep -q "生产完成剩余时间" /tmp/index.html
          grep -q "预计耗材消耗" /tmp/index.html
          grep -q "FBA货件编号" /tmp/index.html
          grep -q "搜索出库单号" /tmp/index.html
          echo "Deployment verified."
