<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>老人病情监测</title>
<style>
:root{
  --b:#1769e8;--b2:#0f4fa8;--navy:#153b61;--bg:#f3f7fb;--t:#172033;--m:#667085;
  --line:#e1e8f0;--r:#b42318;--g:#067647;--o:#b54708;--shadow:0 8px 26px rgba(31,51,73,.07)
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:linear-gradient(180deg,#f7faff 0,#f3f7fb 240px);color:var(--t);font-size:15px}
.hidden{display:none!important}
.auth{min-height:100vh;display:grid;place-items:center;padding:24px}
.box,.panel,.card{background:rgba(255,255,255,.98);border:1px solid var(--line);border-radius:16px}
.auth .box{width:min(440px,100%);padding:26px;box-shadow:0 18px 50px rgba(20,54,90,.14)}
.panel{padding:22px;box-shadow:var(--shadow)}
.card{padding:18px;box-shadow:0 5px 16px rgba(31,51,73,.05);transition:.18s ease}
.card:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(31,51,73,.09)}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid #cfd9e6;border-radius:10px;background:#fff;color:var(--t);font:inherit;margin:7px 0 12px;outline:none;transition:.16s ease}
input:focus,select:focus,textarea:focus{border-color:#75a7f5;box-shadow:0 0 0 3px rgba(23,105,232,.10)}
input[type=file]{padding:9px;background:#f9fbfd;border-style:dashed}
textarea{resize:vertical;min-height:110px}
button{border:0;border-radius:9px;padding:10px 16px;background:linear-gradient(135deg,var(--b),#0b5bd3);color:#fff;font-weight:700;cursor:pointer;box-shadow:0 4px 10px rgba(23,105,232,.15);transition:.16s ease}
button:hover{transform:translateY(-1px);filter:brightness(.99)}
button.alt{background:#eef3f8;color:#344054;box-shadow:none}
button.alt:hover{background:#e5edf6}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
header{background:linear-gradient(110deg,#173f67,#113557);color:#fff;padding:19px max(24px,calc((100vw - 1660px)/2));display:flex;justify-content:space-between;gap:20px;align-items:center;box-shadow:0 3px 14px rgba(17,53,87,.16)}
header h1{margin:0 0 3px;font-size:24px;letter-spacing:.2px}
header small{opacity:.82}
nav{display:flex;gap:8px;overflow:auto;padding:10px max(24px,calc((100vw - 1660px)/2));background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;box-shadow:0 2px 10px rgba(31,51,73,.03)}
nav button{background:transparent;color:#475467;white-space:nowrap;box-shadow:none;padding:9px 14px}
nav button.active{background:#eaf3ff;color:var(--b);box-shadow:inset 0 0 0 1px #d3e5ff}
main{width:min(1660px,calc(100% - 48px));margin:24px auto;padding:0 0 60px}
.tab{display:none}.tab.active{display:block}
h2{font-size:22px;margin:18px 0 14px;letter-spacing:.1px}#home>.notice+h2{margin-top:16px}
h3{margin:0 0 8px;font-size:18px}
label{display:block;color:#344054;font-weight:650}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.card b{display:block;font-size:28px;margin:7px 0 4px;line-height:1.15}
.card small{font-size:12px}.card.priority-1{border-color:#f3b4b4;background:linear-gradient(180deg,#fff,#fff8f8)}.card.priority-2{border-color:#ffd3a1;background:linear-gradient(180deg,#fff,#fffaf4)}.card.priority-3{border-color:#cfe0f6;background:linear-gradient(180deg,#fff,#f8fbff)}.card .rank{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:#eef3f8;color:#475467;font-size:11px;font-weight:800;margin-bottom:7px}.card.priority-1 .rank{background:#fee4e2;color:#b42318}.card.priority-2 .rank{background:#ffead5;color:#b54708}
.muted{color:var(--m)}.good{color:var(--g)}.bad{color:var(--r)}.warn{color:var(--o)}
.notice{background:#fff8ed;border:1px solid #f7d9ad;color:#92400e;padding:15px 17px;border-radius:12px;line-height:1.65;box-shadow:0 4px 14px rgba(146,64,14,.04)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.summary .panel ul{margin:10px 0 0;padding-left:20px}
table{width:100%;border-collapse:collapse}
th{background:#f7f9fc;color:#475467;font-weight:700}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}
tbody tr:hover{background:#fafcff}
.scroll{overflow:auto}
.list{display:grid;gap:10px}
.item{display:flex;justify-content:space-between;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:0 4px 14px rgba(31,51,73,.04)}
canvas{max-height:500px;min-height:360px}
.pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#eef3f8;color:#475467;font-size:13px}
.msg{margin-top:8px;white-space:pre-wrap;color:var(--m);font-size:13px}.guest-only{display:none}.guest-mode .admin-only{display:none!important}.guest-mode .guest-only{display:inline-flex}.guest-badge{padding:6px 10px;border-radius:999px;background:#eaf3ff;color:#155eef;font-size:12px;font-weight:700}

/* 上传页桌面端改为双栏，充分利用宽屏 */
#upload.active{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:18px;align-items:start}
#upload.active>h2{grid-column:1/-1;margin-bottom:-2px}
#upload>.panel{min-height:100%}
#upload>.panel:first-of-type{background:linear-gradient(180deg,#fff 0,#fbfdff 100%)}
#upload>.panel:nth-of-type(2){background:linear-gradient(180deg,#fff 0,#fafcff 100%)}
#upload #uploadBtn{min-width:150px}
#ocrText{min-height:230px}

/* 录入页、趋势页、历史页保持更宽但不空 */
#entry .panel,#trend .panel,#history .list,#backup .panel{width:100%}

@media(max-width:1200px){
  main{width:min(1180px,calc(100% - 32px))}
  header,nav{padding-left:16px;padding-right:16px}
  .cards,.summary{grid-template-columns:repeat(2,minmax(0,1fr))}
  #upload.active{grid-template-columns:1fr}
  #upload.active>h2{grid-column:auto}
}
@media(max-width:760px){
  body{font-size:14px}
  header{align-items:flex-start;flex-direction:column;padding:16px}
  header h1{font-size:21px}
  nav{padding:8px 10px}
  nav button{padding:8px 11px}
  main{width:calc(100% - 20px);margin:16px auto;padding-bottom:40px}
  .grid{grid-template-columns:1fr}
  .summary{grid-template-columns:1fr}
  .cards{grid-template-columns:1fr 1fr;gap:10px}
  .panel{padding:16px}
  .item{align-items:flex-start;flex-direction:column}
  canvas{min-height:300px}
}
@media(max-width:480px){.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="auth" class="auth hidden">
  <div class="box">
    <h1>管理员登录</h1><p class="muted">仅用于上传、录入和管理数据。查看病情趋势不需要密码。</p>
    <input id="email" type="email" placeholder="邮箱">
    <input id="password" type="password" placeholder="密码">
    <div class="row"><button id="login">登录</button><button id="cancelLogin" class="alt">返回公开查看</button></div>
    <div id="authmsg" class="msg"></div>
  </div>
</div>

<div id="app" class="guest-mode">
<header><div><h1>老人病情监测</h1><small>按真实采样时间记录 · 仅供趋势整理，不能替代主管医生/ICU决策</small></div><div class="row"><span class="guest-only guest-badge">公开只读</span><span id="who" class="admin-only"></span><button id="adminLoginBtn" class="alt guest-only">管理员登录</button><button id="logout" class="alt admin-only">退出</button></div></header>
<nav>
<button class="active" data-tab="home">总览</button><button class="admin-only" data-tab="upload">上传报告</button><button class="admin-only" data-tab="entry">录入/导入</button><button data-tab="trend">趋势</button><button class="admin-only" data-tab="history">历史报告</button><button class="admin-only" data-tab="backup">备份</button>
</nav>
<main>
<section id="home" class="tab active">
<div class="notice">若出现意识突然恶化、抽搐、明显出血、血压持续下降、呼吸困难或尿量显著减少，请立即联系主管医生/护士。本网页不用于急救决策。</div>
<h2>今日变化</h2><div id="summary" class="summary"></div>
<h2>重点指标</h2><div id="cards" class="cards"></div>
<h2>全部指标参考范围</h2>
<div class="panel scroll"><table><thead><tr><th>系统</th><th>指标</th><th>正常/参考范围</th><th>单位</th></tr></thead><tbody id="rangeTable"></tbody></table></div>
</section>

<section id="upload" class="tab">
<h2>上传报告</h2><div class="panel">
<label>采样时间（北京时间/医院时间）</label><input id="reportTime" type="datetime-local">
<label>图片/PDF</label><input id="reportFiles" type="file" multiple accept="image/jpeg,image/png,image/webp,application/pdf">
<label>备注</label><textarea id="reportNotes" rows="3"></textarea>
<button id="uploadBtn">上传到私人云端</button><div id="uploadMsg" class="msg"></div>
</div>
<div class="panel">
<h3>免费本地OCR（实验）</h3><p class="muted">只在当前浏览器识别图片；识别可能出错，必须人工确认后保存。</p>
<input id="ocrFile" type="file" accept="image/jpeg,image/png,image/webp"><button id="ocrBtn" class="alt">识别图片文字</button>
<div id="ocrMsg" class="msg"></div><textarea id="ocrText" rows="9" placeholder="识别文字"></textarea>
<button id="parseOcr" class="alt">提取已知指标</button><div id="ocrRows"></div>
</div>
</section>

<section id="entry" class="tab">
<h2>手动录入</h2><div class="panel grid">
<label>采样时间（北京时间/医院时间）<input id="entryTime" type="datetime-local"></label>
<label>指标<select id="metric"></select></label>
<label>结果<input id="value" type="number" step="any"></label>
<label>单位<input id="unit"></label>
<label>参考下限<input id="low" type="number" step="any"></label>
<label>参考上限<input id="high" type="number" step="any"></label>
<div><button id="save">保存</button><div id="entryMsg" class="msg"></div></div>
</div>
<h2>导入 Excel / CSV</h2><div class="panel"><input id="sheet" type="file" accept=".xlsx,.xls,.csv"><button id="importBtn" class="alt">导入</button><div id="importMsg" class="msg"></div></div>
</section>

<section id="trend" class="tab"><h2>趋势曲线</h2><div class="panel"><div class="row"><select id="trendMetric" style="max-width:340px"></select><span id="dir" class="pill"></span></div><canvas id="chart"></canvas><div id="trendInfo" class="msg"></div></div></section>
<section id="history" class="tab"><h2>历史报告</h2><div id="reportList" class="list"></div></section>
<section id="backup" class="tab"><h2>备份导出</h2><div class="panel row"><button id="xlsx">导出Excel</button><button id="csv" class="alt">导出CSV</button><button id="json" class="alt">导出JSON</button></div></section>
</main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const SUPA_URL='https://wmfnogyqnhdtpnuiccxg.supabase.co';
const KEY='sb_publishable_ADg1T3wRRCk7bicq1uiFMQ_2M7fDWFr';
const db=supabase.createClient(SUPA_URL,KEY);
let sess=null,defs=[],vals=[],reps=[],graph=null,ocr=[];
const e=id=>document.getElementById(id), safe=x=>String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtChina=iso=>iso?new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date(iso)):'—';
const chinaIso=s=>s?new Date((String(s).length===16?String(s)+':00':String(s))+'+08:00').toISOString():null;
const inputTime=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date()).replace(' ','T');
const refLabel=(m,z)=>{let lo=z&&z.ref_low!=null?Number(z.ref_low):(m.ref_low!=null?Number(m.ref_low):null),hi=z&&z.ref_high!=null?Number(z.ref_high):(m.ref_high!=null?Number(m.ref_high):null);if(lo!=null&&hi!=null)return lo+' ～ '+hi;if(hi!=null)return '≤ '+hi;if(lo!=null)return '≥ '+lo;return '以报告为准'};
const stateR=(m,z)=>{let v=Number(z.value),lo=z.ref_low!=null?Number(z.ref_low):(m.ref_low!=null?Number(m.ref_low):null),hi=z.ref_high!=null?Number(z.ref_high):(m.ref_high!=null?Number(m.ref_high):null);if(lo!=null&&v<lo)return'低于参考';if(hi!=null&&v>hi)return'高于参考';return'参考范围内'};
e('reportTime').value=inputTime();e('entryTime').value=inputTime();

async function start(){let x=await db.auth.getSession();sess=x.data.session;show();db.auth.onAuthStateChange(function(_x,s){sess=s;show()})}
function show(){
  e('auth').classList.add('hidden');
  e('app').classList.remove('hidden');
  e('app').classList.toggle('guest-mode',!sess);
  e('who').textContent=sess?(sess.user.email||'管理员'):'';
  load()
}
e('adminLoginBtn').onclick=()=>{e('auth').classList.remove('hidden');e('app').classList.add('hidden');e('authmsg').textContent=''};
e('cancelLogin').onclick=()=>{e('auth').classList.add('hidden');e('app').classList.remove('hidden')};
e('login').onclick=async()=>{e('authmsg').textContent='登录中…';let r=await db.auth.signInWithPassword({email:e('email').value.trim(),password:e('password').value});e('authmsg').textContent=r.error?(r.error.message==='Invalid login credentials'?'邮箱或密码不正确。公开查看无需登录。':r.error.message):''};
e('logout').onclick=async()=>{await db.auth.signOut();document.querySelector('[data-tab="home"]').click()};

document.querySelectorAll('nav button').forEach(function(b){b.onclick=function(){document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));e(b.dataset.tab).classList.add('active');if(b.dataset.tab==='trend')draw();if(b.dataset.tab==='history')reportList()}});

async function load(){
 let tasks=[db.from('metric_definitions').select('*').order('system_group').order('name'),db.from('results').select('*').order('collected_at')];
 if(sess)tasks.push(db.from('reports').select('*').order('collected_at',{ascending:false}));
 let a=await Promise.all(tasks);
 if(a[0].error||a[1].error)return;
 defs=a[0].data||[];vals=a[1].data||[];reps=sess&&a[2]&&!a[2].error?(a[2].data||[]):[];
 let op=defs.map(m=>'<option value="'+safe(m.code)+'">'+safe(m.name)+' ('+safe(m.code)+')</option>').join('');
 e('metric').innerHTML=op;e('trendMetric').innerHTML=op;e('metric').onchange=sync;e('trendMetric').onchange=draw;sync();home();if(sess)reportList();draw()
}
function sync(){let m=defs.find(x=>x.code===e('metric').value);if(!m)return;e('unit').value=m.unit||'';e('low').value=m.ref_low==null?'':m.ref_low;e('high').value=m.ref_high==null?'':m.ref_high}
function series(code){return vals.filter(x=>x.metric_code===code).sort((a,b)=>new Date(a.collected_at)-new Date(b.collected_at))}
function dist(m,v){let lo=Number(m.ref_low),hi=Number(m.ref_high);if(Number.isFinite(lo)&&v<lo)return lo-v;if(Number.isFinite(hi)&&v>hi)return v-hi;return 0}
function assess(m,a,b){if(a==null)return ['暂无对比','muted'];a=Number(a);b=Number(b);if(a===b)return ['基本持平','muted'];if(m.direction==='down')return b<a?['方向改善','good']:['方向不利','bad'];if(m.direction==='up')return b>a?['方向改善','good']:['方向不利','bad'];let da=dist(m,a),dbb=dist(m,b);return dbb<da?['更接近正常','good']:dbb>da?['偏离正常','bad']:['基本持平','muted']}
function state(m,v){let lo=Number(m.ref_low),hi=Number(m.ref_high);if(Number.isFinite(lo)&&v<lo)return'低于参考';if(Number.isFinite(hi)&&v>hi)return'高于参考';return'参考范围内'}
function home(){
 const priority=['PLT','WBC','PCT','CREA','CRP','LAC','TBIL','NTPROBNP'];
 const priorityLabel={PLT:'1',WBC:'2',PCT:'3',CREA:'4',CRP:'5',LAC:'6',TBIL:'7',NTPROBNP:'8'};
 const level={PLT:1,WBC:1,PCT:1,CREA:2,CRP:2,LAC:3,TBIL:3,NTPROBNP:2};
 let good=[],bad=[],risk=[];
 e('cards').innerHTML=priority.map(function(k){
   let m=defs.find(x=>x.code===k),s=series(k);if(!m||!s.length)return'';
   let z=s[s.length-1],p=s.length>1?s[s.length-2]:null,a=assess(m,p&&p.value,z.value),lv=level[k]||3;
   return '<div class="card priority-'+lv+'"><span class="rank">优先 '+priorityLabel[k]+'</span><span class="muted">'+safe(m.name)+'</span><b>'+safe(z.value)+' <small>'+safe(z.unit||m.unit||'')+'</small></b><span class="'+a[1]+'">'+a[0]+'</span><br><small class="muted">'+stateR(m,z)+' · 参考范围：'+safe(refLabel(m,z))+' '+safe(z.unit||m.unit||'')+'</small></div>'
 }).join('');
 defs.forEach(function(m){
   let s=series(m.code);if(!s.length)return;
   let z=s[s.length-1],p=s.length>1?s[s.length-2]:null,a=assess(m,p&&p.value,z.value);
   if(a[1]==='good')good.push(m.name);
   if(a[1]==='bad')bad.push(m.name);
   if(stateR(m,z)!=='参考范围内')risk.push(m.name)
 });
 const priorityNames=priority.map(k=>{let m=defs.find(x=>x.code===k),s=series(k);return m&&s.length&&stateR(m,s[s.length-1])!=='参考范围内'?m.name:null}).filter(Boolean);
 const otherRisk=risk.filter(x=>!priorityNames.includes(x));
 function list(title,arr,cls){
   return '<div class="panel"><b class="'+cls+'">'+title+'</b><ul>'+(arr.length?arr.slice(0,10).map(x=>'<li>'+safe(x)+'</li>').join(''):'<li>暂无</li>')+'</ul></div>'
 }
 e('summary').innerHTML=
   list('重点关注（优先）',priorityNames,'warn')+
   list('趋势不利',bad,'bad')+
   list('趋势改善',good,'good')+
   list('其他异常',otherRisk,'warn');
 e('rangeTable').innerHTML=defs.map(function(m){
   let s=series(m.code),z=s.length?s[s.length-1]:null;
   return '<tr><td>'+safe(m.system_group)+'</td><td>'+safe(m.name)+' <span class="muted">('+safe(m.code)+')</span></td><td>'+safe(refLabel(m,z))+'</td><td>'+safe((z&&z.unit)||m.unit||'')+'</td></tr>'
 }).join('')
}
e('save').onclick=async function(){if(!sess){alert('公开查看模式不能修改数据，请管理员登录');return;}let m=defs.find(x=>x.code===e('metric').value),v=Number(e('value').value),t=e('entryTime').value;if(!m||!t||!Number.isFinite(v)){e('entryMsg').textContent='请填写有效时间和数值';return}let row={user_id:sess.user.id,collected_at:chinaIso(t),metric_code:m.code,metric_name:m.name,system_group:m.system_group,value:v,unit:e('unit').value||m.unit,ref_low:e('low').value===''?m.ref_low:Number(e('low').value),ref_high:e('high').value===''?m.ref_high:Number(e('high').value),direction:m.direction};let r=await db.from('results').insert(row);e('entryMsg').textContent=r.error?r.error.message:'已保存';if(!r.error){e('value').value='';await load()}};

e('uploadBtn').onclick=async function(){if(!sess){alert('公开查看模式不能上传报告，请管理员登录');return;}let fs=[...e('reportFiles').files],t=e('reportTime').value;if(!fs.length){e('uploadMsg').textContent='请选择文件';return}e('uploadBtn').disabled=true;e('uploadMsg').textContent='上传中…';try{for(let f of fs){let name=f.name.replace(/[^a-zA-Z0-9._-]/g,'_'),path=sess.user.id+'/'+Date.now()+'-'+crypto.randomUUID()+'-'+name;let u=await db.storage.from('medical-reports').upload(path,f);if(u.error)throw u.error;let r=await db.from('reports').insert({user_id:sess.user.id,collected_at:t?chinaIso(t):null,report_date:t?t.slice(0,10):null,file_name:f.name,file_path:path,notes:e('reportNotes').value});if(r.error)throw r.error}e('uploadMsg').textContent='上传完成';e('reportFiles').value='';await load()}catch(err){e('uploadMsg').textContent=err.message||String(err)}finally{e('uploadBtn').disabled=false}};
async function reportList(){if(!reps.length){e('reportList').innerHTML='<div class="panel">暂无报告</div>';return}e('reportList').innerHTML=reps.map(r=>'<div class="item"><div><b>'+safe(r.file_name||'报告')+'</b><div class="muted">'+fmtChina(r.collected_at||r.created_at)+(r.notes?' · '+safe(r.notes):'')+'</div></div>'+(r.file_path?'<button class="alt" data-p="'+safe(r.file_path)+'">查看原图</button>':'<span class="pill">历史数据已导入</span>')+'</div>').join('');e('reportList').querySelectorAll('button[data-p]').forEach(function(b){b.onclick=async function(){let x=await db.storage.from('medical-reports').createSignedUrl(b.dataset.p,300);if(x.error)return alert(x.error.message);window.open(x.data.signedUrl,'_blank')}})}

function draw(){if(!defs.length)return;let k=e('trendMetric').value||defs[0].code,m=defs.find(x=>x.code===k),s=series(k);e('dir').textContent=m.direction==='down'?'通常下降为好':m.direction==='up'?'通常上升为好':'回到参考范围最好';let z=s.length?s[s.length-1]:null,lo=z&&z.ref_low!=null?Number(z.ref_low):(m.ref_low!=null?Number(m.ref_low):null),hi=z&&z.ref_high!=null?Number(z.ref_high):(m.ref_high!=null?Number(m.ref_high):null),ds=[{label:m.name+(m.unit?' ('+m.unit+')':''),data:s.map(x=>Number(x.value)),tension:.25,borderWidth:3}];if(lo!=null)ds.push({label:'参考下限 '+lo,data:s.map(()=>lo),borderDash:[6,6],pointRadius:0,borderWidth:1});if(hi!=null)ds.push({label:'参考上限 '+hi,data:s.map(()=>hi),borderDash:[6,6],pointRadius:0,borderWidth:1});if(graph)graph.destroy();graph=new Chart(e('chart'),{type:'line',data:{labels:s.map(x=>fmtChina(x.collected_at)),datasets:ds},options:{responsive:true,maintainAspectRatio:false}});if(s.length){let p=s.length>1?s[s.length-2]:null,a=assess(m,p&&p.value,z.value);e('trendInfo').innerHTML='最新：<b>'+z.value+'</b> '+safe(z.unit||m.unit||'')+' · '+stateR(m,z)+' · 参考范围：<b>'+safe(refLabel(m,z))+' '+safe(z.unit||m.unit||'')+'</b> · <span class="'+a[1]+'">'+a[0]+'</span>'}else e('trendInfo').textContent='暂无数据'}

e('importBtn').onclick=async function(){if(!sess){alert('公开查看模式不能导入数据，请管理员登录');return;}let f=e('sheet').files[0];if(!f){e('importMsg').textContent='请选择文件';return}e('importMsg').textContent='读取中…';try{let wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true}),sn=wb.SheetNames.includes('全部指标')?'全部指标':wb.SheetNames[0],arr=XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:''}),out=[];for(let row of arr){let tm=row['采样时间']||row['时间']||row['日期时间']||row['date'],mt=String(row['指标']||row['项目']||row['metric']||'').trim(),v=Number(row['结果']||row['数值']||row['value']);if(!tm||!mt||!Number.isFinite(v))continue;let m=defs.find(x=>x.code.toLowerCase()===mt.toLowerCase()||x.name===mt||mt.includes(x.code)||mt.includes(x.name));if(!m)continue;let iso=tm instanceof Date?tm.toISOString():chinaIso(String(tm).replace(' ','T').slice(0,16));if(!iso)continue;out.push({user_id:sess.user.id,collected_at:iso,metric_code:m.code,metric_name:m.name,system_group:m.system_group,value:v,unit:row['单位']||m.unit,ref_low:m.ref_low,ref_high:m.ref_high,direction:m.direction})}if(!out.length)throw new Error('没有识别到可导入的指标');for(let i=0;i<out.length;i+=150){let r=await db.from('results').insert(out.slice(i,i+150));if(r.error)throw r.error}e('importMsg').textContent='已导入 '+out.length+' 条';await load()}catch(err){e('importMsg').textContent='导入失败：'+(err.message||err)}};

e('ocrBtn').onclick=async function(){let f=e('ocrFile').files[0];if(!f){e('ocrMsg').textContent='请选择图片';return}e('ocrBtn').disabled=true;e('ocrMsg').textContent='加载OCR模型中…';try{let r=await Tesseract.recognize(f,'chi_sim+eng',{logger:function(m){if(m.progress!=null)e('ocrMsg').textContent=(m.status||'识别中')+' '+Math.round(m.progress*100)+'%'}});e('ocrText').value=r.data.text||'';e('ocrMsg').textContent='识别完成，请人工校对'}catch(err){e('ocrMsg').textContent='OCR失败：'+(err.message||err)}finally{e('ocrBtn').disabled=false}};
function regEsc(s){return String(s).replace(/[.*+?^{}()|[\]\\$]/g,'\\$&')}
e('parseOcr').onclick=function(){let tx=e('ocrText').value;ocr=[];defs.forEach(function(m){for(let a of [m.code,m.name]){let rx=new RegExp(regEsc(a)+'[^0-9-]{0,18}(-?[0-9]+(?:\\\\.[0-9]+)?)','i'),z=tx.match(rx);if(z){ocr.push({m:m,value:Number(z[1])});break}}});renderOcr()};
function renderOcr(){if(!ocr.length){e('ocrRows').innerHTML='<p class="muted">没有自动提取到已知指标，请手动录入。</p>';return}e('ocrRows').innerHTML='<div class="scroll"><table><tr><th>指标</th><th>识别值</th><th>单位</th></tr>'+ocr.map((x,i)=>'<tr><td>'+safe(x.m.name)+'</td><td><input data-i="'+i+'" type="number" step="any" value="'+x.value+'"></td><td>'+safe(x.m.unit||'')+'</td></tr>').join('')+'</table></div><button id="saveOcr">确认无误并保存</button>';e('ocrRows').querySelectorAll('input[data-i]').forEach(function(x){x.oninput=function(){ocr[Number(x.dataset.i)].value=Number(x.value)}});e('saveOcr').onclick=async function(){let t=e('reportTime').value||inputTime(),p=ocr.filter(x=>Number.isFinite(x.value)).map(x=>({user_id:sess.user.id,collected_at:chinaIso(t),metric_code:x.m.code,metric_name:x.m.name,system_group:x.m.system_group,value:x.value,unit:x.m.unit,ref_low:x.m.ref_low,ref_high:x.m.ref_high,direction:x.m.direction}));let r=await db.from('results').insert(p);if(r.error)return alert(r.error.message);alert('已保存 '+p.length+' 条经人工确认的数据');ocr=[];renderOcr();await load()}}

function exportRows(){return vals.map(r=>({'采样时间':r.collected_at,'系统':r.system_group,'指标':r.metric_name,'代码':r.metric_code,'结果':r.value,'单位':r.unit,'参考下限':r.ref_low,'参考上限':r.ref_high,'方向':r.direction}))}
e('xlsx').onclick=function(){let w=XLSX.utils.book_new();XLSX.utils.book_append_sheet(w,XLSX.utils.json_to_sheet(exportRows()),'全部指标');XLSX.writeFile(w,'病情趋势备份.xlsx')};
e('csv').onclick=function(){let ws=XLSX.utils.json_to_sheet(exportRows());dl('病情趋势备份.csv','\\ufeff'+XLSX.utils.sheet_to_csv(ws),'text/csv')};
e('json').onclick=function(){dl('病情趋势备份.json',JSON.stringify({results:vals,reports:reps},null,2),'application/json')};
function dl(n,c,t){let a=document.createElement('a');a.href=window.URL.createObjectURL(new Blob([c],{type:t}));a.download=n;a.click();setTimeout(()=>window.URL.revokeObjectURL(a.href),800)}
start();
</script>
</body></html>
