<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Amazon Supply Workbench</title>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--nav:#0f172a;--nav2:#1e293b;--line:#e5e7eb;--text:#0f172a;--muted:#64748b;--blue:#2563eb;--blue2:#dbeafe;--red:#dc2626;--green:#059669;--amber:#d97706}
*{box-sizing:border-box}body{margin:0;font-family:Inter,"Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.app{display:flex;min-height:100vh}.side{width:240px;background:linear-gradient(180deg,#0b1220,#111827);color:#cbd5e1;position:fixed;inset:0 auto 0 0;padding:18px 14px;overflow:auto}.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 18px;border-bottom:1px solid #223049}.brandmark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#4f46e5,#2563eb);display:grid;place-items:center;color:#fff;font-weight:900}.brand b{display:block;color:#fff;font-size:15px}.brand span{font-size:11px;color:#8191aa}.navsec{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#607089;margin:18px 10px 6px}.nav button{width:100%;border:0;background:transparent;color:#aebbd0;display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:9px;text-align:left;cursor:pointer;margin:2px 0}.nav button:hover{background:#17233a;color:#fff}.nav button.on{background:#2457d6;color:#fff;box-shadow:0 8px 20px #2457d633}.ico{width:18px;text-align:center}.main{margin-left:240px;width:calc(100% - 240px)}header{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:10}.crumb b{display:block}.crumb span{font-size:11px;color:var(--muted)}.top-actions{display:flex;gap:8px}.content{padding:22px;max-width:1600px;margin:auto}.title{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:16px}.title h1{font-size:22px;margin:0}.title p{margin:4px 0 0;color:var(--muted);font-size:12px}.btn{border:1px solid #dbe1ea;background:#fff;color:#334155;border-radius:8px;padding:9px 12px;cursor:pointer}.btn:hover{background:#f8fafc}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.danger{color:var(--red);border-color:#fecaca;background:#fff}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}.card span{font-size:11px;color:var(--muted)}.card b{display:block;font-size:25px;margin-top:5px}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px}.ph{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 16px}.row{display:flex;align-items:center;gap:12px;min-width:0}.thumb{width:54px;height:54px;object-fit:cover;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:9px}.tag{display:inline-flex;padding:3px 7px;border-radius:999px;background:#eef2ff;color:#4338ca;font-size:11px}.muted{color:var(--muted)}.small{font-size:11px}.toolbar{display:flex;gap:8px;margin-bottom:12px}.field{border:1px solid #dbe1ea;border-radius:8px;padding:9px 10px;background:#fff;min-width:0}.toolbar .field{flex:1}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:900px}.table th,.table td{padding:10px 12px;border-top:1px solid #edf1f5;font-size:12px;text-align:left}.table th{background:#f8fafc;color:#475569;font-weight:700}.link{border:0;background:transparent;color:#2563eb;cursor:pointer;padding:2px 4px}.link.red{color:var(--red)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.inventory-model{background:#fff;border:1px solid var(--line);border-radius:13px;overflow:hidden;margin-bottom:12px}.inventory-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}.inventory-colors{display:grid;grid-template-columns:repeat(2,1fr)}.color-card{display:grid;grid-template-columns:110px 1fr;border-right:1px solid #edf1f5;border-bottom:1px solid #edf1f5}.color-side{padding:12px;background:#fbfdff;text-align:center}.color-side img{width:72px;height:72px;object-fit:contain;border-radius:8px;background:#fff;border:1px solid #e2e8f0}.size-list{padding:8px 12px}.size-row{display:grid;grid-template-columns:55px 1fr 45px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dashed #edf1f5}.size-row strong{text-align:right}.status{font-size:11px;padding:3px 7px;border-radius:999px}.ok{background:#ecfdf3;color:#047857}.warn{background:#fff7ed;color:#c2410c}.bad{background:#fef2f2;color:#b91c1c}.modalback{position:fixed;inset:0;background:#0f172a88;display:none;align-items:center;justify-content:center;z-index:50;padding:20px}.modalback.open{display:flex}.modal{background:#fff;width:min(920px,96vw);max-height:92vh;overflow:auto;border-radius:14px;box-shadow:0 25px 60px #0004}.modalhead{display:flex;justify-content:space-between;align-items:center;padding:15px 18px;border-bottom:1px solid var(--line)}.modalbody{padding:18px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form label{font-size:12px;color:#475569}.form input,.form select,.form textarea{width:100%;margin-top:5px}.full{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.empty{text-align:center;padding:60px 20px;color:#94a3b8}.toast{position:fixed;right:18px;bottom:18px;background:#111827;color:#fff;border-radius:9px;padding:11px 14px;display:none;z-index:70}.toast.show{display:block}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.quick button{padding:16px;border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer;text-align:left}.quick b,.quick span{display:block}.quick span{font-size:11px;color:var(--muted);margin-top:4px}.kpi-link{cursor:pointer}.kpi-link:hover{border-color:#b8c7e6}
@media(max-width:1100px){.cards{grid-template-columns:repeat(2,1fr)}.inventory-colors{grid-template-columns:1fr}.quick{grid-template-columns:repeat(2,1fr)}}@media(max-width:800px){.side{display:none}.main{margin-left:0;width:100%}.content{padding:14px}.grid2,.form{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}.quick{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand"><div class="brandmark">AS</div><div><b>Amazon Supply</b><span>供应链工作台 · Cloudflare</span></div></div>
  <div class="nav" id="nav"></div>
</aside>
<main class="main">
  <header><div class="crumb"><b id="pageTitle">经营总览</b><span>Cloudflare D1 + Workers KV</span></div><div class="top-actions"><button class="btn" onclick="refresh()">刷新</button><button class="btn primary" onclick="quick()">＋ 新建</button></div></header>
  <div class="content" id="root"></div>
</main>
</div>
<div class="modalback" id="mb"><div class="modal"><div class="modalhead"><b id="mt"></b><button class="btn" onclick="closeModal()">关闭</button></div><div class="modalbody" id="mc"></div></div></div>
<div class="toast" id="toast"></div>
<script>
const API='/api';
const nav=document.getElementById('nav'), root=document.getElementById('root'), pageTitle=document.getElementById('pageTitle'),
      mb=document.getElementById('mb'), mt=document.getElementById('mt'), mc=document.getElementById('mc'), toast=document.getElementById('toast');
let route=location.hash.slice(1)||'dashboard', cache={products:[],inventory:[],suppliers:[],purchase_orders:[],materials:[],production_orders:[],outbound_orders:[],ledger:[]};
const navs=[['dashboard','经营总览','总览','⌂'],['products','商品 / ASIN','基础资料','◫'],['suppliers','供应商','基础资料','▥'],['purchase','货物采购','采购与生产','🛒'],['materials','辅料 / 包材','采购与生产','▤'],['production','生产进度','采购与生产','▣'],['inventory','库存中心','库存与物流','⌂'],['outbound','出库单','库存与物流','⇥'],['ledger','库存流水','库存与物流','▧'],['inventoryReports','库存报告','库存与物流','⇩']];
const validRoutes=new Set(navs.map(x=>x[0]));
function normalizeCache(x){
  const base={products:[],inventory:[],suppliers:[],purchase_orders:[],materials:[],production_orders:[],outbound_orders:[],ledger:[]};
  x=(x&&typeof x==='object')?x:{};
  for(const k of Object.keys(base))base[k]=Array.isArray(x[k])?x[k]:[];
  const cleanUrl=v=>typeof v==='string'&&v.startsWith('blob:')?'':v;
  base.products=base.products.map(p=>({...p,image_url:cleanUrl(p.image_url),parent_image_url:cleanUrl(p.parent_image_url),resolved_image_url:cleanUrl(p.resolved_image_url),resolved_parent_image_url:cleanUrl(p.resolved_parent_image_url)}));
  base.materials=base.materials.map(m=>({...m,image_url:cleanUrl(m.image_url),resolved_image_url:cleanUrl(m.resolved_image_url)}));
  return base
}
function persistCache(){
  try{
    const safe=normalizeCache(cache);
    sessionStorage.setItem('asw_bootstrap',JSON.stringify(safe))
  }catch(e){}
}
function normalizeRoute(r){return validRoutes.has(r)?r:'dashboard'}
route=normalizeRoute(route);
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function money(v){return '¥'+Number(v||0).toFixed(2)}
function sizeRank(s){return ({S:1,M:2,L:3,XL:4,'2XL':5,'3XL':6,'4XL':7})[s]||99}
function model(p){return String(p.internal_code||'').split('-')[0]||''}
const PARENT_SKU_BY_ASIN={
  'B08BWZRMYJ':'YRELIEF-CCS01-2006',
  'B0927KVX9K':'YSF-BCCS02-2104',
  'B0D45D9TWK':'BS-SHEER5001-BABA'
};
function parentSkuOf(parent,rows=[]){return rows.find(x=>String(x.parent_sku||'').trim())?.parent_sku||PARENT_SKU_BY_ASIN[parent]||'-'}
function toastMsg(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)}
async function api(path,opt={}){
  const method=String(opt.method||'GET').toUpperCase(), attempts=method==='GET'?2:1;
  let last;
  for(let i=0;i<attempts;i++){
    try{
      const r=await fetch(API+path,{headers:{'content-type':'application/json'},...opt});
      const j=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(j.error||'请求失败');
      return j
    }catch(e){last=e;if(i+1<attempts)await new Promise(res=>setTimeout(res,250))}
  }
  throw last||new Error('请求失败')
}
function renderNav(){let last='';nav.innerHTML=navs.map(n=>{let s='';if(n[2]!=last){last=n[2];s='<div class="navsec">'+last+'</div>'}return s+'<button class="'+(route===n[0]?'on':'')+'" onclick="go(\''+n[0]+'\')"><span class="ico">'+n[3]+'</span>'+n[1]+'</button>'}).join('')}
function go(r){route=normalizeRoute(r);location.hash=route;render()}
window.onhashchange=()=>{route=normalizeRoute(location.hash.slice(1)||'dashboard');render()}
async function refresh(){try{await load(true);render();toastMsg('已同步')}catch(e){toastMsg('同步失败，已保留当前页面数据')}}
async function load(force=false){
  if(!force){
    try{
      const saved=sessionStorage.getItem('asw_bootstrap');
      if(saved){cache=normalizeCache(JSON.parse(saved));render()}
    }catch(e){try{sessionStorage.removeItem('asw_bootstrap')}catch(_){}}
  }
  try{
    cache=normalizeCache(await api('/bootstrap'));
    persistCache()
  }catch(e){
    if(!cache.products.length&&!cache.materials.length&&!cache.suppliers.length)throw e
  }
}
function card(t,v,r){return '<div class="card kpi-link" onclick="go(\''+r+'\')"><span>'+t+'</span><b>'+Number(v||0).toLocaleString()+'</b></div>'}
function render(){
  renderNav();
  route=normalizeRoute(route);
  pageTitle.textContent=navs.find(x=>x[0]===route)?.[1]||'经营总览';
  const view=views&&views[route];
  if(typeof view!=='function'){
    route='dashboard';
    if(location.hash!=='#dashboard')history.replaceState(null,'','#dashboard');
  }
  try{
    const fn=typeof views[route]==='function'?views[route]:views.dashboard;
    root.innerHTML=fn()
  }catch(e){
    try{root.innerHTML=views.dashboard()}catch(_){
      root.innerHTML='<div class="panel"><div class="empty">页面暂时无法显示，请点击右上角刷新。数据仍保存在云端。</div></div>'
    }
  }
}
function parentGroups(){const m=new Map();cache.products.forEach(p=>{const k=p.parent_asin||'未设置父ASIN';if(!m.has(k))m.set(k,[]);m.get(k).push(p)});return [...m].map(([parent,rows])=>({parent,rows:rows.sort((a,b)=>(a.color||'').localeCompare(b.color||'','zh-CN')||sizeRank(a.size)-sizeRank(b.size)),model:model(rows[0]),name:rows[0]?.product_name||''}))}
function inventoryQty(pid){return Number(cache.inventory.find(x=>x.product_id===pid)?.available_qty||0)}
function inventoryValueTotal(){
  return cache.products.reduce((sum,p)=>sum+inventoryQty(p.id)*Number(p.untaxed_price||0),0)
}
function inventoryValueCardHTML(){
  const v=inventoryValueTotal();
  return '<div class="card kpi-link" onclick="showInventoryValueBreakdown()"><span>国内库存总金额 / 库存货值</span><b style="font-size:22px">'+money(v)+'</b><div class="small muted" style="margin-top:6px">按当前SKU不含税采购价估算</div></div>'
}
function showInventoryValueBreakdown(){
  const groups={};
  cache.products.forEach(p=>{
    const m=model(p)||'未设置型号',qty=inventoryQty(p.id),value=qty*Number(p.untaxed_price||0);
    if(!groups[m])groups[m]={qty:0,value:0};
    groups[m].qty+=qty;groups[m].value+=value
  });
  const rows=Object.entries(groups).sort((a,b)=>b[1].value-a[1].value).map(([m,x])=>'<tr><td><b>'+esc(m)+'</b></td><td>'+Number(x.qty).toLocaleString()+' 双</td><td><b>'+money(x.value)+'</b></td></tr>').join('');
  openModal('国内库存货值','<div style="margin-bottom:10px;padding:10px 12px;background:#f8fafc;border-radius:9px;color:#475467;font-size:12px">库存货值 = 当前可用库存 × SKU不含税采购价。只计算国内现有可用库存，不含待入库数量。</div><div class="table"><table><thead><tr><th>型号</th><th>库存数量</th><th>库存货值</th></tr></thead><tbody>'+rows+'</tbody><tfoot><tr><td><b>合计</b></td><td><b>'+cache.inventory.reduce((s,x)=>s+Number(x.available_qty||0),0).toLocaleString()+' 双</b></td><td><b>'+money(inventoryValueTotal())+'</b></td></tr></tfoot></table></div>')
}
function inventoryRecord(pid){return cache.inventory.find(x=>x.product_id===pid)||{}}
function inventorySafety(pid){return Math.max(0,Number(inventoryRecord(pid).safety_stock||0))}
function inventoryAlertInfo(p){
  const qty=inventoryQty(p.id),safety=inventorySafety(p.id);
  if(qty<=0)return {low:true,label:safety>0?'缺货':'缺货 · 未设置预警',bg:'#fef2f2',color:'#b42318',priority:4};
  if(safety<=0)return {low:false,label:'未设置预警',bg:'#f8fafc',color:'#667085',priority:0};
  if(qty<=Math.max(1,Math.floor(safety*.5)))return {low:true,label:'严重预警',bg:'#fff1f0',color:'#b42318',priority:3};
  if(qty<=safety)return {low:true,label:'库存预警',bg:'#fff7ed',color:'#b54708',priority:2};
  if(qty<=Math.ceil(safety*1.25))return {low:false,label:'接近预警',bg:'#fffaeb',color:'#b54708',priority:1};
  return {low:false,label:'正常',bg:'#ecfdf3',color:'#067647',priority:0}
}
function lowStockRows(){
  return cache.products.map(p=>{
    const qty=inventoryQty(p.id),safety=inventorySafety(p.id),alert=inventoryAlertInfo(p);
    const suggested=safety>0?Math.max(0,Math.ceil(safety*2-qty)):null;
    return {p,qty,safety,alert,suggested}
  }).filter(x=>x.alert.low).sort((a,b)=>b.alert.priority-a.alert.priority||(b.safety-b.qty)-(a.safety-a.qty)||model(a.p).localeCompare(model(b.p),'zh-CN',{numeric:true}))
}
function lowStockCardHTML(){
  const n=lowStockRows().length;
  return '<div class="card kpi-link" onclick="showLowStockModal()" style="'+(n?'border-color:#fda29b;background:#fffafa':'')+'"><span>低库存SKU</span><b>'+n.toLocaleString()+'</b><div class="small" style="margin-top:6px;color:'+(n?'#b42318':'#667085')+'">'+(n?'点击查看预警与建议采购':'当前无低库存预警')+'</div></div>'
}
function inventoryAlertInline(p){
  const a=inventoryAlertInfo(p),safety=inventorySafety(p.id),qty=inventoryQty(p.id);
  if(!a.low&&a.label!=='接近预警')return '';
  const suggested=safety>0?Math.max(0,Math.ceil(safety*2-qty)):null;
  return '<span style="font-size:10px;padding:3px 6px;border-radius:999px;background:'+a.bg+';color:'+a.color+';white-space:nowrap">'+esc(a.label)+(suggested!==null&&suggested>0?' · 建议+'+suggested:'')+'</span>'
}
function showLowStockModal(){
  const rows=lowStockRows();
  if(!rows.length){
    openModal('低库存SKU / 库存预警','<div class="empty">当前没有低库存SKU。</div>');
    return
  }
  const body=rows.map(x=>{
    const p=x.p;
    const suggest=x.suggested===null?'<span class="muted">先设置安全库存</span>':'<b>'+Number(x.suggested).toLocaleString()+' 双</b>';
    return '<tr><td><b>'+esc(model(p))+'</b></td><td>'+esc(p.sku||'-')+'<div class="small muted">'+esc(p.child_asin||'')+'</div></td><td>'+esc(p.color||'-')+'</td><td>'+esc(p.size||'-')+'</td><td><b>'+x.qty.toLocaleString()+'</b> 双</td><td>'+x.safety.toLocaleString()+' 双</td><td><span style="font-size:11px;padding:4px 7px;border-radius:999px;background:'+x.alert.bg+';color:'+x.alert.color+'">'+esc(x.alert.label)+'</span></td><td>'+suggest+'</td><td style="white-space:nowrap"><button class="link" onclick="setSafetyStock(\''+p.id+'\')">设置预警</button><button class="link" onclick="closeModal();adjustStock(\''+p.id+'\')">调整库存</button></td></tr>'
  }).join('');
  openModal('低库存SKU / 库存预警','<div style="margin-bottom:12px;padding:10px 12px;border:1px solid #dbe5f0;border-radius:9px;background:#f8fafc;font-size:12px;color:#475467">预警规则：当前库存 ≤ 安全库存即进入预警；0库存直接标记缺货。<b>建议采购量 = 安全库存 × 2 − 当前库存</b>。未设置安全库存的SKU可直接在此设置。</div><div class="table" style="overflow:auto;max-height:62vh"><table><thead><tr><th>型号</th><th>SKU / ASIN</th><th>颜色</th><th>尺码</th><th>当前库存</th><th>安全库存</th><th>库存预警</th><th>建议采购数量</th><th>操作</th></tr></thead><tbody>'+body+'</tbody></table></div>')
}
function setSafetyStock(pid){
  const p=cache.products.find(x=>x.id===pid);
  if(!p)return;
  const current=inventorySafety(pid);
  openModal('设置库存预警','<form id="f" class="form"><div class="full" style="padding:10px 12px;background:#f8fafc;border-radius:9px"><b>'+esc(model(p)+' · '+(p.color||'')+' · '+(p.size||''))+'</b><div class="small muted">SKU：'+esc(p.sku||'-')+'　当前库存：'+inventoryQty(pid).toLocaleString()+' 双</div></div><label class="full">安全库存（双）<input class="field" type="number" min="0" step="1" name="safety_stock" value="'+current+'" required><span class="small muted">库存达到或低于此数值时触发预警；建议采购量会按“安全库存×2−当前库存”自动计算。</span></label><div class="actions full"><button type="button" class="btn" onclick="closeModal();showLowStockModal()">取消</button><button class="btn primary">保存预警</button></div></form>');
  f.onsubmit=async e=>{
    e.preventDefault();
    const safety=Math.max(0,Math.trunc(Number(new FormData(f).get('safety_stock')||0)));
    await api('/inventory/safety-stock',{method:'POST',body:JSON.stringify({product_id:pid,safety_stock:safety})});
    const inv=cache.inventory.find(x=>x.product_id===pid);
    if(inv)inv.safety_stock=safety;
    if(p)p.safety_stock=safety;
    persistCache();
    closeModal();
    render();
    toastMsg('库存预警已更新')
  }
}
function productionDaysRemaining(o){
  if(['生产完成','已入库'].includes(String(o.status||'')))return {text:o.status==='已入库'?'已入库':'已完成',tone:'done'};
  const raw=String(o.planned_finish_date||'').slice(0,10);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(raw))return {text:'未设置',tone:'muted'};
  const [y,m,d]=raw.split('-').map(Number),now=new Date();
  const today=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate());
  const target=Date.UTC(y,m-1,d);
  const days=Math.round((target-today)/86400000);
  if(days>0)return {text:days+'天',tone:days<=3?'warn':'normal'};
  if(days===0)return {text:'今天',tone:'warn'};
  return {text:'逾期'+Math.abs(days)+'天',tone:'late'}
}
function productionMaterialHTML(o){
  const rows=Array.isArray(o.material_requirements)?o.material_requirements:[];
  if(!rows.length)return '<span class="muted">无关联耗材</span>';
  const units=[...new Set(rows.map(x=>String(x.unit||'个')))];
  const total=rows.reduce((s,x)=>s+Number(x.consumed||0),0);
  const detail=rows.map(x=>'<div style="white-space:nowrap"><b>'+Number(x.consumed||0).toLocaleString()+'</b> '+esc(x.unit||'个')+' <span class="small muted">'+esc(x.name||x.material_code||'耗材')+'</span></div>').join('');
  return (units.length===1&&rows.length>1?'<div style="margin-bottom:3px"><b>合计 '+total.toLocaleString()+' '+esc(units[0])+'</b></div>':'')+detail
}
function productionTableHTML(){
  const rows=cache.production_orders||[];
  if(!rows.length)return '<div class="panel"><div class="empty">暂无生产单</div></div>';
  return '<div class="panel table"><table><thead><tr><th>生产单</th><th>采购单</th><th>供应商</th><th>数量</th><th>计划完成</th><th>生产完成剩余时间</th><th>预计耗材消耗</th><th>状态</th><th>操作</th></tr></thead><tbody>'+rows.map(o=>{

function smartImg(src,cls='thumb',style='',loading='lazy'){
  const s=String(src||'');
  const boxStart='<span style="display:inline-flex;align-items:center;justify-content:center;vertical-align:middle">';
  const ph='<span style="display:none;align-items:center;justify-content:center;width:52px;height:52px;min-width:42px;min-height:42px;border:1px dashed #cbd5e1;border-radius:7px;background:#f8fafc;color:#94a3b8;font-size:10px">暂无图片</span>';
  if(!s)return boxStart+ph.replace('display:none','display:flex')+'</span>';
  const eager=loading==='eager';
  return boxStart+'<img class="'+cls+'" style="'+style+'" src="'+esc(s)+'" loading="'+loading+'" decoding="'+(eager?'sync':'async')+'" fetchpriority="'+(eager?'high':'low')+'" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">'+ph+'</span>'
}

function bestColorImage(p){return p.resolved_image_url||p.image_url||cache.products.find(x=>x.parent_asin===p.parent_asin&&x.color===p.color&&(x.resolved_image_url||x.image_url))?.resolved_image_url||cache.products.find(x=>x.parent_asin===p.parent_asin&&x.color===p.color&&x.image_url)?.image_url||''}
function normalizeProductSearchTerms(v){
  return [...new Set(String(v||'').split(/[\\s,，;；]+/).map(x=>x.trim()).filter(Boolean).map(x=>x.toUpperCase()))]
}
function productMatchesSearch(p,term){
  const t=String(term||'').toUpperCase();
  if(!t)return false;
  const fields=[p.child_asin,p.sku,p.internal_code,p.product_name,p.color,p.size].map(x=>String(x||'').toUpperCase());
  return fields.some(x=>x===t||x.includes(t))
}
function productRowsForSearch(parent,terms=[]){
  const rows=cache.products.filter(p=>(p.parent_asin||'未设置父ASIN')===parent).sort((a,b)=>(a.color||'').localeCompare(b.color||'','zh-CN')||sizeRank(a.size)-sizeRank(b.size));
  if(!terms.length)return rows;
  const parentUpper=String(parent||'').toUpperCase(),parentSku=String(parentSkuOf(parent,rows)||'').toUpperCase(),modelUpper=String(model(rows[0]||{})||'').toUpperCase(),nameUpper=String(rows[0]?.product_name||'').toUpperCase();
  const wholeParent=terms.some(t=>t===parentUpper||t===parentSku||t===modelUpper||nameUpper.includes(t));
  if(wholeParent)return rows;
  return rows.filter(p=>terms.some(t=>productMatchesSearch(p,t)))
}
function productChildrenHTML(parent,terms=[]){
  const rows=productRowsForSearch(parent,terms);
  if(!rows.length)return '<div class="empty">没有找到对应子体</div>';
  return '<table><thead><tr><th>图片</th><th>子ASIN</th><th>SKU</th><th>内部编码</th><th>颜色</th><th>尺码</th><th>不含税</th><th>税率</th><th>含税</th><th>库存</th><th>操作</th></tr></thead><tbody>'+rows.map(p=>'<tr><td>'+smartImg(bestColorImage(p),'thumb','width:42px;height:42px')+'</td><td>'+esc(p.child_asin)+'</td><td>'+esc(p.sku)+'</td><td>'+esc(p.internal_code)+'</td><td>'+esc(p.color)+'</td><td><b>'+esc(p.size)+'</b></td><td>'+money(p.untaxed_price)+'</td><td>'+Number(p.tax_rate||0)+'%</td><td>'+money(p.taxed_price)+'</td><td>'+inventoryQty(p.id)+'</td><td><button class="link" onclick="editProduct(\''+p.id+'\')">编辑</button><button class="link red" onclick="delProduct(\''+p.id+'\')">删除</button></td></tr>').join('')+'</tbody></table>'
}
function toggleProductGroup(parent,head){
  const body=head.nextElementSibling;
  if(!body)return;
  if(body.dataset.loaded!=='1'){body.innerHTML=productChildrenHTML(parent);body.dataset.loaded='1'}

async function runImageMigrationInBackground(){
  if(imageMigrationRunning)return;
  const hasExternal=cache.products.some(p=>/^https?:\/\//i.test(p.image_url||'')||/^https?:\/\//i.test(p.parent_image_url||''));
  if(!hasExternal)return;
  imageMigrationRunning=true;
  let moved=0;
  try{
    for(let i=0;i<30;i++){
      const r=await api('/migrate-images?limit=6',{method:'POST'});
      moved+=Number(r.moved||0);
      if(!r.remaining||(!r.moved&&r.failed))break;
      await new Promise(res=>setTimeout(res,120));
    }
    if(moved){
      cache=await api('/bootstrap');
      persistCache()
      render();
      toastMsg('图片已加速 '+moved+' 张');
    }
  }catch(e){}finally{imageMigrationRunning=false}
}

function getCollapsedInventoryModels(){try{return new Set(JSON.parse(localStorage.getItem('inventoryCollapsedModels')||'[]'))}catch(e){return new Set()}}

function toggleInventoryModel(modelKey){
  const body=document.querySelector('[data-model-body="'+CSS.escape(String(modelKey))+'"]');
  const btn=document.querySelector('[data-toggle-model="'+CSS.escape(String(modelKey))+'"]');
  if(!body)return;
  const collapsed=body.style.display==='none';
  body.style.display=collapsed?'':'none';
  if(btn)btn.innerHTML=(collapsed?'收起':'展开')+' <span style="display:inline-block;transform:rotate('+(collapsed?'180':'0')+'deg);transition:.2s">⌄</span>';
  const set=getCollapsedInventoryModels();
  if(collapsed)set.delete(String(modelKey));else set.add(String(modelKey));
  saveCollapsedInventoryModels(set);
}
function collapseAllInventory(){
  const set=new Set();
  document.querySelectorAll('[data-model-body]').forEach(body=>{body.style.display='none';set.add(body.dataset.modelBody)});
  document.querySelectorAll('[data-toggle-model]').forEach(btn=>btn.innerHTML='展开 <span style="display:inline-block;transform:rotate(0deg);transition:.2s">⌄</span>');
  saveCollapsedInventoryModels(set);

function expandAllInventory(){
  document.querySelectorAll('[data-model-body]').forEach(body=>body.style.display='');
  document.querySelectorAll('[data-toggle-model]').forEach(btn=>btn.innerHTML='收起 <span style="display:inline-block;transform:rotate(180deg);transition:.2s">⌄</span>');

function filterCards(v){
  let terms=normalizeProductSearchTerms(v),trimmed=false;
  if(terms.length>10){terms=terms.slice(0,10);trimmed=true}
  let visibleParents=0,visibleChildren=0;
  document.querySelectorAll('.pcard').forEach(card=>{
    const parent=card.dataset.parent||'';
    const rows=productRowsForSearch(parent,terms);
    const show=!terms.length||rows.length>0;
    card.style.display=show?'':'none';
    const body=card.querySelector('.product-children');
    if(!body)return;
    if(terms.length&&show){
      body.innerHTML=productChildrenHTML(parent,terms);
      body.dataset.loaded='1';
      body.hidden=false;
      visibleParents++;
      visibleChildren+=rows.length;
    }else if(!terms.length){
      body.hidden=true;
      body.dataset.loaded='0';
      body.innerHTML='';
    }
  });
  const hint=document.getElementById('productSearchHint');
  if(hint){
    if(!terms.length)hint.innerHTML='支持一次输入最多 <b>10 个</b>父ASIN、子ASIN或SKU，可用空格、逗号或换行分隔；搜索后自动展开对应子体。';
    else if(trimmed)hint.innerHTML='<span style="color:#b42318">最多支持10个搜索项，已按前10个进行搜索。</span> 当前显示 <b>'+visibleChildren+'</b> 个子体。';
    else hint.innerHTML='已搜索 <b>'+terms.length+'</b> 个条件，匹配 <b>'+visibleParents+'</b> 个父体 / <b>'+visibleChildren+'</b> 个子体，可直接点击右侧“编辑”。';
  }
}

async function compressImageForUpload(file,maxSide=900,quality=.78){
  if(!file||!file.type?.startsWith('image/'))return file;
  try{
    let bmp;
    if('createImageBitmap' in window)bmp=await createImageBitmap(file);
    else{
      bmp=await new Promise((resolve,reject)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{URL.revokeObjectURL(u);resolve(img)};img.onerror=e=>{URL.revokeObjectURL(u);reject(e)};img.src=u})
    }
    const sw=bmp.width||bmp.naturalWidth,sh=bmp.height||bmp.naturalHeight,scale=Math.min(1,maxSide/Math.max(sw,sh));
    const w=Math.max(1,Math.round(sw*scale)),h=Math.max(1,Math.round(sh*scale));
    const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
    const ctx2=canvas.getContext('2d',{alpha:false});ctx2.drawImage(bmp,0,0,w,h);
    if(bmp.close)bmp.close();
    const blob=await new Promise(res=>canvas.toBlob(res,'image/webp',quality));
    if(!blob)return file;
    return new File([blob],(file.name.replace(/\.[^.]+$/,'')||'image')+'.webp',{type:'image/webp',lastModified:Date.now()})
  }catch(e){return file}
}
async function uploadImage(file,meta){
  const optimized=await compressImageForUpload(file);
  const fd=new FormData();fd.append('file',optimized);
  Object.entries(meta).forEach(([k,v])=>fd.append(k,v));
  const r=await fetch(API+'/images',{method:'POST',body:fd});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||'图片上传失败');
  return j
}

  f.onsubmit=e=>{
    e.preventDefault();
    const btn=document.getElementById('materialSaveBtn');
    if(btn?.disabled)return;
    if(btn){btn.disabled=true;btn.textContent='已保存'}
    const fd=new FormData(f),file=f.image.files[0],d=Object.fromEntries(fd.entries());
    delete d.image;
    ['purchase_price','current_stock','safety_stock','target_stock','finished_units_per_material'].forEach(k=>d[k]=Number(d[k]||0));

    const mid=id||crypto.randomUUID();
    const existingIndex=cache.materials.findIndex(x=>x.id===mid);
    const before=existingIndex>=0?{...cache.materials[existingIndex]}:null;
    const localPreview=file?URL.createObjectURL(file):'';
    const optimistic={...(before||{}),...d,id:mid,image_url:localPreview||before?.image_url||m.image_url||''};

    if(existingIndex>=0)cache.materials[existingIndex]=optimistic;
    else cache.materials.unshift(optimistic);

    closeModal();
    render();
    toastMsg(file?'页面已更新，云端与图片同步中…':'页面已更新，云端保存中…');

    (async()=>{
      try{
        await api('/materials'+(id?'/'+id:''),{
          method:id?'PUT':'POST',
          keepalive:true,
          body:JSON.stringify(id?d:{...d,id:mid})
        });

        if(!file){
          persistCache();
          toastMsg('云端已保存');
        }
        if(file){
          try{
            const r=await uploadImage(file,{type:'material',material_id:mid});
            const row=cache.materials.find(x=>x.id===mid);
            if(row&&r.url){
              const remoteUrl=new URL(r.url,location.origin).href;
              await new Promise(resolve=>{
                const img=new Image();
                let done=false;
                const finish=()=>{if(done)return;done=true;resolve()};
                img.onload=finish;img.onerror=finish;img.src=remoteUrl;
                setTimeout(finish,900);
              });
              row.image_url=r.url;
              row.resolved_image_url=r.url;
            }
            if(localPreview)URL.revokeObjectURL(localPreview);
            persistCache()
            if(route==='materials')render();
            toastMsg('图片已同步')
          }catch(imgErr){
            if(localPreview){
              const row=cache.materials.find(x=>x.id===mid);
              if(row){row.image_url=before?.image_url||m.image_url||'';row.resolved_image_url=before?.resolved_image_url||m.resolved_image_url||row.image_url||'';}
              URL.revokeObjectURL(localPreview);
              if(route==='materials')render();
            }
            toastMsg('资料已保存；图片稍后可补传')
          }
        }
      }catch(saveErr){
        const idx=cache.materials.findIndex(x=>x.id===mid);
        if(before){
          if(idx>=0)cache.materials[idx]=before;
          else cache.materials.unshift(before);
        }else if(idx>=0){
          cache.materials.splice(idx,1);
        }
        persistCache()
        if(route==='materials')render();
        toastMsg('云端保存失败，已恢复原数据')
      }
    })();
  }
}

function poMaterialRequirements(){
  const m=f?.model_select?.value||'', qty=Math.max(0,Number(f?.quantity?.value||0));
  if(!m||!qty)return [];
  return cache.materials.filter(x=>String(x.applicable_model||'')===String(m)).map(mat=>{
    const pairsPerMat=Math.max(Number(mat.finished_units_per_material||2),0.0001);
    const need=Math.ceil(qty/pairsPerMat),stock=Number(mat.current_stock||0),shortage=Math.max(0,need-stock);
    return {mat,need,stock,shortage,pairsPerMat,sets:Math.ceil(qty/2)}
  })
}

async function delPO(id){if(!confirm('删除采购单？已占用的辅料会自动返还；已入库的采购单不允许删除。'))return;await api('/purchase-orders/'+id,{method:'DELETE'});refresh()}
async function advanceProduction(id){
  const r=await api('/production-orders/'+id+'/advance',{method:'POST'});
  if(r.status==='已入库'){
    const used=r.material_consumptions||[];
    if(used.length){
      toastMsg('已入库；包材已扣减：'+used.map(x=>x.name+' -'+Number(x.consumed).toLocaleString()+(x.unit||'个')).join('，'));
    }else{
      toastMsg('已入库；旧采购单包材已提前扣减，本次未重复扣减');
    }
  }else{
    toastMsg('状态已更新为 '+r.status);
  }
  refresh()
}
function outboundModels(){return [...new Set(cache.products.map(p=>model(p)).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-CN',{numeric:true}))}
function outboundRowsByModel(m){return cache.products.filter(p=>model(p)===m)}
function outboundColors(m){return [...new Set(outboundRowsByModel(m).map(p=>p.color).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'zh-CN'))}
function outboundRowsByModelColor(m,c){return outboundRowsByModel(m).filter(p=>p.color===c).sort((a,b)=>sizeRank(a.size)-sizeRank(b.size))}
function updateOutboundSelectors(){
  const m=f.model_select.value;
  const colors=outboundColors(m);
  const prevColor=f.color_select.value;
  f.color_select.innerHTML=colors.map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join('');
  if(colors.includes(prevColor))f.color_select.value=prevColor;
  updateOutboundSizes();
}
function updateOutboundSizes(){
  const m=f.model_select.value,c=f.color_select.value;
  const rows=outboundRowsByModelColor(m,c);
  const prev=f.size_select.value;
  f.size_select.innerHTML=rows.map(p=>{const stock=inventoryQty(p.id),disabled=stock<=0?' disabled':'';return '<option value="'+p.id+'"'+disabled+'>'+esc(p.size)+' · 库存 '+stock.toLocaleString()+' 双'+(stock<=0?'（无库存）':'')+'</option>'}).join('');
  if(rows.some(p=>p.id===prev&&inventoryQty(p.id)>0))f.size_select.value=prev;
  if(!f.size_select.value){const first=rows.find(p=>inventoryQty(p.id)>0);if(first)f.size_select.value=first.id}
  updateOutboundStock();
}
function updateOutboundStock(){
  const pid=f.size_select.value,p=cache.products.find(x=>x.id===pid),stock=p?inventoryQty(pid):0;
  f.product_id.value=pid||'';
  const stockEl=document.getElementById('outStock');
  if(stockEl)stockEl.textContent=stock.toLocaleString()+' 双';
  f.quantity.max=String(stock);
  if(Number(f.quantity.value)>stock)f.quantity.value=stock>0?String(stock):'';
  const btn=f.querySelector('button[type="submit"]');
  if(btn)btn.disabled=!pid||stock<=0;
}
async function newOutbound(){
  const models=outboundModels();
  openModal('新建出库单','<form id="f" class="form"><label>出库单号<input class="field" name="outbound_no" value="OUT-'+Date.now().toString().slice(-8)+'"></label><label>出库日期<input class="field" type="date" name="outbound_date" value="'+new Date().toISOString().slice(0,10)+'"></label><label>目的地<input class="field" name="destination" value="FBA"></label><label>承运商 / 货代<input class="field" name="carrier"></label><label>型号<select class="field" name="model_select">'+models.map(m=>'<option value="'+esc(m)+'">'+esc(m)+'</option>').join('')+'</select></label><label>颜色<select class="field" name="color_select"></select></label><label>尺码<select class="field" name="size_select"></select></label><label>当前可用库存<div id="outStock" class="field" style="background:#f8fafc;font-weight:700">0 双</div></label><input type="hidden" name="product_id"><label>数量<input class="field" type="number" name="quantity" min="1" value="1"></label><label>每箱装量<input class="field" type="number" name="units_per_carton" value="200" readonly></label><div class="actions full"><button type="button" class="btn" onclick="closeModal()">取消</button><button type="submit" class="btn primary">确认出库</button></div></form>');
  f.model_select.onchange=updateOutboundSelectors;
  f.color_select.onchange=updateOutboundSizes;
  f.size_select.onchange=updateOutboundStock;
  updateOutboundSelectors();
  f.onsubmit=async e=>{
    e.preventDefault();
    const d=Object.fromEntries(new FormData(f).entries());
    delete d.model_select;delete d.color_select;delete d.size_select;
    d.quantity=Number(d.quantity);d.units_per_carton=Number(d.units_per_carton);
    const stock=inventoryQty(d.product_id);
    if(!d.product_id)throw new Error('请选择有库存的尺码');
    if(d.quantity<=0||d.quantity>stock)throw new Error('出库数量不能超过当前可用库存');
    await api('/outbound-orders',{method:'POST',body:JSON.stringify(d)});
    closeModal();refresh()
  }
}

      '*{box-sizing:border-box}body{font-family:Arial,"Microsoft YaHei",sans-serif;color:#111827;margin:0;background:#eef1f5;font-size:12px}.toolbar{position:sticky;top:0;z-index:20;height:62px;background:#fff;border-bottom:1px solid #d1d5db;display:flex;align-items:center;justify-content:space-between;padding:0 22px;box-shadow:0 2px 10px rgba(0,0,0,.05)}.toolbar .title{font-size:16px;font-weight:700}.toolbar .hint{font-size:12px;color:#6b7280;margin-left:10px}.toolbar button{border:1px solid #d1d5db;background:#fff;border-radius:8px;padding:9px 16px;cursor:pointer;font-size:13px;margin-left:8px}.toolbar button.primary{background:#2563eb;color:#fff;border-color:#2563eb}.canvas{padding:28px;min-height:calc(100vh - 62px);display:flex;justify-content:center;align-items:flex-start}.page{width:210mm;min-height:297mm;background:#fff;box-shadow:0 8px 28px rgba(15,23,42,.18);padding:12mm}.head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #111827;padding-bottom:12px;margin-bottom:18px}.head h1{margin:0;font-size:26px}.brand{font-weight:700;font-size:16px}.meta{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 28px;margin-bottom:18px}.meta div{display:flex;justify-content:space-between;border-bottom:1px solid #e5e7eb;padding:7px 0}.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}.sum div{border:1px solid #d1d5db;padding:10px;text-align:center}.sum b{display:block;font-size:18px;margin-top:4px}.rule{border:1px solid #bfdbfe;background:#eff6ff;color:#1e3a8a;padding:9px 12px;margin:0 0 12px;font-weight:700}table{width:100%;border-collapse:collapse;margin-top:10px;table-layout:auto}th,td{border:1px solid #d1d5db;padding:6px;text-align:left;vertical-align:middle}th{background:#f3f4f6;white-space:nowrap}.seq{width:36px;text-align:center}.img-cell{width:62px;text-align:center}.img-cell img{width:48px;height:48px;object-fit:contain;border-radius:6px;border:1px solid #e5e7eb;background:#fff;display:block;margin:auto}.img-fallback{width:48px;height:48px;border:1px dashed #cbd5e1;border-radius:6px;align-items:center;justify-content:center;color:#94a3b8;background:#f8fafc;margin:auto;font-size:10px;display:flex}.foot{margin-top:30px;display:flex;justify-content:space-between}.sign{width:42%;border-top:1px solid #9ca3af;padding-top:8px;margin-top:36px}@page{size:A4;margin:0}@media print{body{background:#fff}.toolbar{display:none}.canvas{padding:0}.page{width:210mm;min-height:297mm;box-shadow:none;margin:0;padding:12mm}.img-cell img{print-color-adjust:exact;-webkit-print-color-adjust:exact}}'+
      '</style></head><body>'+
      '<div class="toolbar"><div><span class="title">PDF 预览 · 出库单</span><span class="hint">200 双/箱 · 2 双/套</span></div><div><button onclick="window.close()">关闭</button><button class="primary" onclick="window.print()">打印 / 保存为 PDF</button></div></div>'+
      '<div class="canvas"><div class="page">'+
      '<div class="head"><div><div class="brand">Amazon Supply</div><h1>出库单</h1></div><div>单号：<b>'+esc(o.outbound_no||'')+'</b></div></div>'+
      '<div class="meta"><div><span>出库日期</span><b>'+esc(o.outbound_date||'')+'</b></div><div><span>状态</span><b>'+esc(o.status||'')+'</b></div><div><span>目的地</span><b>'+esc(o.destination||'')+'</b></div><div><span>承运商 / 货代</span><b>'+esc(o.carrier||'—')+'</b></div></div>'+
      '<div class="rule">装箱规则：每箱 200 双；2 双 = 1 套；因此每箱 = 100 套。</div>'+
      '<div class="sum"><div>总双数<b>'+totalPairs.toLocaleString()+' 双</b></div><div>总套数<b>'+totalSets.toLocaleString()+' 套</b></div><div>每箱装量<b>200 双</b></div><div>总箱数<b>'+totalBoxes.toLocaleString()+' 箱</b></div></div>'+
      '<table><thead><tr><th>序号</th><th>图片</th><th>型号</th><th>商品</th><th>颜色</th><th>尺码</th><th>数量（双）</th><th>套数</th><th>箱数</th></tr></thead><tbody>'+rows+'</tbody></table>'+
      '<div class="foot"><div class="sign">制单人：</div><div class="sign">复核人：</div></div>'+
      '</div></div></body></html>';
    w.document.open();w.document.write(html);w.document.close();w.focus()
  }).catch(e=>{w.document.body.innerHTML='<p style="font-family:Arial;padding:24px">生成失败：'+esc(e.message)+'</p>'})
}
async function delOutbound(id){if(!confirm('删除出库单？本次扣减的库存会自动恢复并生成撤销流水。'))return;await api('/outbound-orders/'+id,{method:'DELETE'});refresh()}
async function migrateImages(){if(!confirm('把现有商品图片复制到 Cloudflare KV？完成后所有电脑都会直接从 Cloudflare 加载。'))return;let moved=0;for(let i=0;i<30;i++){const r=await api('/migrate-images?limit=6',{method:'POST'});moved+=Number(r.moved||0);if(!r.remaining||(!r.moved&&r.failed))break}toastMsg('已迁移 '+moved+' 张图片');refresh()}
load().then(render).catch(e=>{root.innerHTML='<div class="panel"><div class="empty">尚未连接 Cloudflare D1：'+esc(e.message)+'</div></div>';renderNav()})
</script>
