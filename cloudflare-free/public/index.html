<title>Amazon Supply Workbench</title>
<style>

und:#fff}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}.card span{font-size:11px;color:var(--muted)}.card b{display:block;font-size:25px;margin-top:5px}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px}.ph{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 16px}.row{display:flex;align-items:center;gap:12px;min-width:0}.thumb{width:54px;height:54px;object-fit:cover;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:9px}.tag{display:inline-flex;padding:3px 7px;border-radius:999px;background:#eef2ff;color:#4338ca;font-size:11px}.muted{color:var(--muted)}.small{font-size:11px}.toolbar{display:flex;gap:8px;margin-bottom:12px}.field{border:1px solid #dbe1ea;border-radius:8px;padding:9px 10px;background:#fff;min-width:0}.toolbar .field{flex:1}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:900px}.table th,.table td{padding:10px 12px;border-top:1px solid #edf1f5;font-size:12px;text-align:left}.table th{background:#f8fafc;color:#475569;font-weight:700}.link{border:0;background:transparent;color:#2563eb;cursor:pointer;padding:2px 4px}.link.red{color:var(--red)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.inventory-model{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px;box-shadow:0 1px 2px #0f172a08}.inventory-head{display:flex;justify-content:space-between;align-items:center;padding:15px 16px;border-bottom:1px solid var(--line);background:#fff}.inventory-colors{display:grid;grid-template-columns:repeat(2,1fr);gap:0}.color-card{display:grid;grid-template-columns:124px 1fr;border-right:1px solid #edf1f5;border-bottom:1px solid #edf1f5;position:relative;min-height:160px}.color-card.variant-hidden{opacity:.68;background:#f8fafc}.color-side{padding:14px 12px;background:#fbfdff;text-align:center;display:flex;flex-direction:column;align-items:center}.color-side img{width:74px;height:74px;object-fit:contain;border-radius:10px;background:#fff;border:1px solid #e2e8f0}.color-side b{margin-top:6px}.size-list{padding:10px 12px}.variant-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 0 9px;margin-bottom:3px;border-bottom:1px solid #eef2f7}.variant-state{display:flex;align-items:center;gap:7px;font-size:11px;color:#64748b}.variant-dot{width:7px;height:7px;border-radius:999px;background:#10b981}.variant-hidden .variant-dot{background:#94a3b8}.variant-hide-btn{border:1px solid #cbd5e1;background:#fff;color:#475569;border-radius:8px;padding:6px 10px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}.variant-hide-btn:hover{border-color:#94a3b8;background:#f8fafc}.variant-hidden .variant-hide-btn{border-color:#93c5fd;background:#eff6ff;color:#1d4ed8}.inventory-visibility-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 13px;margin:10px 0 14px;border:1px solid #dbeafe;background:#f8fbff;border-radius:11px}.inventory-visibility-toolbar .hint{font-size:12px;color:#64748b}.size-row{display:grid;grid-template-columns:55px 1fr 45px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dashed #edf1f5}.size-row strong{text-align:right}.status{font-size:11px;padding:3px 7px;border-radius:999px}.ok{background:#ecfdf3;color:#047857}.warn{background:#fff7ed;color:#c2410c}.bad{background:#fef2f2;color:#b91c1c}.modalback{position:fixed;inset:0;background:#0f172a88;display:none;align-items:center;justify-content:center;z-index:50;padding:20px}.modalback.open{display:flex}.modal{background:#fff;width:min(920px,96vw);max-height:92vh;overflow:auto;border-radius:14px;box-shadow:0 25px 60px #0004}.modalhead{display:flex;justify-content:space-between;align-items:center;padding:15px 18px;border-bottom:1px solid var(--line)}.modalbody{padding:18px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form label{font-size:12px;color:#475569}.form input,.form select,.form textarea{width:100%;margin-top:5px}.full{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.empty{text-align:center;padding:60px 20px;color:#94a3b8}.toast{position:fixed;right:18px;bottom:18px;background:#111827;color:#fff;border-radius:9px;padding:11px 14px;display:none;z-index:70}.toast.show{display:block}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.quick button{padding:16px;border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer;text-align:left}.quick b,.quick span{display:block}.quick span{font-size:11px;color:var(--muted);margin-top:4px}.kpi-link{cursor:pointer}.kpi-link:hover{border-color:#b8c7e6}

/* 2026-11: always-visible inventory controls, responsive variants */
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.variant-hide-btn{min-height:34px;min-width:90px;border-color:#bfdbfe;color:#1d4ed8}.variant-toolbar{position:relative;z-index:1}.inventory-visibility-toolbar{border:1px solid #93c5fd;background:#eff6ff}.inventory-visibility-toolbar b{color:#1e40af}.color-side img{object-fit:contain!important;object-position:center!important}.inventory-head img,.thumb{object-fit:contain!important}.color-card .size-list{min-width:0}@media(max-width:1050px){.inventory-colors{grid-template-columns:1fr}}@media(max-width:600px){.color-card{grid-template-columns:90px 1fr}.color-side{padding:8px 4px}.color-side img{width:58px;height:58px}.variant-toolbar{flex-wrap:wrap}}

/* DASHBOARD_UI_V2_BEGIN — layout only; figures come from /api/bootstrap */
:root{--dash-ink:#14243c;--dash-line:#e4eaf2;--dash-surface:#fff;--dash-soft:#f6f9fd;--dash-accent:#245cd6}
body{background:#f4f7fb}
.app .side{box-shadow:5px 0 28px #0c183210}
.app .side .brand{padding:4px 8px 20px}
.app .side .brandmark{background:linear-gradient(135deg,#2d64dc,#426fd9)}
.app .navsec{margin:21px 10px 7px;color:#8191aa;font-size:10px;font-weight:700;letter-spacing:.12em}
.app .nav button{min-height:40px;margin:3px 0;transition:background-color .15s,color .15s;border-radius:9px}
.app .nav button.on{background:#244b91;box-shadow:inset 3px 0 #8db3ff}
.app .main>header{background:#fffffff5;backdrop-filter:blur(12px)}
.app .content{max-width:1540px;padding:26px 30px 42px}
.app .btn{min-height:35px;transition:background-color .16s,border-color .16s,transform .16s}
.app .btn:focus-visible,.app .nav button:focus-visible,.app .dashboard button:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}
.app .btn.primary{background:#235acf;border-color:#235acf}
.app .btn.primary:hover{background:#1e4cb3;border-color:#1e4cb3}
.app .panel,.app .card{box-shadow:0 1px 4px #16243e07}
.dashboard{display:flex;flex-direction:column;gap:19px}
.dashboard-hero{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:26px 28px;border:1px solid #dbe5f4;border-radius:17px;background:linear-gradient(113deg,#fff 10%,#f3f8ff 66%,#e9f2ff 100%);box-shadow:0 4px 24px #23498a0b}
.dashboard-eyebrow{color:#486ca7;letter-spacing:.12em;font-size:10px;font-weight:750;text-transform:uppercase;margin-bottom:8px}
.dashboard-hero h1{color:#172e54;font-size:26px;line-height:1.3;margin:0 0 8px;letter-spacing:-.02em}
.dashboard-hero p{max-width:650px;font-size:13px;line-height:1.7;color:#61738f;margin:0}
.dashboard-hero-actions{display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}
.dashboard-sync{display:inline-flex;align-items:center;gap:6px;color:#4f6484;font-size:11px;margin-top:12px}
.dashboard-sync-dot{width:7px;height:7px;border-radius:100%;background:#22a06b;box-shadow:0 0 0 3px #e0f7ed}
.dashboard-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.dashboard-metric{display:block;text-align:left;width:100%;border:1px solid var(--dash-line);border-radius:14px;background:var(--dash-surface);padding:18px 19px;cursor:pointer;min-width:0;transition:transform .16s,border-color .16s,box-shadow .16s;box-shadow:0 1px 4px #17253d07}
.dashboard-metric:hover{transform:translateY(-2px);border-color:#b2c8ec;box-shadow:0 10px 24px #18396613}
.dashboard-metric-head{display:flex;align-items:center;justify-content:space-between;gap:8px;color:#667995;font-size:12px;font-weight:650}
.dashboard-metric-icon{display:grid;place-items:center;flex:0 0 34px;width:34px;height:34px;border-radius:10px;background:#eff5ff;color:#2459c8;font-size:16px}
.dashboard-metric-value{display:block;margin:14px 0 6px;font-size:28px;font-weight:760;line-height:1.15;color:#162a48;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.dashboard-metric-value small{font-size:13px;font-weight:600;margin-left:4px;color:#65748a}
.dashboard-metric-foot{display:block;font-size:11px;color:#8090a5;line-height:1.5}
.dashboard-metric.alert{background:#fffaf9;border-color:#f3d1cb}
.dashboard-metric.alert .dashboard-metric-icon{background:#feefec;color:#bf4937}
.dashboard-metric.alert .dashboard-metric-value{color:#b53f36}
.dashboard-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px;align-items:start}
.dashboard-panel{background:#fff;border:1px solid var(--dash-line);border-radius:15px;min-width:0;overflow:hidden;box-shadow:0 1px 5px #17253b08}
.dashboard-panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 20px 14px;border-bottom:1px solid #eef1f6}
.dashboard-panel-head h2{font-size:15px;color:#172e4e;margin:0 0 4px}
.dashboard-panel-head p{font-size:11px;color:#8190a4;margin:0}
.dashboard-panel-link{border:0;background:none;color:#2257c0;cursor:pointer;font-size:12px;padding:3px 0;white-space:nowrap}
.dashboard-task{display:flex;align-items:center;gap:12px;padding:13px 20px;border-bottom:1px solid #f0f3f8}
.dashboard-task:last-child{border-bottom:0}
.dashboard-task-dot{flex:none;width:9px;height:9px;background:#e0a54b;border-radius:100%}
.dashboard-task-dot.red{background:#db6b60}
.dashboard-task-dot.blue{background:#618cdc}
.dashboard-task-info{min-width:0;flex:1}
.dashboard-task-info b{display:block;font-size:12px;font-weight:700;color:#203453;overflow-wrap:anywhere}
.dashboard-task-info span{display:block;margin-top:4px;font-size:11px;color:#7b8ba0;overflow-wrap:anywhere}
.dashboard-task button{flex:none;border:1px solid #d6e2f5;background:#f8fbff;color:#2457bb;border-radius:8px;min-height:30px;padding:5px 9px;cursor:pointer;font-size:11px}
.dashboard-empty{padding:29px 20px;font-size:12px;color:#73839a;text-align:center;line-height:1.7}
.dashboard-empty strong{display:block;color:#315178;font-size:13px;margin-bottom:6px}
.dashboard-models{padding:12px 20px 18px}
.dashboard-model-row{padding:10px 0;border-bottom:1px solid #f1f3f7}
.dashboard-model-row:last-child{border-bottom:0}
.dashboard-model-line{display:flex;justify-content:space-between;gap:12px;font-size:12px;margin-bottom:8px}
.dashboard-model-line b{color:#233956}
.dashboard-model-line span{font-variant-numeric:tabular-nums;color:#64748b}
.dashboard-meter{height:7px;background:#eff3f9;border-radius:50px;overflow:hidden}
.dashboard-meter span{display:block;height:100%;background:linear-gradient(90deg,#789ee5,#3268d1);border-radius:50px}
.dashboard-shortcuts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}
.dashboard-shortcut{border:1px solid #e0e8f2;background:#fff;padding:16px;border-radius:13px;text-align:left;cursor:pointer;min-width:0;transition:border-color .15s,transform .15s}
.dashboard-shortcut:hover{border-color:#9db8ea;transform:translateY(-1px)}
.dashboard-shortcut i{display:inline-grid;place-items:center;width:35px;height:35px;font-style:normal;background:#edf4ff;color:#2b5eca;border-radius:10px;font-size:17px;margin-bottom:11px}
.dashboard-shortcut b{display:block;font-size:12px;color:#233753}
.dashboard-shortcut span{display:block;font-size:11px;line-height:1.5;color:#8290a5;margin-top:5px}
.dashboard-ledger{padding:0 20px}
.dashboard-ledger-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:10px;padding:13px 0;align-items:center;border-bottom:1px solid #f0f3f7}
.dashboard-ledger-row:last-child{border-bottom:0}
.dashboard-ledger-row strong{font-size:12px;color:#253751;font-weight:700;display:block;overflow-wrap:anywhere}
.dashboard-ledger-row small{display:block;margin-top:3px;font-size:10px;color:#8390a2}
.dashboard-ledger-change{font-size:13px;font-weight:750;font-variant-numeric:tabular-nums;color:#167047;white-space:nowrap}
.dashboard-ledger-change.minus{color:#b54736}
.dashboard-note{color:#8592a5;font-size:11px;line-height:1.55}
#mobileNavBtn{display:none}
#mobileNavBackdrop{display:none}
@media(max-width:1220px){.dashboard-grid{grid-template-columns:1fr}.dashboard-hero{align-items:flex-start}.dashboard-shortcuts{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:800px){
  .app .content{padding:16px}
  .dashboard-hero{padding:21px 18px;display:block}
  .dashboard-hero h1{font-size:22px}
  .dashboard-hero-actions{justify-content:flex-start;margin-top:16px}
  .dashboard-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
  #mobileNavBtn{display:inline-flex;align-items:center;justify-content:center;min-width:38px;margin-right:9px;font-size:20px}
  .app .side{display:block;position:fixed;left:0;top:0;bottom:0;width:245px;z-index:82;transform:translateX(-105%);transition:transform .22s ease;box-shadow:12px 0 32px #0002}
  body.mobile-menu-open .app .side{transform:translateX(0)}
  body.mobile-menu-open #mobileNavBackdrop{display:block;position:fixed;inset:0;background:#0e1c3380;z-index:81}
  .app .main{margin-left:0;width:100%}
  .app .main>header{padding:0 14px}
  .app .main .crumb span{font-size:10px}
}
@media(max-width:520px){
  .dashboard-metrics{gap:8px}
  .dashboard-metric{padding:13px 12px}
  .dashboard-metric-value{font-size:22px}
  .dashboard-shortcuts{gap:8px}
  .dashboard-shortcut{padding:13px}
  .dashboard-panel-head{padding:15px}
  .dashboard-task{padding:12px 15px}
  .dashboard-models,.dashboard-ledger{padding-left:15px;padding-right:15px}
  .dashboard-ledger-row{grid-template-columns:minmax(0,1fr) auto}
  .dashboard-ledger-row .dashboard-ledger-middle{display:none}
  .app .top-actions .btn{padding:8px 9px}
}
@media print{#mobileNavBackdrop{display:none!important}}
/* DASHBOARD_UI_V2_END */
/* Material profile: default grade and dimensions */
.material-detail-pills{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px;line-height:1.5}
.material-detail-pills span{max-width:100%;font-size:11px;color:#415876;border:1px solid #e1e8f2;background:#f7faff;border-radius:7px;padding:5px 8px;overflow-wrap:anywhere}
.material-detail-pills b{font-size:11px;margin-right:4px;color:#2459b5}


/* MATERIAL_PURCHASE_CSS_BUNDLE_BEGIN */
/* 包材采购：独立于成品采购，原有库存/采购数据不受影响 */
.mpo-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:12px 0 16px}
.mpo-kpi{background:#fff;border:1px solid #e4e9f1;border-radius:12px;padding:14px 16px}
.mpo-kpi small{display:block;font-size:12px;color:#64748b;margin-bottom:5px}
.mpo-kpi strong{font-size:22px;color:#10203a}
.mpo-listbox{border:1px solid #e4e9f1;border-radius:12px;background:#fff;overflow:hidden}
.mpo-table{width:100%;border-collapse:collapse;font-size:13px}
.mpo-table th{padding:12px 10px;color:#64748b;background:#f8fafc;text-align:left;font-weight:700;border-bottom:1px solid #e4e9f1}
.mpo-table td{padding:13px 10px;border-bottom:1px solid #eef2f7;vertical-align:middle}
.mpo-status{font-weight:650;border-radius:999px;padding:4px 9px;font-size:11px;white-space:nowrap;background:#eff6ff;color:#1d4ed8}
.mpo-status.done{background:#ecfdf3;color:#047857}
.mpo-status.partial{background:#fffbeb;color:#a16207}
.mpo-lines{display:flex;flex-direction:column;gap:10px}
.mpo-line{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:12px}
.mpo-line-grid{display:grid;grid-template-columns:minmax(140px,1.6fr) repeat(2,minmax(82px,0.8fr)) minmax(90px,1fr);gap:8px;align-items:end}
.mpo-line-grid label{font-size:12px;min-width:0}
.mpo-line .line-additional{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:end;margin-top:8px}
.mpo-line .mpo-line-thumb{width:48px;height:48px;border-radius:8px;border:1px solid #dbe3ee;background:white;object-fit:contain;flex-shrink:0}
.mpo-total{display:flex;justify-content:flex-end;gap:20px;padding:12px;border:1px solid #bfdbfe;border-radius:10px;background:#eff6ff;font-weight:700}
.mpo-inline-actions{display:flex;gap:7px;flex-wrap:wrap}
.mpo-paper{background:#fff;color:#111827;border:1px solid #d5dbe5;padding:24px;max-width:780px;margin:0 auto;font-size:13px;line-height:1.65}
.mpo-paper h2{text-align:center;font-size:21px;letter-spacing:4px;margin:0 0 18px}
.mpo-paper table{width:100%;border-collapse:collapse;table-layout:fixed}
.mpo-paper th,.mpo-paper td{border:1px solid #3f4855;padding:7px 5px;font-size:12px;word-wrap:break-word;text-align:center}
.mpo-paper th{background:#f6f7f8}
.mpo-paper .mpo-clause{border:1px solid #3f4855;border-top:0;padding:8px 10px;white-space:pre-wrap}
.mpo-paper .mpo-contract-meta{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.mpo-paper .mpo-signatures{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0 4px}
.mpo-paper .mpo-signatures>div{min-height:100px;border:1px solid #d1d5db;padding:12px}
.mpo-material-thumb{width:52px;height:52px;object-fit:contain;border:1px solid #e2e8f0;border-radius:8px;background:#fff}

<script>
const API='/api';
const nav=document.getElementById('nav'), root=document.getElementById('root'), pageTitle=document.getElementById('pageTitle'),
      mb=document.getElementById('mb'), mt=document.getElementById('mt'), mc=document.getElementById('mc'), toast=document.getElementById('toast');
let route=location.hash.slice(1)||'dashboard', cache={products:[],inventory:[],suppliers:[],purchase_orders:[],materials:[],production_orders:[],outbound_orders:[],ledger:[]};
const navs=[['dashboard','经营总览','总览','⌂'],['products','商品 / ASIN','基础资料','◫'],['suppliers','供应商','基础资料','▥'],['purchase','采购中心','采购与生产','🛒'],['materials','辅料 / 包材','采购与生产','▤'],['materialPurchase','包装采购','采购与生产','◧'],['production','生产进度','采购与生产','▣'],['inventory','库存中心','库存与物流','⌂'],['outbound','出库单','库存与物流','⇥'],['ledger','库存流水','库存与物流','▧'],['inventoryReports','库存报告','库存与物流','⇩']];
const validRoutes=new Set(navs.map(x=>x[0]));
function normalizeCache(x){
  const base={products:[],inventory:[],suppliers:[],purchase_orders:[],materials:[],production_orders:[],outbound_orders:[],ledger:[]};
  x=(x&&typeof x==='object')?x:{};
  for(const k of Object.keys(base))base[k]=Array.isArray(x[k])?x[k]:[];
  const cleanUrl=v=>typeof v==='string'&&v.startsWith('blob:')?'':v;
  base.products=base.products.map(p=>({...p,image_url:cleanUrl(p.image_url),parent_image_url:cleanUrl(p.parent_image_url),resolved_image_url:cleanUrl(p.resolved_image_url),resolved_parent_image_url:cleanUrl(p.resolved_parent_image_url)}));
  base.materials=base.materials.map(m=>({...m,image_url:cleanUrl(m.image_url),resolved_image_url:cleanUrl(m.resolved_image_url)}));
  return base
}
function persistCache(){
  try{
    const safe=normalizeCache(cache);
    sessionStorage.setItem('asw_bootstrap',JSON.stringify(safe))
  }catch(e){}
}
function normalizeRoute(r){return validRoutes.has(r)?r:'dashboard'}
route=normalizeRoute(route);
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function money(v){return '¥'+Number(v||0).toFixed(2)}
function sizeRank(s){return ({S:1,M:2,L:3,XL:4,'2XL':5,'3XL':6,'4XL':7})[s]||99}
function model(p){return String(p.internal_code||'').split('-')[0]||''}
const PARENT_SKU_BY_ASIN={
  'B08BWZRMYJ':'YRELIEF-CCS01-2006',
  'B0927KVX9K':'YSF-BCCS02-2104',
  'B0D45D9TWK':'BS-SHEER5001-BABA'
};
function parentSkuOf(parent,rows=[]){return rows.find(x=>String(x.parent_sku||'').trim())?.parent_sku||PARENT_SKU_BY_ASIN[parent]||'-'}
function toastMsg(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)}
async function api(path,opt={}){
  const method=String(opt.method||'GET').toUpperCase(), attempts=method==='GET'?2:1;
  let last;
  for(let i=0;i<attempts;i++){
    try{
      const r=await fetch(API+path,{headers:{'content-type':'application/json'},...opt});
      const j=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(j.error||'请求失败');
      return j
    }catch(e){last=e;if(i+1<attempts)await new Promise(res=>setTimeout(res,250))}
  }
  throw last||new Error('请求失败')
}
function renderNav(){let last='';nav.innerHTML=navs.map(n=>{let s='';if(n[2]!=last){last=n[2];s='<div class="navsec">'+last+'</div>'}return s+'<button class="'+(route===n[0]?'on':'')+'" onclick="go(\''+n[0]+'\')"><span class="ico">'+n[3]+'</span>'+n[1]+'</button>'}).join('')}
function closeMobileMenu(){document.body.classList.remove('mobile-menu-open');const btn=document.getElementById('mobileNavBtn');if(btn)btn.setAttribute('aria-expanded','false')}
function toggleMobileMenu(){const next=!document.body.classList.contains('mobile-menu-open');document.body.classList.toggle('mobile-menu-open',next);const btn=document.getElementById('mobileNavBtn');if(btn)btn.setAttribute('aria-expanded',String(next))}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMobileMenu()});
window.addEventListener('resize',()=>{if(window.innerWidth>800)closeMobileMenu()});
function go(r){closeMobileMenu();route=normalizeRoute(r);location.hash=route;render()}
window.onhashchange=()=>{route=normalizeRoute(location.hash.slice(1)||'dashboard');render()}
let lastCloudSync=0;
function setCloudSyncStatus(ok,message=''){
  const badge=document.getElementById('cloudDataStatus');
  if(!badge)return;
  badge.textContent=ok?'云端已同步 '+new Date(lastCloudSync).toLocaleTimeString('zh-CN',{hour12:false}):('云端同步失败'+(message?'：'+message:''));
  badge.style.color=ok?'#047857':'#b42318';
}
async function refresh(){
  try{await load(true);render();toastMsg('已同步云端最新数据')}
  catch(e){setCloudSyncStatus(false,e.message);toastMsg('云端同步失败，请检查网络；当前数据未经刷新确认')}
}
async function load(force=false){
  // Inventory and purchasing data must never be silently replaced with stale browser sessionStorage.
  // Only the D1 API is authoritative; failure is visible instead of rendering old stock.
  const fresh=normalizeCache(await api('/bootstrap?fresh='+Date.now()));
  cache=fresh;
  lastCloudSync=Date.now();
  persistCache();
  setCloudSyncStatus(true);
}
function card(t,v,r){return '<div class="card kpi-link" onclick="go(\''+r+'\')"><span>'+t+'</span><b>'+Number(v||0).toLocaleString()+'</b></div>'}
function render(){
  renderNav();
  route=normalizeRoute(route);
  pageTitle.textContent=navs.find(x=>x[0]===route)?.[1]||'经营总览';
  const managerTop=document.getElementById('topInventoryVisibilityBtn');if(managerTop)managerTop.style.display=route==='inventory'?'inline-flex':'none';
  const view=views&&views[route];
  if(typeof view!=='function'){
    route='dashboard';
    if(location.hash!=='#dashboard')history.replaceState(null,'','#dashboard');
  }
  try{
    const fn=typeof views[route]==='function'?views[route]:views.dashboard;
    root.innerHTML=fn()
  }catch(e){
    try{root.innerHTML=views.dashboard()}catch(_){
      root.innerHTML='<div class="panel"><div class="empty">页面暂时无法显示，请点击右上角刷新。数据仍保存在云端。</div></div>'
    }
  }
}
function parentGroups(){const m=new Map();cache.products.forEach(p=>{const k=p.parent_asin||'未设置父ASIN';if(!m.has(k))m.set(k,[]);m.get(k).push(p)});return [...m].map(([parent,rows])=>({parent,rows:rows.sort((a,b)=>(a.color||'').localeCompare(b.color||'','zh-CN')||sizeRank(a.size)-sizeRank(b.size)),model:model(rows[0]),name:rows[0]?.product_name||''}))}
function inventoryQty(pid){return Number(cache.inventory.find(x=>x.product_id===pid)?.available_qty||0)}
function inventoryValueTotal(){
  return cache.products.reduce((sum,p)=>sum+inventoryQty(p.id)*Number(p.untaxed_price||0),0)
}
function inventoryValueCardHTML(){
  const v=inventoryValueTotal();
  return '<div class="card kpi-link" onclick="showInventoryValueBreakdown()"><span>国内库存总金额 / 库存货值</span><b style="font-size:22px">'+money(v)+'</b><div class="small muted" style="margin-top:6px">按当前SKU不含税采购价估算</div></div>'
}
function showInventoryValueBreakdown(){
  const groups={};
  cache.products.forEach(p=>{
    const m=model(p)||'未设置型号',qty=inventoryQty(p.id),value=qty*Number(p.untaxed_price||0);
    if(!groups[m])groups[m]={qty:0,value:0};
    groups[m].qty+=qty;groups[m].value+=value
  });
  const rows=Object.entries(groups).sort((a,b)=>b[1].value-a[1].value).map(([m,x])=>'<tr><td><b>'+esc(m)+'</b></td><td>'+Number(x.qty).toLocaleString()+' 双</td><td><b>'+money(x.value)+'</b></td></tr>').join('');
  openModal('国内库存货值','<div style="margin-bottom:10px;padding:10px 12px;background:#f8fafc;border-radius:9px;color:#475467;font-size:12px">库存货值 = 当前可用库存 × SKU不含税采购价。只计算国内现有可用库存，不含待入库数量。</div><div class="table"><table><thead><tr><th>型号</th><th>库存数量</th><th>库存货值</th></tr></thead><tbody>'+rows+'</tbody><tfoot><tr><td><b>合计</b></td><td><b>'+cache.inventory.reduce((s,x)=>s+Number(x.available_qty||0),0).toLocaleString()+' 双</b></td><td><b>'+money(inventoryValueTotal())+'</b></td></tr></tfoot></table></div>')
}
function inventoryRecord(pid){return cache.inventory.find(x=>x.product_id===pid)||{}}
function inventorySafety(pid){return Math.max(0,Number(inventoryRecord(pid).safety_stock||0))}
function inventoryAlertInfo(p){
  const qty=inventoryQty(p.id),safety=inventorySafety(p.id);
  if(qty<=0)return {low:true,label:safety>0?'缺货':'缺货 · 未设置预警',bg:'#fef2f2',color:'#b42318',priority:4};
  if(safety<=0)return {low:false,label:'未设置预警',bg:'#f8fafc',color:'#667085',priority:0};
  if(qty<=Math.max(1,Math.floor(safety*.5)))return {low:true,label:'严重预警',bg:'#fff1f0',color:'#b42318',priority:3};
  if(qty<=safety)return {low:true,label:'库存预警',bg:'#fff7ed',color:'#b54708',priority:2};
  if(qty<=Math.ceil(safety*1.25))return {low:false,label:'接近预警',bg:'#fffaeb',color:'#b54708',priority:1};
  return {low:false,label:'正常',bg:'#ecfdf3',color:'#067647',priority:0}
}
function isProductHidden(p){return Number(p?.hidden||0)===1}
function hiddenInventoryVariantCount(){
  const keys=new Set();
  cache.products.filter(isProductHidden).forEach(p=>keys.add(String(p.parent_asin||'')+'||'+String(p.color||'')));
  return keys.size
}
function getShowHiddenInventoryVariants(){try{return localStorage.getItem('inventoryShowHiddenVariants')==='1'}catch(e){return false}}
function toggleHiddenInventoryVariants(){
  const next=!getShowHiddenInventoryVariants();
  try{localStorage.setItem('inventoryShowHiddenVariants',next?'1':'0')}catch(e){}
  render()
}
async function setColorVariantHiddenFromButton(btn,hidden){
  const parent=btn?.dataset?.parent||'',color=btn?.dataset?.color||'';
  const rows=cache.products.filter(p=>String(p.parent_asin||'')===parent&&String(p.color||'')===color);
  if(!rows.length)return;
  if(hidden){
    const qty=rows.reduce((s,p)=>s+inventoryQty(p.id),0);
    const msg='确定隐藏 '+(model(rows[0])||'该型号')+' · '+color+' 这个变体吗？\n\n仅隐藏库存页面和低库存预警，不会删除或修改任何库存数量、库存流水、采购记录。'+(qty>0?'\n当前该变体仍有 '+qty.toLocaleString()+' 双库存，库存总数和库存货值仍会保留。':'');
    if(!confirm(msg))return
  }
  await api('/inventory/visibility',{method:'POST',body:JSON.stringify({product_ids:rows.map(p=>p.id),hidden:!!hidden})});
  rows.forEach(p=>p.hidden=hidden?1:0);
  persistCache();
  render();
  toastMsg(hidden?'变体已隐藏，库存数据未改变':'变体已恢复显示')
}
function openInventoryVisibilityManager(){
  const groups=[];
  parentGroups().forEach(g=>{
    const colors=[...new Set(g.rows.map(p=>p.color).filter(Boolean))];
    colors.forEach(color=>{
      const rows=g.rows.filter(p=>p.color===color);
      groups.push({
        parent:g.parent,model:g.model,name:g.name,color,rows,
        qty:rows.reduce((s,p)=>s+inventoryQty(p.id),0),
        hidden:rows.length>0&&rows.every(isProductHidden)
      })
    })
  });
  const body=groups.map(x=>
    '<tr><td><b>'+esc(x.model)+'</b></td><td>'+esc(x.color)+'</td><td>'+Number(x.qty).toLocaleString()+' 双</td>'+
    '<td>'+(x.hidden?'<span class="status" style="background:#f2f4f7;color:#667085">已隐藏</span>':'<span class="status ok">显示中</span>')+'</td>'+
    '<td><button type="button" class="btn '+(x.hidden?'':'')+'" data-parent="'+esc(x.parent)+'" data-color="'+esc(x.color)+'" onclick="setColorVariantHiddenFromButton(this,'+(x.hidden?'false':'true')+')">'+(x.hidden?'恢复显示':'隐藏变体')+'</button></td></tr>'
  ).join('');
  openModal('变体显示管理',
    '<div style="padding:10px 12px;background:#eff6ff;border:1px solid #dbeafe;border-radius:9px;color:#1d4ed8;margin-bottom:12px">'+
    '<b>只控制库存页面显示，不会修改库存数量。</b><br><span class="small">隐藏后不会删除SKU、库存流水、采购记录，也不会改变库存总双数和库存货值。</span></div>'+
    '<div class="table"><table><thead><tr><th>型号</th><th>颜色变体</th><th>库存</th><th>状态</th><th>操作</th></tr></thead><tbody>'+body+'</tbody></table></div>'
  )
}

function lowStockRows(){
  return cache.products.map(p=>{
    const qty=inventoryQty(p.id),safety=inventorySafety(p.id),alert=inventoryAlertInfo(p);
    const suggested=safety>0?Math.max(0,Math.ceil(safety*2-qty)):null;
    return {p,qty,safety,alert,suggested}
  }).filter(x=>x.alert.low&&!isProductHidden(x.p)).sort((a,b)=>b.alert.priority-a.alert.priority||(b.safety-b.qty)-(a.safety-a.qty)||model(a.p).localeCompare(model(b.p),'zh-CN',{numeric:true}))
}
function lowStockCardHTML(){
  const n=lowStockRows().length;
  return '<div class="card kpi-link" onclick="showLowStockModal()" style="'+(n?'border-color:#fda29b;background:#fffafa':'')+'"><span>低库存SKU</span><b>'+n.toLocaleString()+'</b><div class="small" style="margin-top:6px;color:'+(n?'#b42318':'#667085')+'">'+(n?'点击查看预警与建议采购':'当前无低库存预警')+'</div></div>'
}
function inventoryAlertInline(p){
  if(isProductHidden(p))return '<span style="font-size:10px;padding:3px 6px;border-radius:999px;background:#f2f4f7;color:#667085;white-space:nowrap">已隐藏</span>';
  const a=inventoryAlertInfo(p),safety=inventorySafety(p.id),qty=inventoryQty(p.id);
  if(!a.low&&a.label!=='接近预警')return '';
  const suggested=safety>0?Math.max(0,Math.ceil(safety*2-qty)):null;
  return '<span style="font-size:10px;padding:3px 6px;border-radius:999px;background:'+a.bg+';color:'+a.color+';white-space:nowrap">'+esc(a.label)+(suggested!==null&&suggested>0?' · 建议+'+suggested:'')+'</span>'
}
function showLowStockModal(){
  const rows=lowStockRows();
  if(!rows.length){
    openModal('低库存SKU / 库存预警','<div class="empty">当前没有低库存SKU。</div>');
    return
  }
  const body=rows.map(x=>{
    const p=x.p;
    const suggest=x.suggested===null?'<span class="muted">先设置安全库存</span>':'<b>'+Number(x.suggested).toLocaleString()+' 双</b>';
    return '<tr><td><b>'+esc(model(p))+'</b></td><td>'+esc(p.sku||'-')+'<div class="small muted">'+esc(p.child_asin||'')+'</div></td><td>'+esc(p.color||'-')+'</td><td>'+esc(p.size||'-')+'</td><td><b>'+x.qty.toLocaleString()+'</b> 双</td><td>'+x.safety.toLocaleString()+' 双</td><td><span style="font-size:11px;padding:4px 7px;border-radius:999px;background:'+x.alert.bg+';color:'+x.alert.color+'">'+esc(x.alert.label)+'</span></td><td>'+suggest+'</td><td style="white-space:nowrap"><button class="link" onclick="setSafetyStock(\''+p.id+'\')">设置预警</button><button class="link" onclick="closeModal();adjustStock(\''+p.id+'\')">调整库存</button></td></tr>'
  }).join('');
  openModal('低库存SKU / 库存预警','<div style="margin-bottom:12px;padding:10px 12px;border:1px solid #dbe5f0;border-radius:9px;background:#f8fafc;font-size:12px;color:#475467">预警规则：当前库存 ≤ 安全库存即进入预警；0库存直接标记缺货。<b>建议采购量 = 安全库存 × 2 − 当前库存</b>。未设置安全库存的SKU可直接在此设置。</div><div class="table" style="overflow:auto;max-height:62vh"><table><thead><tr><th>型号</th><th>SKU / ASIN</th><th>颜色</th><th>尺码</th><th>当前库存</th><th>安全库存</th><th>库存预警</th><th>建议采购数量</th><th>操作</th></tr></thead><tbody>'+body+'</tbody></table></div>')
}
function setSafetyStock(pid){
  const p=cache.products.find(x=>x.id===pid);
  if(!p)return;
  const current=inventorySafety(pid);
  openModal('设置库存预警','<form id="f" class="form"><div class="full" style="padding:10px 12px;background:#f8fafc;border-radius:9px"><b>'+esc(model(p)+' · '+(p.color||'')+' · '+(p.size||''))+'</b><div class="small muted">SKU：'+esc(p.sku||'-')+'　当前库存：'+inventoryQty(pid).toLocaleString()+' 双</div></div><label class="full">安全库存（双）<input class="field" type="number" min="0" step="1" name="safety_stock" value="'+current+'" required><span class="small muted">库存达到或低于此数值时触发预警；建议采购量会按“安全库存×2−当前库存”自动计算。</span></label><div class="actions full"><button type="button" class="btn" onclick="closeModal();showLowStockModal()">取消</button><button class="btn primary">保存预警</button></div></form>');
  f.onsubmit=async e=>{
    e.preventDefault();
    const safety=Math.max(0,Math.trunc(Number(new FormData(f).get('safety_stock')||0)));
    await api('/inventory/safety-stock',{method:'POST',body:JSON.stringify({product_id:pid,safety_stock:safety})});
    const inv=cache.inventory.find(x=>x.product_id===pid);
    if(inv)inv.safety_stock=safety;
    if(p)p.safety_stock=safety;
    persistCache();
    closeModal();
    render();
    toastMsg('库存预警已更新')
  }
}
function productionDaysRemaining(o){
  if(['生产完成','已入库'].includes(String(o.status||'')))return {text:o.status==='已入库'?'已入库':'已完成',tone:'done'};
  const raw=String(o.planned_finish_date||'').slice(0,10);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(raw))return {text:'未设置',tone:'muted'};
  const [y,m,d]=raw.split('-').map(Number),now=new Date();
  const today=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate());
  const target=Date.UTC(y,m-1,d);
  const days=Math.round((target-today)/86400000);
  if(days>0)return {text:days+'天',tone:days<=3?'warn':'normal'};
  if(days===0)return {text:'今天',tone:'warn'};
  return {text:'逾期'+Math.abs(days)+'天',tone:'late'}
}
function productionMaterialHTML(o){
  const rows=Array.isArray(o.material_requirements)?o.material_requirements:[];
  if(!rows.length)return '<span class="muted">无关联耗材</span>';
  const units=[...new Set(rows.map(x=>String(x.unit||'个')))];
  const total=rows.reduce((s,x)=>s+Number(x.consumed||0),0);
  const detail=rows.map(x=>'<div style="white-space:nowrap"><b>'+Number(x.consumed||0).toLocaleString()+'</b> '+esc(x.unit||'个')+' <span class="small muted">'+esc(x.name||x.material_code||'耗材')+'</span></div>').join('');
  return (units.length===1&&rows.length>1?'<div style="margin-bottom:3px"><b>合计 '+total.toLocaleString()+' '+esc(units[0])+'</b></div>':'')+detail
}
function productionTableHTML(){
  const rows=cache.production_orders||[];
  if(!rows.length)return '<div class="panel"><div class="empty">暂无生产单</div></div>';
  return '<div class="panel table"><table><thead><tr><th>生产单</th><th>采购单</th><th>供应商</th><th>数量</th><th>计划完成</th><th>生产完成剩余时间</th><th>预计耗材消耗</th><th>状态</th><th>操作</th></tr></thead><tbody>'+rows.map(o=>{
    const left=productionDaysRemaining(o);
    const tone=left.tone==='late'?'color:#b42318;font-weight:700':left.tone==='warn'?'color:#b54708;font-weight:700':left.tone==='done'?'color:#067647;font-weight:700':'';
    return '<tr><td>'+esc(o.production_no||'')+'</td><td>'+esc(o.purchase_order_no||'')+'</td><td>'+esc(o.supplier_name||'')+'</td><td>'+Number(o.total_qty||0).toLocaleString()+'</td><td>'+esc(o.planned_finish_date||'-')+'</td><td><span style="'+tone+'">'+esc(left.text)+'</span></td><td>'+productionMaterialHTML(o)+'</td><td>'+esc(o.status||'')+'</td><td><button class="link" onclick="advanceProduction(\''+o.id+'\')">推进状态</button></td></tr>'
  }).join('')+'</tbody></table></div>'
}
let imageMigrationRunning=false;
function smartImg(src,cls='thumb',style='',loading='lazy'){
  const s=String(src||'');
  const boxStart='<span style="display:inline-flex;align-items:center;justify-content:center;vertical-align:middle">';
  const ph='<span style="display:none;align-items:center;justify-content:center;width:52px;height:52px;min-width:42px;min-height:42px;border:1px dashed #cbd5e1;border-radius:7px;background:#f8fafc;color:#94a3b8;font-size:10px">暂无图片</span>';
  if(!s)return boxStart+ph.replace('display:none','display:flex')+'</span>';
  const eager=loading==='eager';

function productMatchesSearch(p,term){
  const t=String(term||'').toUpperCase();
  if(!t)return false;
  const fields=[p.child_asin,p.sku,p.internal_code,p.product_name,p.color,p.size].map(x=>String(x||'').toUpperCase());

function productRowsForSearch(parent,terms=[]){
  const rows=cache.products.filter(p=>(p.parent_asin||'未设置父ASIN')===parent).sort((a,b)=>(a.color||'').localeCompare(b.color||'','zh-CN')||sizeRank(a.size)-sizeRank(b.size));
  if(!terms.length)return rows;
  const parentUpper=String(parent||'').toUpperCase(),parentSku=String(parentSkuOf(parent,rows)||'').toUpperCase(),modelUpper=String(model(rows[0]||{})||'').toUpperCase(),nameUpper=String(rows[0]?.product_name||'').toUpperCase();
  const wholeParent=terms.some(t=>t===parentUpper||t===parentSku||t===modelUpper||nameUpper.includes(t));

async function runImageMigrationInBackground(){
  if(imageMigrationRunning)return;
  const hasExternal=cache.products.some(p=>/^https?:\/\//i.test(p.image_url||'')||/^https?:\/\//i.test(p.parent_image_url||''));
  if(!hasExternal)return;
  imageMigrationRunning=true;
  let moved=0;
  try{
    for(let i=0;i<30;i++){
      const r=await api('/migrate-images?limit=6',{method:'POST'});
      moved+=Number(r.moved||0);
      if(!r.remaining||(!r.moved&&r.failed))break;
      await new Promise(res=>setTimeout(res,120));
    }
    if(moved){
      cache=await api('/bootstrap');
      persistCache()
      render();
      toastMsg('图片已加速 '+moved+' 张');
    }
  }catch(e){}finally{imageMigrationRunning=false}
}

async function compressImageForUpload(file,maxSide=900,quality=.78){
  if(!file||!file.type?.startsWith('image/'))return file;
  try{
    let bmp;
    if('createImageBitmap' in window)bmp=await createImageBitmap(file);
    else{
      bmp=await new Promise((resolve,reject)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{URL.revokeObjectURL(u);resolve(img)};img.onerror=e=>{URL.revokeObjectURL(u);reject(e)};img.src=u})
    }
    const sw=bmp.width||bmp.naturalWidth,sh=bmp.height||bmp.naturalHeight,scale=Math.min(1,maxSide/Math.max(sw,sh));
    const w=Math.max(1,Math.round(sw*scale)),h=Math.max(1,Math.round(sh*scale));
    const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
    const ctx2=canvas.getContext('2d',{alpha:false});ctx2.drawImage(bmp,0,0,w,h);
    if(bmp.close)bmp.close();
    const blob=await new Promise(res=>canvas.toBlob(res,'image/webp',quality));
    if(!blob)return file;
    return new File([blob],(file.name.replace(/\.[^.]+$/,'')||'image')+'.webp',{type:'image/webp',lastModified:Date.now()})
  }catch(e){return file}
}
async function uploadImage(file,meta){
  const optimized=await compressImageForUpload(file);
  const fd=new FormData();fd.append('file',optimized);
  Object.entries(meta).forEach(([k,v])=>fd.append(k,v));
  const r=await fetch(API+'/images',{method:'POST',body:fd});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||'图片上传失败');
  return j
}

  openModal(id?'编辑辅料':'新增辅料','<form id="f" class="form"><label>编码<input class="field" name="material_code" value="'+esc(m.material_code||'')+'" required></label><label>名称<input class="field" name="name" value="'+esc(m.name||'')+'" required></label>'+
    '<label>材质<input class="field" name="material_grade" maxlength="200" placeholder="例如：400g白卡、牛皮纸、PET" value="'+esc(m.material_grade||'')+'"></label>'+
    '<label>规格 / 尺寸<input class="field" name="material_spec" maxlength="300" placeholder="例如：130×140×16.5 mm" value="'+esc(m.material_spec||'')+'"></label>'+
    '<label>单位<input class="field" name="unit" value="'+esc(m.unit||'个')+'"></label><label>适用型号<input class="field" name="applicable_model" value="'+esc(m.applicable_model||'')+'"></label><label>采购价<input class="field" type="number" step="0.01" name="purchase_price" value="'+Number(m.purchase_price||0)+'"></label><label>当前库存<input class="field" type="number" step="1" name="current_stock" value="'+Number(m.current_stock||0)+'"></label><label>安全库存<input class="field" type="number" step="1" name="safety_stock" value="'+Number(m.safety_stock||0)+'"></label><label>目标库存<input class="field" type="number" step="1" name="target_stock" value="'+Number(m.target_stock||0)+'"></label><label>每个包材对应成品双数<input class="field" type="number" step="0.01" min="0.01" name="finished_units_per_material" value="'+Number(m.finished_units_per_material||2)+'"><span class="small muted">包装默认：2双=1套，每套1个包材，所以这里填2</span></label><label>图片<input class="field" type="file" name="image" accept="image/*"><span class="small muted">图片会在后台压缩并上传，不阻塞保存</span></label><div class="actions full"><button type="button" class="btn" onclick="closeModal()">取消</button><button type="submit" class="btn primary" id="materialSaveBtn">保存</button></div></form>');
  f.onsubmit=e=>{
    e.preventDefault();
    const btn=document.getElementById('materialSaveBtn');
    if(btn?.disabled)return;
    if(btn){btn.disabled=true;btn.textContent='已保存'}
    const fd=new FormData(f),file=f.image.files[0],d=Object.fromEntries(fd.entries());
    delete d.image;
    ['purchase_price','current_stock','safety_stock','target_stock','finished_units_per_material'].forEach(k=>d[k]=Number(d[k]||0));

    const mid=id||crypto.randomUUID();
    const existingIndex=cache.materials.findIndex(x=>x.id===mid);
    const before=existingIndex>=0?{...cache.materials[existingIndex]}:null;
    const localPreview=file?URL.createObjectURL(file):'';
    const optimistic={...(before||{}),...d,id:mid,image_url:localPreview||before?.image_url||m.image_url||''};

    if(existingIndex>=0)cache.materials[existingIndex]=optimistic;
    else cache.materials.unshift(optimistic);

    closeModal();
    render();
    toastMsg(file?'页面已更新，云端与图片同步中…':'页面已更新，云端保存中…');

    (async()=>{
      try{
        await api('/materials'+(id?'/'+id:''),{
          method:id?'PUT':'POST',
          keepalive:true,
          body:JSON.stringify(id?d:{...d,id:mid})
        });

        if(!file){
          persistCache();
          toastMsg('云端已保存');
        }
        if(file){
          try{
            const r=await uploadImage(file,{type:'material',material_id:mid});
            const row=cache.materials.find(x=>x.id===mid);
            if(row&&r.url){
              const remoteUrl=new URL(r.url,location.origin).href;
              await new Promise(resolve=>{
                const img=new Image();
                let done=false;
                const finish=()=>{if(done)return;done=true;resolve()};
                img.onload=finish;img.onerror=finish;img.src=remoteUrl;
                setTimeout(finish,900);
              });
              row.image_url=r.url;
              row.resolved_image_url=r.url;
            }
            if(localPreview)URL.revokeObjectURL(localPreview);
            persistCache()
            if(route==='materials')render();
            toastMsg('图片已同步')
          }catch(imgErr){
            if(localPreview){
              const row=cache.materials.find(x=>x.id===mid);
              if(row){row.image_url=before?.image_url||m.image_url||'';row.resolved_image_url=before?.resolved_image_url||m.resolved_image_url||row.image_url||'';}
              URL.revokeObjectURL(localPreview);
              if(route==='materials')render();
            }
            toastMsg('资料已保存；图片稍后可补传')
          }
        }
      }catch(saveErr){
        const idx=cache.materials.findIndex(x=>x.id===mid);
        if(before){
          if(idx>=0)cache.materials[idx]=before;
          else cache.materials.unshift(before);
        }else if(idx>=0){
          cache.materials.splice(idx,1);
        }
        persistCache()
        if(route==='materials')render();
        toastMsg('云端保存失败，已恢复原数据')
      }
    })();
  }
}
async function adjustStock(pid=''){openModal('库存调整','<form id="f" class="form"><label class="full">产品<select class="field" name="product_id">'+productOptions()+'</select></label><label>调整数量<input class="field" type="number" name="qty_change" placeholder="入库正数，出库负数" required></label><label>类型<select class="field" name="business_type"><option>库存调整</option><option>期初库存</option><option>退货入库</option><option>样品出库</option></select></label><label class="full">备注<input class="field" name="notes"></label><div class="actions full"><button type="button" class="btn" onclick="closeModal()">取消</button><button class="btn primary">确认</button></div></form>');if(pid)f.product_id.value=pid;f.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f).entries());d.qty_change=Number(d.qty_change);await api('/inventory/adjust',{method:'POST',body:JSON.stringify(d)});closeModal();refresh()}}
function poModels(){return [...new Set(cache.products.map(p=>model(p)).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-CN',{numeric:true}))}
function poRowsByModel(m){return cache.products.filter(p=>model(p)===m)}
function poColors(m){return [...new Set(poRowsByModel(m).map(p=>p.color).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'zh-CN'))}
function poRowsByModelColor(m,c){return poRowsByModel(m).filter(p=>p.color===c).sort((a,b)=>sizeRank(a.size)-sizeRank(b.size))}
function updatePOSelectors(){
  const m=f.model_select.value;
  const colors=poColors(m);
  const prevColor=f.color_select.value;
  f.color_select.innerHTML=colors.map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join('');
  if(colors.includes(prevColor))f.color_select.value=prevColor;
  updatePOSizes();
}
function updatePOSizes(){
  const m=f.model_select.value,c=f.color_select.value;
  const rows=poRowsByModelColor(m,c);
  const prev=f.size_select.value;
  f.size_select.innerHTML=rows.map(p=>'<option value="'+p.id+'">'+esc(p.size)+'</option>').join('');
  if(rows.some(p=>p.id===prev))f.size_select.value=prev;
  updatePOProduct();
}
function updatePOProduct(){
  const pid=f.size_select.value,p=cache.products.find(x=>x.id===pid);
  f.product_id.value=pid||'';
  f.unit_price.value=Number(p?.untaxed_price||0);
  const info=document.getElementById('poProductInfo');
  if(info)info.innerHTML=p?'<b>'+esc(model(p)+'-'+p.color+'-'+p.size)+'</b><span class="muted small" style="margin-left:10px">'+esc(p.product_name||'')+'</span>':'';
}
function poMaterialRequirements(){
  const m=f?.model_select?.value||'', qty=Math.max(0,Number(f?.quantity?.value||0));
  if(!m||!qty)return [];
  return cache.materials.filter(x=>String(x.applicable_model||'')===String(m)).map(mat=>{
    const pairsPerMat=Math.max(Number(mat.finished_units_per_material||2),0.0001);
    const need=Math.ceil(qty/pairsPerMat),stock=Number(mat.current_stock||0),shortage=Math.max(0,need-stock);
    return {mat,need,stock,shortage,pairsPerMat,sets:Math.ceil(qty/2)}
  })
}
function updatePOMaterialPreview(){
  const box=document.getElementById('poMaterialCheck');if(!box)return;
  const rows=poMaterialRequirements();
  if(!rows.length){box.innerHTML='<div class="muted small">当前型号未关联包材</div>';return}
  box.innerHTML=rows.map(x=>'<div style="display:flex;justify-content:space-between;gap:14px;padding:9px 10px;border:1px solid '+(x.shortage?'#fecaca':'#d1fae5')+';background:'+(x.shortage?'#fff7f7':'#f0fdf4')+';border-radius:8px;margin-top:6px"><div><b>'+esc(x.mat.name||x.mat.material_code)+'</b><div class="small muted">2双=1套；本单 '+x.sets.toLocaleString()+' 套</div></div><div style="text-align:right"><b>需 '+x.need.toLocaleString()+' '+esc(x.mat.unit||'个')+'</b><div class="small '+(x.shortage?'red':'muted')+'">库存 '+x.stock.toLocaleString()+(x.shortage?' · 缺 '+x.shortage.toLocaleString():' · 充足')+'</div></div></div>').join('')
}

function switchProcurementType(kind){
  if(kind==='material')window.newMaterialPO();
  else if(kind==='finished')newPO();
}
async function newPO(){
  const models=poModels();
  openModal('新建成品采购单','<form id="f" class="form">'+procurementTypeSwitch('finished')+'<label>采购单号<input class="field" name="order_no" value="PO-'+Date.now().toString().slice(-8)+'" required></label><label>供应商<select class="field" name="supplier_id">'+cache.suppliers.map(s=>'<option value="'+s.id+'">'+esc(s.company_name)+'</option>').join('')+'</select></label><label>下单日期<input class="field" type="date" name="order_date" value="'+new Date().toISOString().slice(0,10)+'"></label><label>预计交期<input class="field" type="date" name="expected_date"></label><label>型号<select class="field" name="model_select">'+models.map(m=>'<option value="'+esc(m)+'">'+esc(m)+'</option>').join('')+'</select></label><label>颜色<select class="field" name="color_select"></select></label><label>尺码<select class="field" name="size_select"></select></label><label>已选产品<div id="poProductInfo" class="field" style="background:#f8fafc;display:flex;align-items:center;min-height:42px"></div></label><input type="hidden" name="product_id"><label>数量<input class="field" type="number" name="quantity" min="1" value="1"></label><label>未税单价<input class="field" type="number" step="0.01" name="unit_price" value="0"></label><label>付款条件<input class="field" name="payment_terms" placeholder="30%定金，70%尾款"></label><label>运费<input class="field" type="number" step="0.01" name="shipping_fee" value="0"></label><div class="full"><div style="font-weight:700;margin-bottom:4px">包材需求检查</div><div id="poMaterialCheck"></div></div><div class="actions full"><button type="button" class="btn" onclick="closeModal()">取消</button><button class="btn primary">保存采购单</button></div></form>');
  f.model_select.onchange=()=>{updatePOSelectors();updatePOMaterialPreview()};
  f.color_select.onchange=updatePOSizes;
  f.size_select.onchange=updatePOProduct;
  f.quantity.oninput=updatePOMaterialPreview;
  updatePOSelectors();updatePOMaterialPreview();
  f.onsubmit=async e=>{
    e.preventDefault();
    const d=Object.fromEntries(new FormData(f).entries());
    delete d.model_select;delete d.color_select;delete d.size_select;
    d.quantity=Number(d.quantity);d.unit_price=Number(d.unit_price);d.shipping_fee=Number(d.shipping_fee);
    if(!d.product_id)throw new Error('请选择型号、颜色和尺码');
    const r=await api('/purchase-orders',{method:'POST',body:JSON.stringify(d)});
    closeModal();
    const reqs=r.material_requirements||[];
    const shortages=reqs.filter(x=>Number(x.shortage||0)>0);
    if(shortages.length)toastMsg('采购单已保存；包材不足：'+shortages.map(x=>x.name+' 缺'+Number(x.shortage).toLocaleString()).join('，'));
    else toastMsg('采购单已保存；包材充足（入库时扣减）');
    refresh()
  }
}

function updateOutboundSizes(){

function updateOutboundStock(){

function parseAmazonShipmentText(raw){
  const text=String(raw||'').replace(/\*\*/g,'').replace(/\u00a0/g,' ').replace(/\r/g,'').trim();
  const clean=s=>String(s||'').replace(/^[\s:：-]+|[\s]+$/g,'').trim();
  const pick=re=>{const m=text.match(re);return m?clean(m[1]):''};
  let fba=pick(/货件编号\s*[:：]\s*([^\n]+)/i);
  if(!fba){const m=text.match(/\b(FBA[A-Z0-9-]+)\b/i);fba=m?m[1]:''}
  let tracking=pick(/货件追踪编号\s*[:：]\s*([^\n]+)/i)||pick(/追踪编号\s*[:：]\s*([^\n]+)/i);
  const fromMatch=text.match(/发货地址\s*[:：]\s*([\s\S]*?)(?=\n?\s*收货地址\s*[:：]|$)/i);
  const toMatch=text.match(/收货地址\s*[:：]\s*([\s\S]*)$/i);
  const shipFrom=clean(fromMatch?fromMatch[1]:'').replace(/\n+/g,' ');
  const shipTo=clean(toMatch?toMatch[1]:'').replace(/\n+/g,' ');
  let warehouse='';
  if(shipTo){
    const wm=shipTo.match(/^([A-Z]{2,6}\d{0,4})\s*[-–—]/i)||shipTo.match(/^([A-Z]{2,6}\d{0,4})\b/i);
    warehouse=wm?wm[1].toUpperCase():''
  }
  return {fba_shipment_id:fba,tracking_no:tracking,warehouse_code:warehouse,ship_from_address:shipFrom,ship_to_address:shipTo}
}
function applyAmazonShipmentText(){
  const form=document.getElementById('f');
  if(!form||!form.raw_fba_text)return;
  const x=parseAmazonShipmentText(form.raw_fba_text.value);
  if(x.fba_shipment_id)form.fba_shipment_id.value=x.fba_shipment_id;
  if(x.tracking_no)form.tracking_no.value=x.tracking_no;
  if(x.warehouse_code)form.warehouse_code.value=x.warehouse_code;
  if(x.ship_from_address)form.ship_from_address.value=x.ship_from_address;
  if(x.ship_to_address)form.ship_to_address.value=x.ship_to_address;
  const p=document.getElementById('fbaParseStatus');
  if(p){
    const found=[x.fba_shipment_id&&('货件 '+x.fba_shipment_id),x.tracking_no&&('追踪 '+x.tracking_no),x.warehouse_code&&('仓库 '+x.warehouse_code)].filter(Boolean);
    p.innerHTML=found.length?'<span style="color:#047857">✓ 已识别：'+esc(found.join(' · '))+'</span>':'<span class="muted">粘贴后将自动识别货件编号、追踪编号、仓库号及地址</span>'
  }
}

window.deleteMaterialPurchaseOrder=async function(id){
  const item=purchaseOrders.find(o=>String(o.id)===String(id));
  const no=item?.order_no||(currentOrder?.id===id?currentOrder?.order_no:'这张合同');
  const inPreview=currentOrder?.id===id?currentOrder:null;
  const received=n(item?.received_qty)||n(inPreview?.items?.reduce((total,it)=>total+n(it.received_qty),0));
  if(n(item?.returned_count)>0){toastMsg('已有回传合同的订单不能直接删除，请先核对归档文件');return}
  if(received>0||(['部分到货','已入库'].includes(item?.status)||['部分到货','已入库'].includes(inPreview?.status))){
    toastMsg('该合同已收货入库，不能直接删除，请先核对入库记录');return;
  }
  if(!confirm('确定删除包材采购合同「'+no+'」吗？\n\n仅删除未发生收货入库的合同及订单明细。\n不会删除包材档案，也不会改变成品或包材库存。\n系统会保留删除审计快照。'))return;
  const buttons=[...document.querySelectorAll('.mpo-delete-btn')];buttons.forEach(button=>button.disabled=true);
  try{
    await api('/material-purchase-orders/'+encodeURIComponent(id),{method:'DELETE'});
    if(currentOrder?.id===id){currentOrder=null;closeModal()}
    await loadPurchaseOrders();
    toastMsg('已删除错误的采购合同，库存未变');
  }catch(err){
    toastMsg('删除失败：'+err.message);
    buttons.forEach(button=>button.disabled=false);
  }
};

const returnedContractURL=(orderId,fileId)=>'/api/material-purchase-orders/'+encodeURIComponent(orderId)+'/returned-contracts/'+encodeURIComponent(fileId);
const returnedFileSize=bytes=>Number(bytes)>=1024*1024?(Number(bytes)/1024/1024).toFixed(1)+' MB':Math.max(1,Math.ceil(Number(bytes)/1024))+' KB';
window.manageReturnedContracts=async function(orderId){
  const order=purchaseOrders.find(o=>o.id===orderId)||(currentOrder?.id===orderId?currentOrder:null);
  if(!order){toastMsg('采购单不存在，请先刷新列表');return}
  try{
    const response=await api('/material-purchase-orders/'+encodeURIComponent(orderId)+'/returned-contracts');
    const files=Array.isArray(response.files)?response.files:[],active=files.filter(f=>!Number(f.is_void));
    const fileRows=files.length?files.map(file=>{
      const voided=!!Number(file.is_void),type=String(file.content_type||''),preview=!voided&&(/^(application\/pdf|image\/)/).test(type);
      const url=returnedContractURL(orderId,file.id);
      return '<div class="mpo-return-file '+(voided?'is-void':'')+'">'+
        '<span class="mpo-return-icon">'+(type==='application/pdf'?'PDF':type.startsWith('image/')?'图像':'DOC')+'</span>'+
        '<div class="mpo-return-file-text"><strong>'+safe(file.original_name)+'</strong><span>'+
        returnedFileSize(file.byte_size)+' · '+safe(String(file.uploaded_at||'').replace('T',' ').slice(0,16))+
        (voided?' · 已作废':'')+'</span>'+
        (file.description?'<small>'+safe(file.description)+'</small>':'')+'</div>'+
        '<div class="mpo-return-file-actions">'+
        (preview?'<a class="btn" target="_blank" rel="noopener noreferrer" href="'+safe(url)+'">预览</a>':'')+
        '<button type="button" class="btn" data-file-action="download" data-file-id="'+safe(file.id)+'">下载</button>'+
        (voided?'<span class="mpo-return-void">作废归档</span>':
          '<button type="button" class="btn danger" data-file-action="void" data-file-id="'+safe(file.id)+'">标记作废</button>')+
        '</div></div>'
    }).join(''):'<p class="mpo-return-empty">暂无回传文件，请上传供应商签字、盖章后的原始合同。</p>';
    openModal('回传合同归档 · '+order.order_no,
      '<div class="mpo-return-manager">'+
      '<div class="mpo-return-manager-title"><div><h3>供应商回传合同</h3><p>'+safe(order.supplier_name||'供应商未设置')+' · 采购单 '+safe(order.order_no)+'</p></div>'+
      '<span class="mpo-return-label '+(active.length?'complete':'')+'">'+(active.length?'已回传 '+active.length+' 份':'尚未回传')+'</span></div>'+
      '<form id="mpoReturnedUpload" class="mpo-return-upload">'+
      '<label>选择原始合同文件<input type="file" class="field" name="file" id="mpoReturnedFile" required accept=".pdf,.jpg,.jpeg,.png,.webp,.docx"></label>'+
      '<label>备注（选填）<input type="text" class="field" name="description" maxlength="240" placeholder="如：供应商已盖章 / 双方签字确认 / 第二次回传"></label>'+
      '<p class="mpo-return-help">支持 PDF、JPG、PNG、WebP、DOCX，单个文件最大 20MB。可多次上传，每次均保留原始文件。</p>'+
      '<div class="mpo-return-upload-actions"><span id="mpoReturnedUploadStatus" aria-live="polite"></span><button type="submit" id="mpoReturnedUploadSubmit" class="btn primary">上传并保存到云端</button></div></form>'+
      '<div class="mpo-return-list-title"><b>回传文件记录</b><small>总计 '+files.length+' 份 · 有效 '+active.length+' 份</small></div>'+
      '<div id="mpoReturnedFiles" class="mpo-return-file-list">'+fileRows+'</div>'+
      '<div class="mpo-return-warning">文件储存在 Workers KV 的非公开存储路径，但目前系统尚未配置严格的用户登录权限。正式使用时请启用 Cloudflare Access，避免他人访问合同。</div>'+
      '</div>');
    const form=el('mpoReturnedUpload');
    form.onsubmit=async e=>{
      e.preventDefault();
      const file=el('mpoReturnedFile')?.files?.[0];
      const status=el('mpoReturnedUploadStatus'),button=el('mpoReturnedUploadSubmit');
      if(!file)return;
      if(file.size>20*1024*1024){toastMsg('单个文件不能超过20MB');return}
      button.disabled=true;button.textContent='正在上传…';
      if(status)status.textContent='正在上传，请勿关闭窗口';
      try{
        const fd=new FormData(form);
        const res=await fetch('/api/material-purchase-orders/'+encodeURIComponent(orderId)+'/returned-contracts',{method:'POST',body:fd,cache:'no-store'});
        const data=await res.json().catch(()=>({}));
        if(!res.ok)throw Error(data.error||'上传失败');
        await loadPurchaseOrders();
        await manageReturnedContracts(orderId);
        toastMsg('供应商回传合同已保存到云端');
      }catch(err){
        if(status)status.textContent='上传失败：'+err.message;
        toastMsg('上传失败：'+err.message)
      }finally{button.disabled=false;button.textContent='上传并保存到云端'}
    };
    el('mpoReturnedFiles')?.addEventListener('click',async e=>{
      const target=e.target.closest('button[data-file-action]');
      if(!target)return;
      const fileId=target.dataset.fileId;
      const record=files.find(f=>f.id===fileId);
      if(!record)return;
      if(target.dataset.fileAction==='download'){
        try{
          const res=await fetch(returnedContractURL(orderId,fileId),{cache:'no-store'});
          if(!res.ok)throw Error('文件读取失败');
          const url=URL.createObjectURL(await res.blob()),a=document.createElement('a');
          a.href=url;a.download=record.original_name;a.style.display='none';document.body.appendChild(a);a.click();a.remove();
          setTimeout(()=>URL.revokeObjectURL(url),1000);
        }catch(err){toastMsg('下载失败：'+err.message)}
      }
      if(target.dataset.fileAction==='void'){
        if(!confirm('将「'+record.original_name+'」标记作废？原始文件和上传记录会继续保留，方便追溯。'))return;
        target.disabled=true;
        try{
          await api(returnedContractURL(orderId,fileId),{method:'DELETE'});
          await loadPurchaseOrders();
          await manageReturnedContracts(orderId);
          toastMsg('已作废该版本，原始文件仍在云端归档');
        }catch(err){target.disabled=false;toastMsg('操作失败：'+err.message)}
      }
    });
  }catch(err){toastMsg('加载回传合同失败：'+err.message)}
};

function calculateTotal(){
  let sum=0;
  document.querySelectorAll('#mpoLineRows .mpo-line').forEach(row=>{
    const cost=Math.max(0,n(row.querySelector('.mpo-qty').value))*Math.max(0,n(row.querySelector('.mpo-price').value));
    const label=row.querySelector('.mpo-line-value');if(label)label.textContent=yuan(cost);sum+=cost
  });
  const fee=Math.max(0,n(el('mpoShipping')?.value));
  if(el('mpoSubtotal'))el('mpoSubtotal').textContent=yuan(sum);
  if(el('mpoTotal'))el('mpoTotal').textContent=yuan(sum+fee)
}

function upperMoney(value){
  const digit=['零','壹','贰','叁','肆','伍','陆','柒','捌','玖'],unit=['','拾','佰','仟'],parts=['','万','亿','兆'];
  const num=Math.round(Number(value||0)*100);if(!Number.isSafeInteger(num)||num<0)return '金额超出范围';
  const integer=Math.floor(num/100),jiao=Math.floor((num%100)/10),fen=num%10;
  if(integer===0)return '零元'+(jiao?digit[jiao]+'角':'')+(fen?digit[fen]+'分':'整');
  let valueLeft=integer,index=0,result='',pendingZero=false;
  while(valueLeft>0){
    let chunk=valueLeft%10000,txt='',zero=false;
    for(let i=0;i<4;i++){const x=chunk%10;chunk=Math.floor(chunk/10);if(x){txt=digit[x]+unit[i]+(zero?'零':'')+txt;zero=false}else if(txt){zero=true}}
    if(txt){if(pendingZero&&result)txt='零'+txt;result=txt+parts[index]+result;pendingZero=false}
    else if(result)pendingZero=true;
    valueLeft=Math.floor(valueLeft/10000);index++;
  }
  return result+'元'+(jiao?digit[jiao]+'角':'')+(fen?digit[fen]+'分':'')+(!jiao&&!fen?'整':'');
}

window.printMaterialPurchaseContract=function(){
  if(!currentOrder)return;
  const popup=window.open('','_blank');
  if(!popup){toastMsg('浏览器阻止了打印窗口，请允许此网站打开弹出窗口');return}
  const cssURL=new URL('/material-contract-print.css?v=a4-20261119-v4',location.origin).href;
  const home=new URL('/',location.origin).href;
  const toolbar='<div class="mpo-print-toolbar" id="mpoPrintToolbar">'+
    '<div class="mpo-print-toolbar-info"><strong>订货合同 · A4打印</strong><span id="mpoPrintStatus">正在加载打印样式…</span></div>'+
    '<div class="mpo-print-toolbar-actions">'+
    '<button type="button" id="mpoPrintNow" class="mpo-print-primary">打印 / 保存为 PDF</button>'+
    '<button type="button" id="mpoPrintClose" class="mpo-print-secondary">关闭</button>'+
    '</div></div>';
  popup.document.open();
  popup.document.write('<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">'+
    '<meta name="viewport" content="width=device-width,initial-scale=1">'+
    '<base href="'+safe(home)+'"><title>'+safe(currentOrder.order_no)+' 订货合同（A4）</title>'+
    '<link id="contractPrintCSS" rel="stylesheet" href="'+safe(cssURL)+'"></head><body>'+
    toolbar+paperMarkup(currentOrder)+'</body></html>');
  popup.document.close();
  const status=popup.document.getElementById('mpoPrintStatus');
  const printNow=()=>{
    if(popup.closed)return;
    popup.focus();
    popup.print();
  };
  popup.document.getElementById('mpoPrintNow').addEventListener('click',printNow);
  popup.document.getElementById('mpoPrintClose').addEventListener('click',()=>popup.close());
  const link=popup.document.getElementById('contractPrintCSS');
  const styleReady=new Promise(resolve=>{
    let done=false;
    const finish=ok=>{if(done)return;done=true;resolve(ok)};
    if(link.sheet){finish(true);return}
    link.addEventListener('load',()=>finish(true),{once:true});
    link.addEventListener('error',()=>finish(false),{once:true});
    popup.setTimeout(()=>finish(!!link.sheet),15000);
  });
  (async()=>{
    try{
      const loaded=await styleReady;
      if(!loaded){
        if(status)status.textContent='打印样式加载失败，请检查网络后点击刷新';
        return;
      }
      if(status)status.textContent='A4纵向 · 单页排版 · 公章42mm · 可打印或保存PDF';
      if(popup.document.fonts?.ready)await popup.document.fonts.ready;
      await Promise.all([...popup.document.images].map(img=>img.complete?Promise.resolve():
        new Promise(resolve=>{img.onload=resolve;img.onerror=resolve})));
      if(popup.closed)return;
      const paper=popup.document.querySelector('.mpo-paper');
      if(paper&&paper.classList.contains('mpo-short-contract')){
        paper.style.height='297mm';
        paper.style.minHeight='297mm';
        paper.style.overflow='hidden';
      }
      // Open the native print dialog after the stylesheet and all images are ready.
      popup.setTimeout(printNow,250);
    }catch(err){
      if(status)status.textContent='打印准备失败：'+(err?.message||err);
    }
  })();
};

      '<div class="mpo-stamp-manager"><b>甲方公章图片（仅接受上传的真实公章）</b>'+
      '<p class="small muted">支持PNG透明背景 / JPG / WebP，最大2MB。公章可能随合同打印输出，请确认用途和授权。</p>'+
      '<div id="mpoStampPreview">'+(p.has_stamp?'<img alt="已保存公章" class="mpo-stamp-manager-img" src="/api/material-contract-profile/stamp?v='+encodeURIComponent(p.updated_at||'')+'" onerror="this.style.display=\'none\';document.getElementById(\'mpoStampStatus\').textContent=\'公章记录存在，但图片读取失败，请重新选择上传\'">':'')+'</div>'+
      '<div id="mpoStampStatus" class="mpo-stamp-status '+(p.has_stamp?'is-saved':'')+'">'+(p.has_stamp?'✓ 公章已保存到云端，无需再次保存。需要更换时直接选择新图片。':'尚未保存公章，点击下方选择图片即可上传。')+'</div>'+
      '<div class="row" style="gap:8px;flex-wrap:wrap"><label class="btn primary" style="cursor:pointer">'+(p.has_stamp?'更换公章图片':'选择公章图片并上传')+
      '<input type="file" accept="image/png,image/jpeg,image/webp" id="mpoStampFile" style="display:none" onchange="uploadMaterialContractStamp()"></label>'+
      (p.has_stamp?'<button type="button" class="btn danger" onclick="deleteMaterialContractStamp()">删除已保存公章</button>':'')+'</div></div>');
    el('materialBuyerProfileForm').onsubmit=async e=>{
      e.preventDefault();const f=e.currentTarget,button=f.querySelector('button[type=submit]');
      button.disabled=true;
      try{await api('/material-contract-profile',{method:'PUT',body:JSON.stringify(Object.fromEntries(new FormData(f).entries()))});
        toastMsg('甲方资料已保存，今后新建合同自动引用');}
      catch(err){toastMsg('保存失败：'+err.message)}
      finally{button.disabled=false}
    };
  }catch(err){toastMsg('读取甲方资料失败：'+err.message)}
};
window.uploadMaterialContractStamp=async function(){
  const input=el('mpoStampFile'),file=input?.files?.[0];
  if(!file)return;
  if(file.size>2*1024*1024||!['image/png','image/jpeg','image/webp'].includes(file.type)){
    toastMsg('公章仅支持2MB以内PNG、JPG、WebP');input.value='';return
  }
  if(!confirm('请确认已获授权，并知悉当前工作台尚未配置严格登录保护。确认将此公章保存到云端吗？')){
    input.value='';return
  }
  const status=el('mpoStampStatus');
  input.disabled=true;
  if(status)status.textContent='正在上传和保存公章，请勿关闭窗口…';
  try{
    const fd=new FormData();fd.append('file',file);
    const response=await fetch('/api/material-contract-profile/stamp',{method:'POST',body:fd,cache:'no-store'});
    const payload=await response.json().catch(()=>({}));
    if(!response.ok)throw new Error(payload.error||'上传失败');
    await editMaterialContractProfile();
    toastMsg('公章已保存到云端，无需再次操作');
  }catch(err){
    if(status)status.textContent='上传未成功：'+err.message;
    toastMsg('公章保存失败：'+err.message)
  }finally{
    input.disabled=false;
    input.value='';
  }
};
window.deleteMaterialContractStamp=async function(){
  if(!confirm('确定删除云端保存的甲方公章吗？此前合同打印也将不再自动显示该公章。'))return;
  try{await api('/material-contract-profile/stamp',{method:'DELETE'});toastMsg('云端公章已删除');await editMaterialContractProfile()}
  catch(err){toastMsg('删除失败：'+err.message)}
};
window.receiveMaterialPurchase=async function(id){
  try{
    const o=await getOrder(id);
    const openItems=o.items.filter(it=>n(it.quantity)>n(it.received_qty));
    if(!openItems.length){toastMsg('该采购单已经全部入库');return}
    const rows=openItems.map(it=>{
      const remain=n(it.quantity)-n(it.received_qty);
      return '<div class="mpo-line mpo-receive" data-id="'+safe(it.id)+'"><b>'+safe(it.material_name)+'</b>'+
        '<div class="small muted">已入库 '+n(it.received_qty).toLocaleString()+' / 订货 '+n(it.quantity).toLocaleString()+'；剩余 '+remain.toLocaleString()+'</div>'+
        '<label>本次收货（'+safe(it.unit)+'）<input class="field mpo-rqty" type="number" min="0" max="'+remain+'" step="1" value="'+remain+'"></label></div>'
    }).join('');
    openModal('确认包材到货 · '+safe(o.order_no),'<div class="mpo-note" style="margin-bottom:12px">这里是唯一会增加包材库存的操作。确认后自动生成包材库存流水，不会更改成品库存。</div>'+
      '<form id="materialReceiveForm" class="form"><div class="full mpo-lines">'+rows+'</div>'+
      '<label class="full">收货备注<input class="field" name="notes" placeholder="质检记录、送货单号等"></label>'+
      '<div class="actions full"><button type="button" class="btn" onclick="closeModal()">取消</button><button class="btn primary">确认收货并入库</button></div></form>');
    // Retain the same request ID across retries so a network timeout cannot double receive.
    const receiptRequestId=crypto.randomUUID();
    el('materialReceiveForm').onsubmit=async e=>{
      e.preventDefault();
      const form=e.currentTarget;
      const items=[...form.querySelectorAll('.mpo-receive')].map(row=>({id:row.dataset.id,quantity:Number(row.querySelector('.mpo-rqty').value)})).filter(it=>it.quantity>0);
      if(!items.length){toastMsg('请填写至少一项入库数量');return}
      if(!confirm('确认将 '+items.reduce((s,x)=>s+x.quantity,0).toLocaleString()+' 件包装辅料计入库存并写入流水吗？'))return;
      const submit=form.querySelector('button[type=submit]');submit.disabled=true;
      try{await api('/material-purchase-orders/'+encodeURIComponent(id)+'/receive',{method:'POST',body:JSON.stringify({request_id:receiptRequestId,items,notes:form.querySelector('[name=notes]').value})});
        closeModal();await load(true);await loadPurchaseOrders();render();toastMsg('包材已入库，库存流水已记录')
      }catch(err){toastMsg('入库失败：'+err.message);submit.disabled=false}
    }
  }catch(e){toastMsg('读取收货明细失败：'+e.message)}
};
})();

/* MATERIAL_PURCHASE_JS_BUNDLE_END */
load().then(render).catch(e=>{setCloudSyncStatus(false,e.message);root.innerHTML='<div class="panel"><div class="empty" style="color:#b42318">云端数据加载失败：'+esc(e.message)+'<div class="small muted" style="margin-top:12px">为避免显示错误库存，已暂停使用浏览器旧缓存。请检查网络并点击刷新。</div><button class="btn" style="margin-top:12px" onclick="location.reload()">重新加载</button></div></div>';renderNav()})
</script>
